name: wip-sweep

# Deletes the WIP CI branches wip-ci.sh could not delete itself (after a KILL, or a failed deletion: its exit 3) once
# they are more than 6 h old (speed-wip-ci design §4, W4). Its one write is that deletion: wip-sweep.sh lists only
# refs/heads/wip/* at origin and deletes through push-lib.sh in wip mode, so only refs/heads/wip/<name>, and only
# while origin still holds the listed commit there. Tests: wip-sweep.test.sh and e2e/support/ci-workflow.test.ts.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: List what would be deleted and delete nothing
        type: boolean
        default: false

permissions: {}

concurrency:
  group: wip-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete wip/ branches more than 6 h old
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [[ $DRY_RUN == true ]]; then
            bash scripts/orchestration/wip-sweep.sh --dry-run
          else
            bash scripts/orchestration/wip-sweep.sh
          fi
