  description:
    instructions: <p>Use Haste toggle in attack prompt to trigger additional attack.</p>
    value: >-
      <p>When making a full attack action, you may make one extra attack with
      one natural or manufactured weapon at your highest base attack bonus. This
      effect is not cumulative with similar effects, such as that provided by a
      <em>speed</em> weapon.</p><p>You also gain a +1 bonus on attack rolls,
      dodge AC and Reflex saves.</p><p>All your modes of movement (including
      land, fly, burrow, climb and swim) increase by 30ft, to a maximum of twice
      your normal speed using that form of movement. This increase counts as an
      enhancement bonus, and it affects the creature’s jumping distance as
      normal for increased speed.</p><p>See
      @UUID[Compendium.pf1.spells.Item.s9amdo5398alb5p0] for more details.</p>
