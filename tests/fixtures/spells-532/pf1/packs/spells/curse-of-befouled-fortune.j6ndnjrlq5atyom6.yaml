  description:
    value: >-
      <p>You curse the target, making it incredibly unlucky. While affected by
      <i>Curse of Befouled Fortune</i>, the target can't receive luck bonuses or
      benefit from effects that grant it the ability to roll multiple times and
      take the higher result (like the swashbuckler's charmed life ability). The
      target also can't choose a die result, such as taking 10 or 20 in lieu of
      rolling (as per the bard's lore master ability). Finally, the first time
      each turn the target would succeed at an attack, saving throw, or skill
      check, it must roll twice and use the worse of the two results.  This
      curse cannot be dispelled, but it can be removed with a <i>break
      enchantment</i>, <i>limited wish</i>, <i>miracle</i>, <i>remove curse</i>,
      or <i>wish</i> spell.</p>
