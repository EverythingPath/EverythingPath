  description:
    value: >-
      <p>This spell infuses a spark of magical energy into the veins of the
      target, allowing it to feel the presence of magic the way one might feel
      the thrum of vibrations in the air. For the spell’s duration, the target
      gains the benefits of the spell
      @UUID[Compendium.pf1.spells.uqh87jz757r2cb7r]{detect magic} and also gains
      a +5 enhancement bonus on
      @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.VRD7jxiIAxKPt6EF]{Spellcraft}
      checks to identify the properties and command words of magic items.
      Further, the target can attempt such checks untrained while under the
      effects of this spell. This ability does not allow the target to identify
      artifacts.</p>
