  description:
    value: >-
      <p>You become one with the plane around you, attaining knowledge of the
      surrounding territory. You instantly gain knowledge of as many as three
      facts from among the following subjects: areas with different planar
      traits, the layout and topography of local terrain, local divine
      influences, planar phenomena, portals between planes, presence of
      creatures native to the plane, presence of powerful nonnative creatures,
      the general state of the plane, or valuable planar substances.  On
      standard planes, the spell operates with a radius of 1 mile per caster
      level. On demiplanes, the spell is less powerful, and its radius is
      limited to 100 feet per caster level. This spell has no effect when cast
      on the Material Plane.</p>
