  description:
    value: >-
      <p>At 10th level, the bard can use any skill, even if the skill normally
      requires him to be trained. At 16th level, the bard considers all skills
      to be class skills. At 19th level, the bard can take 10 on any skill
      check, even if it is not normally allowed.</p>
