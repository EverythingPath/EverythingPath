img: systems/pf1/icons/skills/yellow_10.jpg
name: Improved Awesome Blow
system:
  abilityType: ex
  associations:
    classes:
      - Brawler
  description:
    value: >-
      <p>At 20th level, the brawler can use her awesome blow ability as an
      attack rather than as a standard action. She may use it on creatures of
      any size. If the maneuver roll is a natural 20, the brawler can
      immediately attempt to confirm the critical by rolling another combat
      maneuver check with all the same modifiers as the one just rolled; if the
      confirmation roll is successful, the attack deals double damage, and the
      damage from hitting an obstacle (if any) is also doubled.</p>
  subType: classFeat
type: feat
