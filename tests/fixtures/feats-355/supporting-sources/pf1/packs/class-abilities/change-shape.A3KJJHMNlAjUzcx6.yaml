    value: >-
      <p>At 8th level, you can change your shape for a number of rounds per day
      equal to your wizard level. These rounds do not need to be consecutive.
      This ability otherwise functions like
      @UUID[Compendium.pf1.spells.774kmgcb7ygviht0]{Beast Shape II} or
      @UUID[Compendium.pf1.spells.pawbnw1nm4f0b98e]{Elemental Body I}. At 12th
      level, this ability functions like
      @UUID[Compendium.pf1.spells.w88ddxpu89qcr5c0]{Beast Shape III} or
      @UUID[Compendium.pf1.spells.yldjnorgbx4jsldz]{Elemental Body II}.</p>
