name: Burst Bonds
system:
  actions:
    - _id: utexc6j809ibbxpx
      actionType: spellsave
      activation:
        type: standard
        unchained:
          cost: 2
          type: action
      duration:
        units: inst
      name: Use
      range:
        units: touch
      save:
        description: Fortitude half (object)
        type: fort
      target:
        value: one object or creature restraining you
  components:
    verbal: true
  description:
    value: >-
      <p>You blast your restraints with divine wrath, dealing 1d6 points of
      damage per caster level to the target object (maximum 5d6), ignoring
      hardness of 10 or less. A Fortitude save halves the damage, although only
      magical restraints receive a saving throw.</p><p>You can also target a
      creature that is grappling or otherwise restraining you (such as by
      adhesive or the swallow whole ability) with the spell. You don't need to
      make a touch attack to use <i>burst bonds</i> against a creature, and you
      can cast this spell without making a concentration check while grappled or
      pinned. The creature does not take damage as above. If you are grappled
      and your target fails its save, you may make an immediate attempt to break
      the grapple (but not reverse it) as a free action, with a +1 luck bonus to
      your CMB per caster level (maximum +5). If the target creature fails its
      save and you are restrained by an ability that originally allowed a saving
      throw, <i>burst bonds</i> allows a new saving throw with a +1 luck bonus
      per two caster levels (maximum +5).</p>
  learnedAt:
    class:
      inquisitor: 1
  school: evo
