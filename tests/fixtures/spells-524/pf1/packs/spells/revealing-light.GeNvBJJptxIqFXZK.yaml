  description:
    value: >-
      <p>The touched object emits a shimmering light (as per
      @UUID[Compendium.pf1.spells.ip9onjfp6nf1vlv9]{light}) that causes shadows
      to shift constantly in a 20-foot radius. Creatures lose any racial bonus
      on
      @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.wRWHk7tCUHR99PzD]{Stealth}
      checks while in the area, and the light suppresses any bonuses on Stealth
      checks granted by visual camouflage (such as from camouflage
      netting<sup>UE</sup> or the
      @UUID[Compendium.pf1.class-abilities.58JR74Tzt6zxEJmE]{camouflage} rogue
      talent). The unpredictable light patterns also interfere with spells and
      effects of the pattern subschool, granting all creatures in the area a +2
      bonus on saves against such effects.</p>
