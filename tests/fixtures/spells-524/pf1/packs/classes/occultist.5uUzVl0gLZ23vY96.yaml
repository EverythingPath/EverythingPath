  description:
    value: >-
      <p>The occultist focuses on the world around him, grounded in the powers
      that flow throughout his environment. He studies the magic that infuses
      everything, from psychic resonances left in everyday items to powerful
      incantations that fuel the mightiest spells.</p><p>The occultist channels
      his psychic might through implements—items that allow him to focus his
      power and produce incredible effects. For him, implements are more than
      simple tools. They are a repository of history and a tie to the events of
      the past. The occultist uses these implements to influence and change the
      present, adding his legend to theirs. Though some of these implements
      might be magic items in their own right, most of them are merely of
      historical or personal significance to the
      occultist.</p><p><strong>Role:</strong> Occultists are always eager to
      travel in the company of adventurers, explorers, and archaeologists, as
      those three groups of people have a knack for finding items with rich
      histories and great significance.</p><h2>Class Skills</h2><p>The
      occultist’s class skills are Appraise (Int), Craft (Int), Diplomacy (Cha),
      Disable Device (Dex), Disguise (Cha), Fly (Dex), Knowledge (arcana) (Int),
      Knowledge (engineering) (Int), Knowledge (history) (Int), Knowledge
      (planes) (Int), Knowledge (religion) (Int), Linguistics (Int), Perception
      (Wis), Profession (Wis), Sense Motive (Wis), <em>Sleight of Hand</em>
      (Dex), Spellcraft (Int) ,and <em>Use Magic Device</em> (Cha).</p>
