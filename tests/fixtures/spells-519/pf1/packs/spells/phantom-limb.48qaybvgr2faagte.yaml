          cost: 2
          type: action
      duration:
        units: spec
        value: 24 hours; see text
      name: Use
      range:
        units: touch
      target:
        value: one creature
  components:
    somatic: true
    verbal: true
  description:
    value: >-
      <p>This spell creates a semi-visible psychic manifestation that allows a
      creature to replace a missing body part or parts. This could be as simple
      as a missing finger or toe or as complex as one or more limbs or even a
      set of wings. The creature can use these ghostly appendages exactly as if
      they were the creature's own limbs, including any natural attacks or other
      special abilities. This includes any extraordinary abilities granted by
      the appendages, but not supernatural ones.  If the target does not need a
      replacement limb (or chooses not to use the spell in this way), it can
      instead select one of the following options. In this case, the spell lasts
      only for 10 minutes per level. <b>Extra Arms</b>: The target grows two
      phantom arms, granting it two extra natural claw attacks; the target
      cannot use the phantom arms for any other purpose. <b>Extra Legs</b>: The
      target grows two phantom legs and strong hindquarters like those of a
      horse, granting it a +30-foot enhancement bonus to speed and a +4 bonus to
      its CMD against overrun and trip combat maneuvers.  Mermaid's Tail: The
      target grows a phantom tail, granting it a swim speed of 60 feet.
      <b>Phantom Wings</b>: The target grows phantom wings, granting it a fly
      speed of 60 feet (good maneuverability).</p>
  learnedAt:
    class:
