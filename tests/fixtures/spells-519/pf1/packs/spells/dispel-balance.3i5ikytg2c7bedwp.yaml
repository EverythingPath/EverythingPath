    verbal: true
  description:
    value: >-
      <p>Pulsing bronze energy surrounds you, bestowing three effects.  First,
      you gain a +3 deflection bonus to AC against attacks by chaotic neutral,
      lawful neutral, neutral evil, and neutral good creatures. Against attacks
      by creatures whose alignment is neutral with no other alignment
      components, this deflection bonus is instead +5.  Second, upon making a
      successful melee touch attack against a creature from another plane with a
      neutral component to its alignment, you can banish that creature back to
      its home plane. The creature's spell resistance applies to this attempt,
      and the creature can negate this effect with a successful Will save. If
      the creature's alignment is neutral with no other alignment components,
      the creature takes a -2 penalty on this saving throw. This use discharges
      and ends the spell.  Third, with a touch, you can automatically dispel any
      one enchantment spell cast by a creature with a neutral component to its
      alignment. Spells that can't be dispelled by <i>dispel magic</i> also
      can't be dispelled by <i>dispel balance</i>. Saving Throws and spell
      resistance do not apply to this effect. This use discharges and ends the
      spell.</p>
