  description:
    value: >-
      <p>You touch the target and place it into a deathlike state that persists
      for the duration. The target appears to be dead, and any creature that
      interacts with the target must succeed at a DC 20 Heal check to recognize
      it is actually alive.</p><p>Until the spell ends, the target counts as if
      it were dead for the purpose of resolving any effects that target or
      affect only living creatures, but it doesn't count as undead. The subject
      is helpless, and can still be killed normally.</p><p>Any effect that would
      bring the creature back to life or animate it as an undead fails, but ends
      the <em>catatonia</em>. The target can be affected by spells that affect
      only objects, including <em>animate objects</em> (if the creature is
      Small) and <em>teleport object</em>. However, anything that would cause
      the body to change form (such as <em>shrink</em> item) fails and ends the
      <em>catatonia</em>. This doesn't prevent the effects of spells that simply
      deal damage or otherwise destroy objects.</p>
