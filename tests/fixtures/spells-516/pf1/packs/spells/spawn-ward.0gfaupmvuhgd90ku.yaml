  description:
    value: >-
      <p>The target becomes resistant to the effects of energy drain and blood
      drain attacks made by undead creatures, and cannot be made into undead
      spawn if killed while the spell is in effect.</p><p>If the attacking
      undead's Hit Dice is less than or equal to your caster level, the blood
      drain or energy drain has no effect. If the attacking undead's Hit Dice
      are greater than your caster level, the undead must make a Fortitude save
      (against the DC of the spell) with each attack for those special abilities
      to have any effect. The spell only prevents the Constitution damage from
      blood drain and negative levels from energy drain, but not any other
      effects of these attacks.</p>
