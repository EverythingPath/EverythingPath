  description:
    value: >-
      <p>This spell functions like
      @UUID[Compendium.pf1.spells.Item.wu4y1ilg6iq28cr6]{interposing hand},
      except that the hand can also push or strike one opponent that you select.
      The floating hand can move as far as 60 feet and can attack in the same
      round. Since this hand is directed by you, its ability to notice or attack
      invisible or concealed creatures is no better than yours.</p><p>The hand
      attacks once per round, and its attack bonus equals your caster level +
      your Intelligence, Wisdom, or Charisma modifier (for a wizard, cleric, or
      sorcerer, respectively) + 11 for the hand's Strength score (33), -1 for
      being Large. The hand deals 1d8+11 points of damage on each attack, and
      any creature struck must make a Fortitude save (against this spell's save
      DC) or be stunned for 1 round. Directing the spell to a new target is a
      move action.</p><p>The <em>clenched fist</em> can also interpose itself as
      <em>interposing hand</em> does, or it can bull rush an opponent as
      @UUID[Compendium.pf1.spells.Item.aoov6nqfm195txdb]{forceful hand} does.
      Its CMB for bull rush checks uses your caster level in place of its base
      attack bonus, with a +11 bonus for its Strength score and a +1 bonus for
      being Large.</p>
