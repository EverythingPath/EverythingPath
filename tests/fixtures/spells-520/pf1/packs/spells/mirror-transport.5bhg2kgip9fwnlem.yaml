    value: >-
      <p>This spell functions as
      @UUID[Compendium.pf1.spells.Item.lsmtsbph1d14fq0r]{mirror hideaway},
      except any creature that enters the target mirror can spend a swift action
      to exit through another mirror within 500 feet as if using <em>dimension
      door</em>; this is a one-way transport. The creature can exit through a
      mirror only if it could fit through an opening the same size as the
      mirror. Each transport through the target mirror reduces the spell's
      duration by 1 hour.</p>
