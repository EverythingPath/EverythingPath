  description:
    value: >-
      <p>This spell functions as
      @UUID[Compendium.pf1.spells.Item.g0x2fnktg1553wv1]{symbol of death},
      except that all creatures within 60 feet are affected with uncontrollable
      laughter (as <em>hideous</em> laughter) for 1 round per caster
      level.</p><p>Unlike <em>symbol of death</em>, <em>Symbol of Laughter</em>
      has no hit point limit; once it is triggered, a <em>Symbol of
      Laughter</em> remains active for 1 minute per caster
      level.</p><p><em>Symbol of Laughter</em> can be made permanent with a
      <em>permanency</em> spell by a caster of 10th level or higher at a cost of
      5,000 gp.</p>
