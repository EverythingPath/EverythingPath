  description:
    value: >-
      <p>This spell creates a large mass of frozen holy water that can be used
      for one of two effects.</p><p><i>Holy Ice</i> Wall: This functions like
      <i>Wall of Ice</i> (hemisphere or plane). Any creature that takes damage
      from holy water takes 1 point of damage every time it touches or attacks
      the ice wall with melee attacks; extended contact with the wall (such as
      standing or walking on it) deals 1d6 points of damage. Even when the ice
      has been broken through, a sheet of frigid holy air remains. Any creature
      that steps through it (including the one who broke through the wall) takes
      1d6 points of damage + 1 point per caster level (no save); half of this
      damage is cold damage, half is damage from holy water (creatures unharmed
      by holy water do not take the damage).</p><p><i>Holy Ice</i> Javelins: The
      spell creates a number of javelins of frozen holy water in your square
      equal to your caster level (maximum 15), which hurl themselves toward one
      or more targets that are no more than 10 feet away from each
      other.</p><p>You must succeed on attack rolls (one per javelin) to hit the
      target with the javelin, using your base attack bonus + your Wisdom
      modifier. The javelins deal 1d6 damage each, plus 1 point of cold damage
      and 1 point of damage from holy water.</p><p>The javelins are destroyed by
      this attack.</p>
