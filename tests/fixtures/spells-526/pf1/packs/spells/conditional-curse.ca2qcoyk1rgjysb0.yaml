  description:
    value: >-
      <p>This spell functions as
      @UUID[Compendium.pf1.spells.Item.lsboosfk26m0ycqv]{bestow curse}, except
      that you must state a condition under which the curse is broken, ending
      its effect. An intelligent target, even one of animal intelligence,
      innately understands this condition even if it doesn't understand your
      language. The condition must be possible for the target to bring about
      within a year and a day without ensuring its own death and stated in 25 or
      fewer words. The curse is more difficult to remove via magic. The DC to
      remove <em>conditional curse</em> with <em>break enchantment</em> or
      <em>remove curse</em> increases by 5.</p>
