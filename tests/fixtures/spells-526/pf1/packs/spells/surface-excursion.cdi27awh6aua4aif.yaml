  description:
    value: >-
      <p>You instantly transport yourself and touched allies onto the nearest
      sky-facing surface directly above you. The destination surface may be
      solid ground or the surface of a body of water (or other liquid),
      depending on your position. If reaching the surface would require crossing
      planar boundaries or no sky-facing surface exists directly above your
      position, the spell fails and has no effect.  When the spell is cast, a
      magical beacon appears at both your departure and arrival points,
      suspended 3 feet in the air. These beacons are invisible to everyone but
      you and those allies touched when the spell was cast. You and every
      creature originally targeted by the spell can touch the beacon at your
      arrival point to teleport back to your original departure point. Each
      creature that chooses to return in this manner is transported to a free
      space adjacent to the beacon at your original departure point. If the area
      around the departure beacon is occupied by a solid body (for instance,
      rubble from a cave-in), then you and each creature traveling with you take
      1d6 points of damage and are shunted to a random open space on a solid
      surface within 100 feet of the beacon. If there is no free space within
      100 feet, the spell effect ends with no return transportation.</p>
