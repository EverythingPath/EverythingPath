  description:
    value: >-
      <p>You animate the target's shadow with semi-living energies drawn from
      the Shadow Plane, instilling a maddening hunger for its owner's life
      energy within it. If the target fails its Will save, it takes 1d4 points
      of Strength damage as a quasi-real shadow manifests in its space and
      attacks it. This shadow remains attached to the target and moves wherever
      the target moves.  At the start of each subsequent round, the target must
      succeed at a Reflex save or take 1d4 additional points of Strength damage;
      a successful save reduces the Strength damage to 1 point. If its Strength
      score is reduced to 0 by this spell's effects, the target dies. If the
      target is in bright light, it gains a +2 bonus on Reflex saves against
      this spell. If the target is in darkness, it takes a -2 penalty on Reflex
      saves against this spell.</p>
