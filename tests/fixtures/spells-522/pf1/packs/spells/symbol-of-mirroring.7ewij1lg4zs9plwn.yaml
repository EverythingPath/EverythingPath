  description:
    value: >-
      <p>This spell functions as
      @UUID[Compendium.pf1.spells.Item.g0x2fnktg1553wv1]{symbol of death},
      except it instead creates one illusory duplicate of each creature within
      60 feet of the symbol. These duplicates function as <em>mirror image</em>,
      moving with the original creatures and mimicking their movements, sounds,
      and actions exactly. If an illusory double is destroyed, a new one appears
      on the creature's turn. The images last for as long as a creature remains
      within 60 feet of the symbol, and for 1 round/level thereafter. Once
      triggered, the symbol remains active for 10 minutes per caster
      level.</p><p><em>Symbol of mirroring</em> can be made permanent with a
      <em>permanency</em> spell by a caster of 10th level or higher for the cost
      of 5,000 gp.</p>
