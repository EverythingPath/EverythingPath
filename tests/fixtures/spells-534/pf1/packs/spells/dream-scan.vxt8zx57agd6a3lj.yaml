  description:
    value: >-
      <p>This spell functions as
      @UUID[Compendium.pf1.spells.Item.ifcnx1yyw6e7ousm]{dream}, but rather than
      sending a message to a sleeping target, you can instead read the target's
      thoughts. The target must be asleep for you to perform a <em>dream</em>
      scan, though if the target isn't asleep, you can wait in a trance until
      your target falls asleep. Once the target is asleep, you can concentrate
      in order to read its surface thoughts as if using <em>detect
      thoughts</em>. You can continue concentrating for up to 1 minute per
      caster level.</p><p>Instead of reading surface thoughts, you can choose to
      scan the target's <em>dream</em>s and subconscious mind for the answers to
      questions. For every minute you spend concentrating, you can obtain the
      answer to one question, though the answers might be brief, cryptic, or
      repetitive. The target is entitled to a new Will save to end the
      <em>dream</em> scan each time you ask it a question. Otherwise, the
      creature can attempt a Bluff check with a DC equal to 11 + your Sense
      Motive modifier. If it fails its Bluff check, you gain the information you
      desire. If it succeeds at its check, you gain no information. If it
      succeeds at its check by 5 or more, you misinterpret the target's
      <em>dream</em>s- you draw a false conclusion of the target's choice and
      believe that wrong answer to be true.</p><p>Unlike with <em>dream</em>,
      you can't cast this spell on another creature to have it serve as your
      messenger.</p>
