  description:
    value: >-
      <p>Grim and determined, the inquisitor roots out enemies of the faith,
      using trickery and guile when righteousness and purity is not enough.
      Although inquisitors are dedicated to a deity, they are above many of the
      normal rules and conventions of the church. They answer to their deity and
      their own sense of justice alone, and are willing to take extreme measures
      to meet their goals.</p><p><strong>Role</strong>: Inquisitors tend to move
      from place to place, chasing down enemies and researching emerging
      threats. As a result, they often travel with others, if for no other
      reason than to mask their presence. Inquisitors work with members of their
      faith whenever possible, but even such allies are not above
      suspicion.</p><p><strong>Alignment</strong>: An inquisitor’s alignment
      must be within one step of her deity’s, along either the law/chaos axis or
      the good/evil axis.</p><h2>Class Skills</h2><p>The inquisitor’s class
      skills are Bluff (Cha), Climb (Str), Craft (Int), Diplomacy (Cha),
      Disguise (Cha), Heal (Wis), Intimidate (Cha), Knowledge (arcana) (Int),
      Knowledge (dungeoneering) (Int), Knowledge (nature) (Int), Knowledge
      (planes) (Int), Knowledge (religion) (Int), Perception (Wis), Profession
      (Wis), Ride (Dex), Sense Motive (Wis), Spellcraft (Int), Stealth (Dex),
      Survival (Wis), and Swim (Str).</p>
