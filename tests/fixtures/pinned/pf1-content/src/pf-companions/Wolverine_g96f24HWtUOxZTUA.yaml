      description:
        value: >-
          <p>Add this modifier to the animal companion's Strength and Dexterity
          scores.&nbsp;</p>
      subType: classFeat
    type: feat
  - _id: YBmJecAAUBgoL2kr
    _key: '!actors.items!g96f24HWtUOxZTUA.YBmJecAAUBgoL2kr'
