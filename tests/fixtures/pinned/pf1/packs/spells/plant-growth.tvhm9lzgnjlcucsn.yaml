  description:
    value: >-
      <p><em>Plant growth</em> has different effects depending on the version
      chosen.</p><p><strong>Overgrowth</strong><em>:</em> This effect causes
      normal vegetation (grasses, briars, bushes, creepers, thistles, trees,
      vines, and so on) within long range (400 feet + 40 feet per caster level)
      to become thick and overgrown.</p><p>The plants entwine to form a thicket
      or jungle that creatures must hack or force a way through. Speed drops to
      5 feet, or 10 feet for Large or larger creatures. The area must have brush
      and trees in it for this spell to take effect. If this spell is cast on an
      area that is already affected by any spell or effect that enhances plants,
      such as <em>entangle</em> or <em>Wall of Thorns,</em> any DC involved with
      these spells is increased by 4.</p><p>This bonus is granted for 1 day
      after the casting of <em>plant growth.</em></p><p>At your option, the area
      can be a 100-foot-radius circle, a 150-foot-radius semicircle, or a
      200-foot-radius quarter circle.</p><p>You may designate places within the
      area that are not affected.</p><p><strong>Enrichment</strong><em>:</em>
      This effect targets plants within a range of a halfmile, raising their
      potential productivity over the course of the next year to one-third above
      normal.</p><p><em>Plant growth</em> counters <em>diminish
      plants</em>.</p><p>This spell has no effect on plant creatures.</p>
