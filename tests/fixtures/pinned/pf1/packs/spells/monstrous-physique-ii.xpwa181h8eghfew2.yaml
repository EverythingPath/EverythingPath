  description:
    value: >-
      <p>This spell functions as
      @UUID[Compendium.pf1.spells.Item.m0q7u2z421ja82oz]{monstrous physique I},
      except it also allows you to assume the form of a Tiny or Large creature
      of the monstrous humanoid type. If the form you assume has any of the
      following abilities, you gain the listed ability: climb 60 feet, fly 60
      feet (good maneuverability), swim 60 feet, darkvision 60 feet, low-light
      vision, scent, freeze, grab, leap attack, mimicry, pounce, sound mimicry,
      speak with sharks, and trip. If the creature has the undersized weapons
      special quality, you gain that quality. <em>Tiny monstrous humanoid</em>:
      If the form you take is that of a <br /><em>Tiny monstrous humanoid</em>,
      you gain a +4 size bonus to your Dexterity, a -2 penalty to your Strength,
      and a +1 natural armor bonus. <br /><em>Large monstrous humanoid</em>: If
      the form you take is that of a <em>Large monstrous humanoid</em>, you gain
      a +4 size bonus to your Strength, a -2 penalty to your Dexterity, and a +4
      natural armor bonus.</p>
