  description:
    value: >-
      <p>The recipient of this spell can find the shortest, most direct physical
      route to a prominent specified destination, such as a city, keep, lake, or
      dungeon. The locale can be outdoors or underground, as long as it is
      prominent. For example, a hunter's cabin is not prominent enough, but a
      logging camp is. <i>Find the path</i> works with respect to locations, not
      objects or creatures at a locale. The location must be on the same plane
      as the subject at the time of casting. The spell enables the subject to
      sense the correct direction that will eventually lead it to its
      destination, indicating at appropriate times the exact path to follow or
      physical actions to take. For example, the spell enables the subject to
      sense what cavern corridor to take when a choice presents itself. The
      spell ends when the destination is reached or the duration expires,
      whichever comes first. <i>Find the path</i> can be used to remove the
      subject and its companions from the effect of a <i>maze</i> spell in a
      single round, specifying the destination as "outside the <i>maze</i>."
      This divination is keyed to the recipient, not its companions, and its
      effect does not predict or allow for the actions of creatures (including
      guardians) who might take action to oppose the caster as he follows the
      path revealed by this spell.</p>
