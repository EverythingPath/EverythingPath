  description:
    value: >-
      <p>This spell functions as
      @UUID[Compendium.pf1.spells.Item.0axqb92kzlesc24q]{imbue with spell
      ability}, with the following exceptions: only bard spells of the
      conjuration (healing), enchantment, and transmutation schools can be
      transferred; the imbued spells last for 1 day; and the subject isn't
      beholden to any principles regarding the imbued spells' use. As part of
      the casting, the caster must shed some of his blood (or an equivalent
      humor). If the caster isn't susceptible to bleed damage, regardless of the
      reason, he can't cast <em>blood song</em>. For each spell that is imbued
      using <em>blood song</em>, the caster loses 5 hit points, which can't be
      regained by any means until the spell ends or is discharged.</p>
