  description:
    value: >-
      <p>You turn a number of normal-sized centipedes, scorpions, or spiders
      into their giant counterparts (see the <i>Pathfinder RPG Bestiary</i>).
      Only one type of vermin can be transmuted (so a single casting cannot
      affect both a centipede and a spider). The number of vermin which can be
      affected by this spell depends on your caster level, as noted on the table
      below.</p><p>Giant vermin created by this spell do not attempt to harm
      you, but your control of such creatures is limited to simple commands
      ("Attack," "Defend," "Stop," and so forth). Orders to attack a certain
      creature when it appears or guard against a particular occurrence are too
      complex for the vermin to understand. Unless commanded to do otherwise,
      the giant vermin attack whomever or whatever is near
      them.</p><table><tbody><tr><th>Caster
      Level</th><th>Centipedes</th><th>Scorpions</th><th>Spiders</th></tr><tr><td>9th
      or
      lower</td><td>3</td><td>1</td><td>2</td></tr><tr><td>10th-13th</td><td>4</td><td>2</td><td>3</td></tr><tr><td>14th-17th</td><td>6</td><td>3</td><td>4</td></tr><tr><td>18th-19th</td><td>8</td><td>4</td><td>5</td></tr><tr><td>20th
      or higher</td><td>12</td><td>6</td><td>8</td></tr></tbody></table>
  learnedAt:
