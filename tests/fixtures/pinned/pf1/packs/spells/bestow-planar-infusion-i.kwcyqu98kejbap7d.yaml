  description:
    value: >-
      <p>This spell draws upon the latent planar energy of the caster's
      surroundings, allowing her to temporarily infuse a creature with the
      plane's power.</p><p>The touched creature gains that plane's basic
      infusion for the spell's duration. This spell has no effect if cast on the
      Material Plane, and it ends as soon as the spell's target leaves the plane
      with which it has been infused. Details on planar infusions can be found
      in each plane's Infusion section, as presented in Chapter 3 of this book.
      Once a creature gains the benefits of <em>bestow planar infusion I</em>,
      it remains attuned to that plane for 24 hours. Additional castings of
      <em>bestow planar infusion I</em> during this time bestow the same
      infusion that was granted by the initial casting that day. Planar
      infusions that can be used a limited number of times per day are not
      refreshed by multiple castings of <em>bestow planar infusion I</em>.</p>
