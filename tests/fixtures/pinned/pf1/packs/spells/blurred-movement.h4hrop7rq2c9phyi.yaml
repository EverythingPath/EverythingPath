  description:
    value: >-
      <p>This spell functions as
      @UUID[Compendium.pf1.spells.Item.18kryvj2dfuymk9d]{blur}, except that the
      <em>blur</em>ring occurs only when you move at least 10 feet on your turn
      and ceases at the end of your movement. It is therefore mainly used to
      thwart attacks on your turn, such as attacks of opportunity. If you move
      at least twice your speed on your turn, the <em>blur</em>ring lasts until
      the start of your next turn.</p>
