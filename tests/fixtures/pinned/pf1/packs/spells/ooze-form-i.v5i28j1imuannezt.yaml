  description:
    value: >-
      <p>You assume the form of a Small or Medium ooze. Regardless of the type
      of ooze you transform into, you gain base speed 10 feet, climb speed 10
      feet, swim speed 20 feet, and blindsense 30 feet. You gain a +4 resistance
      bonus on saving throws against mindaffecting effects and poison. A wood or
      metal weapon that strikes you takes acid damage as if from your slam
      unless the wielder succeeds at a Reflex saving throw.</p><p><b>Small
      Ooze</b>: If you assume this form, you gain a +4 size bonus to your
      Constitution score, a slam attack (1d3 plus 1d3 acid), and constrict
      (1d3), and take , a -4 penalty to your Dexterity score.</p><p><b>Medium
      Ooze</b>: If you assume this form, you gain a +6 size bonus to your
      Constitution score, a -6 penalty to your Dexterity score, a slam attack
      (1d4 plus 1d4 acid), and constrict (1d4).</p>
