  description:
    value: >-
      <p><i>Fumblestep</i> coats a target's feet in slick ectoplasm that retains
      some psychic connection to your mind. While the spell remains in effect,
      the target creature takes a -1 penalty on Reflex saving throws and
      Acrobatics checks.  At any point during the spell's duration while the
      target remains in range, you can discharge the spell as a standard action,
      mentally tugging at the ectoplasm to perform a trip combat maneuver, using
      your caster level instead of your base attack bonus, and using your
      Charisma, Intelligence, or Wisdom modifier, whichever is highest, instead
      of your Strength modifier. This trip attempt does not provoke an attack of
      opportunity and cannot be affected by feats or other means of altering a
      trip combat maneuver's effects.</p>
