  description:
    value: >-
      <p>This spell functions as
      @UUID[Compendium.pf1.spells.Item.zqj5qzyl46af27v0]{suggestion}, except you
      can use it only to specify a condition that triggers a special activity,
      and the subject does not remember that you made the
      <em>suggestion</em>.</p><p>For example, you could use triggered
      <em>suggestion</em> on a palace guard to make him attack the king the next
      time he and the king are alone, and the guard would not remember the
      <em>suggestion</em> to do so until the trigger occurred.</p>
