    unidentified: >-
      <h3>Statistics</h3><p><b>Damage</b> 1d4 (small), 1d6 (medium);
      <b>Critical</b> x4; <b>Range</b> 10 ft.; <b>Type</b> P</p>

      <p><b>Misfire</b> 1-4 (5 ft.); <b>Capacity</b> 1</p>

      <h3>Description</h3>

      <p>This primitive firearm is merely a long tube that, when ignited,
      propels forth a short gout of flame and a javelin. Unlike other firearms,
      the fire lance is wildly imprecise, and targets AC rather than touch AC. A
      fire lance is always treated as having the broken condition for the
      purpose of determining the effects of a misfire. A fire lance uses a
      javelin and 2 doses of black powder as ammunition.</p>
