  description:
    value: >-
      <p>This kit contains lockpicks and other tools you need to use the
      @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.cSdUATLHBFfw3v4s]{Disable
      Device} skill. Without these tools, you must use improvised tools, and you
      take a -2 circumstance penalty on Disable Device checks.</p><p>Smaller and
      made of stronger materials than most <em>thieves' tools</em>, the items in
      this kit are much easier to conceal. You gain a +4 bonus on
      @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.joza8kAIiImrPft7]{Sleight
      of Hand} skill checks to conceal these tools on your body. They otherwise
      function as masterwork thieves tools (granting a +2 <em>circumstance
      bonus</em> on Disable Device checks).</p>
