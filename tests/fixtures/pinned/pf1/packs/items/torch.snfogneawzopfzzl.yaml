system:
  actions:
    - _id: 7IkvstJGhp2Kfl21
      activation:
        type: full
        unchained:
          cost: 3
          type: action
      name: Enlight (using flint and steal)
      tag: ignite
    - _id: KNOoanyFVJlRjrdg
      ability:
        attack: str
        damage: str
        damageMult: 1
      actionType: mwak
      activation:
        type: attack
        unchained:
          type: attack
      attackBonus: '-2[Improvised Weapon]'
      damage:
        parts:
          - formula: sizeRoll(1, 3, @size)
            types:
              - bludgeoning
          - formula: '1'
