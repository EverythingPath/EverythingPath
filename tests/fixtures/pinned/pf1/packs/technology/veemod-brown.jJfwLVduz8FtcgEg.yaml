      <h3>Statistics</h3><p><strong>Slot</strong> veemod
      goggles</p><p><strong>Capacity</strong> -; <strong>Usage</strong>
      varies</p><h3>Description</h3><p>A veemod ("vision enhancement module") is
      a narrow crystalline strip that slots into a set of veemod goggles to
      enhance the goggles' use. Inserting a veemod into a pair of goggles is a
      standard action that provokes attacks of opportunity. Veemods are
      color-coded items, and provide the following benefits.</p><p><strong>Brown
      Veemod</strong>: This veemod darkens the goggles' lenses, providing a +1
      circumstance bonus on all saving throws against bright light effects that
      cause dazzling or blindness. When worn, they also allow creatures impacted
      by light blindness or light sensitivity to see normally in areas of bright
      light.</p><table><tbody><tr><td><p><strong>Color</strong></p></td><td><p><strong>Effect</strong></p></td><td><p><strong>Usage</strong></p></td></tr><tr><td><p>Brown</p></td><td><p>Flash
