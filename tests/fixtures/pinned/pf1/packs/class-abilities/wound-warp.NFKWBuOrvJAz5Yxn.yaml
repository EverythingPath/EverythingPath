  description:
    value: >-
      <p>At 15th level, you gain the ability to travel across the battlefield by
      literally erupting from the fatal wounds of deceased creatures. As a
      <em>standard action</em> once per day, you can <em>teleport</em> to an
      unoccupied square adjacent to any <em>dead</em> creature within 10 feet
      per <em>caster level</em>. Any creatures adjacent to the square you
      <em>teleport</em> to take 4d6 points of acid damage as you burst into
      being and shower them with acidic bile. Creatures that make successful
      <em>Reflex</em> saves (DC 10 + 1/2 your <em>sorcerer</em> level + your
      <em>Charisma</em> modifier) take half damage. This ability otherwise
      functions like @UUID[Compendium.pf1.spells.ojwg1ki98tq8xyh9]{Dimension
      Door}. At 20th level, you can use this ability twice per day.</p>
