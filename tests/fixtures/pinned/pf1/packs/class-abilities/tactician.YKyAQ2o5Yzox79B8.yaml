  description:
    value: >-
      <p>At 1st level, a cavalier receives a <a
      href="https://aonprd.com/Feats.aspx?Category=Teamwork">teamwork feat</a>
      as a bonus feat. He must meet the prerequisites for this feat. As a
      standard action, the cavalier can grant this feat to all allies within 30
      feet who can see and hear him. Allies retain the use of this bonus feat
      for 3 rounds plus 1 round for every two levels the cavalier possesses.
      Allies do not need to meet the prerequisites of these bonus feats. The
      cavalier can use this ability once per day at 1st level, plus one
      additional time per day at 5th level and for every 5 levels
      thereafter.</p>
