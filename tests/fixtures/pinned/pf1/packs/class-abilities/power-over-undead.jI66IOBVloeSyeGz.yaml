  description:
    value: >-
      <p>You receive @UUID[Compendium.pf1.feats.CjLNTqNGz4zU4zpp]{Command
      Undead} or @UUID[Compendium.pf1.feats.O7Dn4bXZtMW0UstG]{Turn Undead} as a
      bonus feat. You can channel energy a number of times per day equal to 3 +
      your <em>Intelligence</em> modifier, but only to use the selected feat.
      You can take other feats to add to this ability, such as
      @UUID[Compendium.pf1.feats.pgRX4VpFemwv9R0E]{Extra Channel} and
      @UUID[Compendium.pf1.feats.1HfwfBOSWtdxFQ2s]{Improved Channel}, but not
      feats that alter this ability, such as
      @UUID[Compendium.pf1.feats.f5rgOsdDlseGr4o5]{Elemental Channel} and
      @UUID[Compendium.pf1.feats.ieww7CP6JK5pwtpg]{Alignment Channel}. The DC to
      save against these feats is equal to 10 + 1/2 your wizard level + your
      <em>Charisma</em> modifier. At 20th level, undead cannot add their channel
      resistance to the save against this ability.</p>
