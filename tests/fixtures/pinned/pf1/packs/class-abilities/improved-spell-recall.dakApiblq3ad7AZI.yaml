name: Improved Spell Recall
system:
  abilityType: su
  associations:
    classes:
      - Magus
  description:
    value: >-
      <p>At 11th level, the magus's ability to recall spells using his arcane
      pool becomes more efficient. Whenever he recalls a spell with spell
      recall, he expends a number of points from his arcane pool equal to 1/2
      the spell's level (minimum 1). Furthermore, instead of recalling a used
      spell, as a swift action the magus can prepare a spell of the same level
      that he has in his spellbook. He does so by expending a number of points
      from his arcane pool equal to the spell's level (minimum 1). The magus
      cannot apply metamagic feats to a spell prepared in this way.</p>

      <p>The magus does not need to reference his spellbook to prepare a spell
      in this way.</p>
  subType: classFeat
type: feat
