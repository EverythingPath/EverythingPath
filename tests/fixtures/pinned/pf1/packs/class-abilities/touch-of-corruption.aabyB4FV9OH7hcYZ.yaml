  description:
    value: >-
      <p>Beginning at 2nd level, an antipaladin surrounds his hand with a
      fiendish flame, causing terrible wounds to open on those he touches. Each
      day he can use this ability a number of times equal to 1/2 his antipaladin
      level + his Charisma modifier. As a touch attack, an antipaladin can cause
      1d6 points of damage for every two antipaladin levels he possesses. Using
      this ability is a standard action that does not provoke attacks of
      opportunity.<p>Alternatively, an antipaladin can use this power to heal
      undead creatures, restoring 1d6 hit points for every two levels the
      antipaladin possesses. This ability is modified by any feat, spell, or
      effect that specifically works with the lay on hands paladin class
      feature. For example, the Extra Lay On Hands feat grants an antipaladin 2
      additional uses of the touch of corruption class feature.</p>
