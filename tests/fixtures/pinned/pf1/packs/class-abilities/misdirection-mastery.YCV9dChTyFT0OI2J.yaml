  description:
    value: >-
      <p>You gleefully evade attacks and confound foes with your capricious
      misdirection. You receive Misdirection Tactics as a bonus feat.</p>

      <p>At 10th level, you receive Misdirection Redirection as a bonus
      feat.</p>

      <p>At 15th level you receive Misdirection Attack as a bonus feat.</p>

      <p>You do not need to meet the prerequisites to receive these feats.</p>

      <p>You must be at least 3rd level to select this revelation.</p>
