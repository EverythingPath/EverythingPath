      <p><h4><b>Bloodline Arcana:</b> Whenever you cast a <em>divination</em>
      spell that requires a percentage roll, add 5 to the result of your roll.
      In addition, you can roll the percentage dice twice and use the result you
      prefer. Your maximum percentage chance of receiving a meaningful and
      accurate reply for <em>divination</em> spells is 100%, instead of the
      usual 90%.</h4>
