  description:
    value: >-
      <p><em>Just as knowledge of the harrow has passed from generation to
      generation since time immemorial, so too has a deep spiritual connection
      to the otherworldly forces bound by the harrow passed through the ages.
      Your connection to the mysterious deck grants you magical power over the
      cards of the harrow, visions of the future, and the ability to call down
      ephemeral forces.</em></p>

      <p><b>Class Skills:</b> <em>Knowledge</em> (history).</p>

