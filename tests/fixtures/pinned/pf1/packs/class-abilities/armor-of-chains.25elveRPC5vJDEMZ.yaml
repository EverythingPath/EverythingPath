  description:
    value: >-
      <p>At 8th level, you gain resistance 5 to cold and the chains covering
      your body provide a +4 armor bonus to AC with no armor check penalty,
      maximum Dexterity bonus, or additional weight.</p>

      <p>At 16th level, the resistance increases to 10 and the armor bonus
      increases to +8.</p>
