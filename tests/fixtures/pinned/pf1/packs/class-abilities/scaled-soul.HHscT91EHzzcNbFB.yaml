  description:
    value: >-
      <p>At 20th level, you gain the <em>shapechanger</em> subtype, and you can
      assume the form of a <em>reptilian humanoid</em> (as
      @UUID[Compendium.pf1.spells.kouqz0pm1xl8xilm]{Alter Self} ) or snake of
      Diminutive to Huge size (as
      @UUID[Compendium.pf1.spells.w88ddxpu89qcr5c0]{Beast Shape III}) at will.
      You retain the power of speech and the ability to use somatic spell
      <em>components</em> when transformed. You also become immune to poison and
      <em>paralysis</em>. You may use serpent’s fang as often as desired, and
      you may choose to inflict damage to any ability score.</p>
  subType: classFeat
type: feat
