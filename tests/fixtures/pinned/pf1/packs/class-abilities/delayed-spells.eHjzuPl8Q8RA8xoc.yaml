  associations:
    classes:
      - Inquisitor
  description:
    value: >-
      <p>At 8th level, you can delay the effects of a spell you cast by up to 1
      round per inquisitor level. You choose the duration of the delay when you
      cast the spell and can cause the spell to take effect immediately during
      the period of delay by concentrating as a standard action. You can use
      this ability once per day plus an additional time per day for every 4
      inquisitor levels you have beyond 8th.</p>
  subType: classFeat
  tag: classFeat_delayedSpells
  uses:
    maxFormula: floor((@class.level - 4) / 4)
    per: day
