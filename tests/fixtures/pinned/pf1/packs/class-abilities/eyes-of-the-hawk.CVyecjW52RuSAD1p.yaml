  description:
    value: >-
      <p>You gain a racial bonus on Perception checks equal to 1/2 your cleric
      level (minimum +1). In addition, if you can act during a surprise round,
      you receive a +2 racial bonus on your Initiative check.</p>

      <p>This power replaces the Speak with Animals power granted by the Animal
      Domain.</p>
