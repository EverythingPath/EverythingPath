  description:
    value: >-
      <p>Upon reaching 20th level, you become a master of fire. You can apply
      any one of the following feats to any fire spell you cast without
      increasing the level or casting time:
      @UUID[Compendium.pf1.feats.9mcYid7xJY9NiySx]{Enlarge Spell},
      @UUID[Compendium.pf1.feats.btXWioB3SKJv8YEG]{Extend Spell},
      @UUID[Compendium.pf1.feats.2YuxcUNFMPNBpekG]{Silent Spell}, or
      @UUID[Compendium.pf1.feats.jVFjMIyQD6TOAsmj]{Still Spell}. You do not need
      to possess these feats to use this ability.</p>
