name: Order of the Beast (ISC)
system:
  associations:
    classes:
      - Cavalier
      - Samurai
  description:
    value: >-
      <p>A cavalier belonging to this order seeks only destruction and chaos.
      Cavaliers of the order of the beast revel in destruction, and go out of
      their way to cause as much mayhem and disorder as possible. While some
      celebrate war and a victory well fought, an order of the beast cavalier
      fights only to taste the blood of his dying foe. Members of this order are
      often insane, and may venerate <a
      href="https://aonprd.com/DeityDisplay.aspx?ItemName=Rovagug">Rovagug</a>
      or the elder gods and Great Old Ones of the Dark Tapestry. There are no
      colleges or universities where an aspiring cavalier can learn the ways of
      the order of the beast; it is a corruption of the other cavalier orders,
      and its secrets are whispered in the dreams of unbalanced youths by dark
      beings and passed down in forbidden rituals.<p>On Golarion, order of the
      beast cavaliers are most often found leading orc tribes on raids from
      within the Hold of Belkzen, commanding small bands of brigands or raiders
      in the Mana Wastes, or sowing chaos anywhere a destructive leader is
      welcomed or venerated, particularly in lands where the law holds little
      sway.<p><b>Edicts:</b> The cavalier wreaks havoc wherever he goes. An
      order of the beast cavalier must never show mercy and, when crossed,
      exacts the maximum possible revenge. The cavalier must seek out conflict
      at every juncture and cannot avoid a fight if provoked. That which he
      cannot steal, pillage, or claim, he must completely destroy or
      desecrate.<p><b>Challenge:</b> Whenever an order of the beast cavalier
      issues a challenge, he receives a +1 morale bonus on all damage rolls
      while using @UUID[Compendium.pf1.feats.Zeq6RWYv5otvg8q7]{Cleave} or
      @UUID[Compendium.pf1.feats.6HSMdwX1VS6nZ6Zf]{Great Cleave} so long as the
      target of his challenge is the first creature attacked. This bonus
      increases by 1 for every 4 levels the cavalier possesses.<p><b>Skills:</b>
      An order of the beast cavalier adds Disable Device (Dex) and Stealth (Dex)
      to his list of class skills. An order of the beast cavalier can make
      Disable Device checks untrained. If he has ranks in the skill, he receives
      a bonus on the check equal to 1/2 his cavalier level (minimum +1) when
      using it to sabotage, jam, or destroy a device.</p>
  subType: classFeat
type: feat
