  description:
    value: >-
      <p>You are so in tune with your primal nature that your instincts often
      act to save you from danger that your civilized mind isn’t even aware of.
      You may use your Charisma modifier (instead of your Dexterity modifier) as
      part of your Armor Class and all Reflex saving throws. Your armor’s
      maximum Dexterity bonus applies to your Charisma, instead.</p>
