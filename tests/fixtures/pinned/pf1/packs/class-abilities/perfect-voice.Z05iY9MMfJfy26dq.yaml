name: Perfect Voice
system:
  abilityType: su
  associations:
    classes:
      - Sorcerer
  description:
    value: >-
      <p>At 9th level, you understand all efforts to communicate through sound,
      and can make yourself understood to any creature able to understand
      language. You can speak to, and understand the speech of, any creature
      that understands at least one spoken language. The save DCs of
      language-dependent spells you cast increase by +1.</p>
