  description:
    value: >-
      <p>As a standard action, you can assume the form of a Small water
      elemental, as @UUID[Compendium.pf1.spells.pawbnw1nm4f0b98e]{Elemental Body
      I}.</p>

      <p>At 9th level, you can assume the form of a Medium water elemental, as
      @UUID[Compendium.pf1.spells.yldjnorgbx4jsldz]{Elemental Body II}.</p>

      <p>At 11th level, you can assume the form of a Large water elemental, as
      @UUID[Compendium.pf1.spells.hd32fuc6e7j4isbn]{Elemental Body III}.</p>

      <p>At 13th level, you can assume the form of a Huge water elemental, as
      @UUID[Compendium.pf1.spells.v42t5kpxc8mvd615]{Elemental Body IV}.</p>

      <p>You can use this ability once per day, but the duration is 1
      hour/level.</p>

      <p>You must be at least 7th level to select this revelation.</p>
