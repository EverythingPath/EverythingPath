  description:
    value: >-
      <p><em>Your family is a long line of dreamers, who dream not as ordinary
      mortals do but rather as those who reach through and touch the supernal
      realm of dreams and the farthest shores of night. Whether it is a gift or
      curse is not always clear, but your visions of the past and future call
      you ineluctably to a life of adventure.</em></p>

      <p><b>Class Skill</b>: <em>Sense Motive</em>.</p>

