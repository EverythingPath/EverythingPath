      <p><b>Bloodline Arcana:</b> Whenever you target a single creature with a
      spell, you gain an <em>insight bonus</em> equal to half the spell’s level
      (minimum +1) for 1 round to your <em>AC</em> and <em>saving throws</em>
      against any spell or attack made by that creature.</p>
