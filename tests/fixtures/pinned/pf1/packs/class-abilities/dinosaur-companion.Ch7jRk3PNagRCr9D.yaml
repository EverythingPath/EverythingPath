  description:
    value: >-
      <p>At 4th level, you gain the service of a loyal animal companion. Your
      effective druid level for the purpose of this animal companion is equal to
      your class level – 2. You must choose a dinosaur as your companion.</p>

      <p>This power replaces the Serpent Companion power of the Scalykind
      Domain.</p>
