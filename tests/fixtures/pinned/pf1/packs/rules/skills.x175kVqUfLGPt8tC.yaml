    name: Intimidate
    sort: 1250000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1110;pages=99]</p><p><em>You can
        use this skill to frighten an opponent or to get them to act in a way
        that benefits you. This skill includes verbal threats and displays of
        prowess.</em></p><p><strong>Check:</strong> You can use Intimidate to
        force an opponent to act friendly toward you for 1d6 × 10 minutes with a
        successful check. The DC of this check is equal to 10 + the target’s Hit
        Dice + the target’s Wisdom modifier. If successful, the target gives you
        the information you desire, takes actions that do not endanger it, or
        otherwise offers limited assistance. After the Intimidate expires, the
        target treats you as unfriendly and may report you to local authorities.
        If you fail this check by 5 or more, the target attempts to deceive you
        or otherwise hinder your activities.</p><p><strong>Demoralize:</strong>
        You can use this skill to cause an opponent to become
        @UUID[Compendium.pf1.pf1e-rules.NSqfXaj4MevUR2uJ.JournalEntryPage.XxLUswkCuXnXmA5T]{shaken}
        for a number of rounds. The DC of this check is equal to 10 + the
        target’s Hit Dice + the target’s Wisdom modifier. If you are successful,
        the target is shaken for 1 round. This duration increases by 1 round for
        every 5 by which you beat the DC. You can only threaten an opponent in
        this way if they are within 30 feet and can clearly see and hear you.
        Using demoralize on the same creature only extends the duration; it does
        not create a stronger fear condition.</p><p><strong>Action:</strong>
        Using Intimidate to change an opponent’s attitude requires 1 minute of
        conversation. Demoralizing an opponent is a standard
        action.</p><p><strong>Try Again:</strong> You can attempt to Intimidate
        an opponent again, but each additional check increases the DC by +5.
        This increase resets after 1 hour has
        passed.</p><p><strong>Special:</strong> You also gain a +4 bonus on
        Intimidate checks if you are larger than your target and a –4 penalty on
        Intimidate checks if you are smaller than your target.</p><p>If you have
        the @UUID[Compendium.pf1.feats.L10V7jTzmMYz62zz]{Persuasive} feat, you
        get a bonus on Intimidate checks (see Feats).</p><p>A
        @UUID[Compendium.pf1.races.dCAXgdA6Db1Z3ccz]{Half-Orc} gets a +2 bonus
        on Intimidate checks.</p><h1>Coercion</h1><p><strong>Source</strong>
        @Source[PZO9469;pages=8]</p><p>Sometimes you need to cow someone into
        submission for more than just a few hours.</p><p><strong>Check:</strong>
        By spending more time threatening or harassing a target, you can attempt
        to force a creature to act friendly toward you for 1d6 hours + 1 hour
        for every 5 points by which you exceed the DC. If you succeed at such a
        check against the same target at least once per week for 1d6 weeks
        (without ever failing any Intimidate checks against the target during
        that time), the duration of the coercion increases to 2d8 days. Coercion
        is overt, not subtle, and in most cases using coercion against a
        creature is an evil act.</p><p>A coerced target acts as though friendly
        toward you even when you aren’t around, but the aid offered remains
        grudging at best. The target’s true attitude is hostile, and if the
        target believes it can take an action to hinder you that can’t be traced
        back to it, it’s likely to take such opportunities. Creatures attempting
        to enlist its aid against you can often do so by convincing the target
        they are able to protect it from your wrath, using the normal Diplomacy
        rules.</p><p><strong>Action:</strong> Coercing a target into acting
        friendly for hours takes 1d4 × 10 minutes. Coercing a target into acting
        friendly for days requires you to successfully use coercion at least
        once per week for 1d6 weeks without failing any Intimidate checks
        against the target during that time.</p><p><strong>Try Again:</strong>
        You can’t attempt long-term coercion against the same target again for 1
        week.</p><h1>Skill Unlock</h1><p><strong>Source</strong>
        @Source[PZO1131;pages=85]</p><p>With sufficient ranks in Intimidate, you
        earn the following.<br />An asterisk (*) indicates the total duration
        cannot exceed 1 round plus 1 round for every 5 by which you exceed the
        DC.</p><p><strong>5 Ranks:</strong> If you exceed the DC to demoralize a
        target by at least 10, it is
        @UUID[Compendium.pf1.pf1e-rules.NSqfXaj4MevUR2uJ.JournalEntryPage.uqpJ7ZMnWF5qjOTl]{frightened}
        for 1 round and shaken thereafter.* A Will save (DC = 10 + your number
        of ranks in Intimidate) negates the frightened condition, but the target
        is still shaken, even if it has the stalwart ability.</p><p><strong>10
        Ranks:</strong> If you exceed the DC to demoralize a target by at least
        10, it is
        @UUID[Compendium.pf1.pf1e-rules.NSqfXaj4MevUR2uJ.JournalEntryPage.nGTsTfpWcJTTU3rk]{panicked}
        for 1 round or frightened for 1d4 rounds (your choice) and shaken
        thereafter.* A Will save (DC = 10 + your number of ranks in Intimidate)
        negates the frightened or panicked condition, but the target is still
        shaken, even if it has the stalwart ability.</p><p><strong>15
        Ranks:</strong> If you exceed the DC to demoralize a target by at least
        20, it is cowering for 1 round or panicked for 1d4 rounds (your choice)
        and frightened thereafter.* A Will save (DC = 10 + your number of ranks
        in Intimidate) negates the cowering, panicked, and frightened
        conditions, but the target is still shaken, even if it has the stalwart
        ability.</p><p><strong>20 Ranks:</strong> If you exceed the DC to
        demoralize a target by at least 20, it is cowering for 1d4 rounds and
        panicked thereafter.* A Will save (DC = 10 + your number of ranks in
        Intimidate) negates the cowering and panicked conditions, but the target
        is still shaken, even if it has the stalwart ability.</p>
      format: 1
    title:
      level: 1
      show: true
    type: text
  - _id: BWeqgXSZvUQl68vt
    _key: '!journal.pages!x175kVqUfLGPt8tC.BWeqgXSZvUQl68vt'
    _stats:
      coreVersion: '12.331'
    name: Knowledge
    sort: 1300000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1110;pages=99]</p><p>You are
        educated in a field of study and can answer both simple and complex
        questions. Like the
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.3E8pxbjI8MD3JbfQ]{Craft},
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.emzBKDFNkNnC7N8u]{Perform},
        and
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.224EaK0K72NhCeRi]{Profession}
        skills, Knowledge actually encompasses a number of different
        specialties. Below are listed typical fields of
        study.</p><ul><li><strong>Arcana</strong> (ancient mysteries, magic
        traditions, arcane symbols, constructs, dragons, magical
        beasts)</li><li><strong>Dungeoneering</strong> (aberrations, caverns,
        oozes, spelunking)</li><li><strong>Engineering</strong> (buildings,
        aqueducts, bridges, fortifications)</li><li><strong>Geography</strong>
        (lands, terrain, climate, people)</li><li><strong>History</strong>
        (wars, colonies, migrations, founding of
        cities)</li><li><strong>Local</strong> (legends, personalities,
        inhabitants, laws, customs, traditions,
        humanoids)</li><li><strong>Nature</strong> (animals, fey, monstrous
        humanoids, plants, seasons and cycles, weather,
        vermin)</li><li><strong>Nobility</strong> (lineages, heraldry,
        personalities, royalty)</li><li><strong>Planes</strong> (the Inner
        Planes, the Outer Planes, the Astral Plane, the Ethereal Plane,
        outsiders, planar magic)</li><li><strong>Religion</strong> (gods and
        goddesses, mythic history, ecclesiastic tradition, holy symbols,
        undead)</li></ul><p><strong>Check:</strong> Answering a question within
        your field of study has a DC of 10 (for really easy questions), 15 (for
        basic questions), or 20 to 30 (for really tough questions).</p><p>You
        can use this skill to identify monsters and their special powers or
        vulnerabilities. In general, the DC of such a check equals 10 + the
        monster’s CR. For common monsters, such as goblins, the DC of this check
        equals 5 + the monster’s CR. For particularly rare monsters, such as the
        tarrasque, the DC of this check equals 15 + the monster’s CR, or more. A
        successful check allows you to remember a bit of useful information
        about that monster. For every 5 points by which your check result
        exceeds the DC, you recall another piece of useful information. Many of
        the Knowledge skills have specific uses as noted on the below
        table.</p><table><thead><tr><td>Task</td><td>Knowledge
        Skill</td><td>DC</td></tr></thead><tbody><tr><td>Identify auras while
        using detect magic</td><td>Arcana</td><td>15 + spell
        level</td></tr><tr><td>Identify a spell effect that is in
        place</td><td>Arcana</td><td>20 + spell level</td></tr><tr><td>Identify
        materials manufactured by magic</td><td>Arcana</td><td>20 + spell
        level</td></tr><tr><td>Identify a spell that just targeted
        you</td><td>Arcana</td><td>25 + spell level</td></tr><tr><td>Identify
        the spells cast using a specific material
        component</td><td>Arcana</td><td>20</td></tr><tr><td>Identify
        underground hazard</td><td>Dungeoneering</td><td>15 + hazard’s
        CR</td></tr><tr><td>Identify mineral, stone, or
        metal</td><td>Dungeoneering</td><td>10</td></tr><tr><td>Determine
        slope</td><td>Dungeoneering</td><td>15</td></tr><tr><td>Determine depth
        underground</td><td>Dungeoneering</td><td>20</td></tr><tr><td>Identify
        dangerous
        construction</td><td>Engineering</td><td>10</td></tr><tr><td>Determine a
        structure’s style or
        age</td><td>Engineering</td><td>15</td></tr><tr><td>Determine a
        structure’s
        weakness</td><td>Engineering</td><td>20</td></tr><tr><td>Identify a
        creature’s ethnicity or
        accent</td><td>Geography</td><td>10</td></tr><tr><td>Recognize regional
        terrain features</td><td>Geography</td><td>15</td></tr><tr><td>Know
        location of nearest community or noteworthy
        site</td><td>Geography</td><td>20</td></tr><tr><td>Know recent or
        historically significant
        event</td><td>History</td><td>10</td></tr><tr><td>Determine approximate
        date of a specific
        event</td><td>History</td><td>15</td></tr><tr><td>Know obscure or
        ancient historical
        event</td><td>History</td><td>20</td></tr><tr><td>Know local laws,
        rulers, and popular
        locations</td><td>Local</td><td>10</td></tr><tr><td>Know a common rumor
        or local tradition</td><td>Local</td><td>15</td></tr><tr><td>Know hidden
        organizations, rulers, and
        locations</td><td>Local</td><td>20</td></tr><tr><td>Identify natural
        hazard</td><td>Nature</td><td>15 + hazard’s CR</td></tr><tr><td>Identify
        a common plant or
        animal</td><td>Nature</td><td>10</td></tr><tr><td>Identify unnatural
        weather phenomenon</td><td>Nature</td><td>15</td></tr><tr><td>Determine
        artificial nature of
        feature</td><td>Nature</td><td>20</td></tr><tr><td>Know current rulers
        and their symbols</td><td>Nobility</td><td>10</td></tr><tr><td>Know
        proper etiquette</td><td>Nobility</td><td>15</td></tr><tr><td>Know line
        of succession</td><td>Nobility</td><td>20</td></tr><tr><td>Know the
        names of the planes</td><td>Planes</td><td>10</td></tr><tr><td>Recognize
        current plane</td><td>Planes</td><td>15</td></tr><tr><td>Identify a
        creature’s planar
        origin</td><td>Planes</td><td>20</td></tr><tr><td>Recognize a common
        deity’s symbol or
        clergy</td><td>Religion</td><td>10</td></tr><tr><td>Know common
        mythology and
        tenets</td><td>Religion</td><td>15</td></tr><tr><td>Recognize an obscure
        deity’s symbol or
        clergy</td><td>Religion</td><td>20</td></tr><tr><td>Identify a monster’s
        abilities and weaknesses</td><td>Varies</td><td>10 + monster’s
        CR</td></tr></tbody></table><p><strong>Action:</strong> Usually none. In
        most cases, a Knowledge check doesn’t take an action (but see
        "Untrained," below).</p><p><strong>Try Again:</strong> No. The check
        represents what you know, and thinking about a topic a second time
        doesn’t let you know something that you never learned in the first
        place.</p><p><strong>Untrained:</strong> You cannot make an untrained
        Knowledge check with a DC higher than 10. If you have access to an
        extensive library that covers a specific skill, this limit is removed.
        The time to make checks using a library, however, increases to 1d4
        hours. Particularly complete libraries might even grant a bonus on
        Knowledge checks in the fields that they cover.</p><h1>Phrenology
        (Arcana)</h1><p><strong>Source</strong>
        @Source[PZO1132;pages=196]</p><p>You examine the skulls of intelligent
        creatures to analyze the subjects’ psychological attributes, since the
        shape of the brain influences the shape of the
        skull.</p><p><strong>Check:</strong> Once per day, you can use your
        fingertips to examine the shape of a creature’s skull. Reading a
        creature’s skull requires 1 minute of concentration and scrutiny while
        you physically manipulate the skull. This technique can be used on a
        willing, helpless, or paralyzed creature, or on decomposed remains (as
        long as the skull is intact or can be pieced together). This skill can’t
        be used on creatures without discernible skulls, such as constructs,
        elementals, oozes, or plants. After the minute is up, the GM attempts a
        secret Knowledge (arcana) check. The DC is typically modified by the
        subject’s Hit Dice. With a single check, you determine all the
        information whose DC you meet. For instance, if you had a result of 22
        when examining a creature with 2 HD, you would learn that creature’s
        race and age, gender, alignment, and class, but not its level or
        HD.</p><table><thead><tr><td>Task</td><td>DC</td></tr></thead><tbody><tr><td>Determine
        race and age</td><td>10</td></tr><tr><td>Determine
        gender</td><td>15</td></tr><tr><td>Determine alignment</td><td>15 +
        creature’s HD<sup>†</sup></td></tr><tr><td>Determine class</td><td>20 +
        creature’s HD<sup>†</sup></td></tr><tr><td>Determine level or
        HD</td><td>25 + creature’s
        HD<sup>†</sup></td></tr></tbody></table><p><sup>† A dead creature’s
        skull uses the HD the creature had when
        alive.</sup></p><p><strong>Action:</strong> Reading a creature’s cranium
        requires 1 minute of uninterrupted study.</p><p><strong>Try
        Again:</strong> Yes. Reexamining a skull may provide new insights. You
        can attempt only one such check per day.</p><h2>Occult Skill
        Unlocks</h2><p>Characters capable of casting psychic spells or who have
        the Psychic Sensitivity feat gain access to skill unlocks—a host of
        esoteric skill uses not available to other PCs. These are not entirely
        new skills, but rather new uses of existing skills for those trained in
        the occult arts. A character must be trained in the appropriate skill to
        use that skill’s unlock, even if the skill can normally be used
        untrained. It’s impossible to take 10 for an occult skill unlock. Occult
        skill unlocks require intense concentration and strenuous effort, so the
        amount a character can use each skill unlock is limited to once per day
        or per week. This limit is for all uses of the skill unlock; if a
        character uses hypnotism to implant a suggestion, he can’t also use it
        to recall memories on the same day.</p><h1>Recall
        Intrigues</h1><p><strong>Source</strong>
        @Source[PZO9469;pages=9]</p><p>You can identify feats and the class
        features of various classes with successful Knowledge checks when you
        observe the feats or class features being
        used.</p><p><strong>Check:</strong> You can attempt a skill check to
        identify a feat or class feature when you observe it in use, similar to
        how Spellcraft can be used to identify a spell. The feat or class
        feature must have some observable effect in order for you to attempt the
        Knowledge check. For example, you can’t see the internal determination
        of @UUID[Compendium.pf1.feats.iAbIGhm7T2OK9Brt]{Iron Will}, so this
        ability can’t identify that feat. In general, if a feat or class feature
        creates a noticeable effect (such as the extra attack from using
        @UUID[Compendium.pf1.feats.Zeq6RWYv5otvg8q7]{Cleave}) or has a variable
        modifier a character must choose to use (such as
        @UUID[Compendium.pf1.feats.QvlxYVVsBDlykPKe]{Arcane Strike},
        @UUID[Compendium.pf1.feats.NFxHebU1XhEs5WJh]{Combat Expertise}, or
        @UUID[Compendium.pf1.feats.9mcYid7xJY9NiySx]{Enlarge Spell}), it can be
        identified. If it creates a static bonus (such as
        @UUID[Compendium.pf1.feats.JreaiTHdyWFNj3Tb]{Dodge} or
        @UUID[Compendium.pf1.feats.0bZf3SDkvVOe2ujH]{Lightning Reflexes}),
        there’s no telltale sign to give it away.</p><p>The Knowledge skill
        required to identify a feat or class feature varies depending on the
        type of feat or class feature to be identified and is outlined in the
        table below, along with the DCs of such skill
        checks.</p><table><thead><tr><td>Task</td><td>Knowledge
        Skill</td><td>DC</td></tr></thead><tbody><tr><td>Identify a class
        feature from a class that grants arcane or psychic
        spells</td><td>Arcana</td><td>10 + class level when feature is
        granted*</td></tr><tr><td>Identify a class feature from a class with
        access to the druid or ranger spell list</td><td>Nature</td><td>10 +
        class level when feature is granted*</td></tr><tr><td>Identify a class
        feature from another class that grants divine
        spells</td><td>Religion</td><td>10 + class level when feature is
        granted*</td></tr><tr><td>Identify a class feature from any other
        class</td><td>Local</td><td>10 + class level when feature is
        granted*</td></tr><tr><td>Identify a combat feat being
        used</td><td>Local</td><td>10 + character’s
        level</td></tr><tr><td>Identify a metamagic feat being
        used</td><td>Arcana</td><td>10 + character’s
        level</td></tr><tr><td>Identify a teamwork feat being
        used</td><td>Nobility</td><td>10 + character’s
        level</td></tr><tr><td>Identify any other feat being
        used</td><td>Local</td><td>15 + character’s
        level</td></tr></tbody></table><p><sup>* Add 10 to the DC if the class
        is a prestige class.</sup></p><h1>Researching
        Technology</h1><p><strong>Source</strong>
        @Source[PZO9272;pages=5]</p><p>A character can use the following skills
        to research technological subjects. Other skills may have research
        applications as well, subject to GM approval.</p><p><strong>Knowledge
        (arcana):</strong> Although robots are constructs, Knowledge (arcana)
        cannot be used to identify robots or their abilities and
        weaknesses.</p><p><strong>Knowledge (engineering):</strong> This is the
        most important skill with regard to technological subjects. Knowledge
        (engineering) can be used to identify a robot’s abilities and
        weaknesses. Knowledge (engineering) is also used to identify and
        understand unknown technological objects in a similar manner to how
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.VRD7jxiIAxKPt6EF]{Spellcraft}
        is used to identify the properties of a magic item. The DC to correctly
        identify and understand an unknown technological object is equal to the
        object’s Craft DC. An object with a
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.3E8pxbjI8MD3JbfQ]{Craft}
        DC of 15 or less can be automatically identified and understood by
        someone trained in Knowledge (engineering) who also has the Technologist
        feat.</p><p><strong>Knowledge (geography):</strong> Used for
        astronomy.</p><h1>Skill Unlock</h1><p><strong>Source</strong>
        @Source[PZO1131;pages=85]</p><p>With sufficient ranks in Knowledge, you
        earn the following.</p><p><strong>5 Ranks:</strong> When you
        successfully identify a creature, you gain one additional piece of
        information for every 5 ranks you possess in that Knowledge
        skill.</p><p><strong>10 Ranks:</strong> When you successfully identify a
        creature, you gain a +1 competence bonus on attack rolls, opposed
        ability checks, skill checks, and caster level checks against creatures
        of that kind (e.g., glabrezu demons, but not other demons or evil
        outsiders) for 1 minute. This bonus increases by 1 for every 5 ranks
        beyond 10 you possess in that Knowledge skill.</p><p><strong>15
        Ranks:</strong> When you fail a Knowledge check, you can reroll the
        check at a –10 penalty. The competence bonus above also applies to
        saving throws against exceptional, spell-like, or supernatural abilities
        used by creatures you identify.</p><p><strong>20 Ranks:</strong>
        Whenever you attempt a Knowledge check, you can roll twice and take the
        better result.</p>
      format: 1
    title:
      level: 1
      show: true
    type: text
  - _id: SqLm3Deag2FpP8ty
    _key: '!journal.pages!x175kVqUfLGPt8tC.SqLm3Deag2FpP8ty'
    _stats:
      coreVersion: '12.331'
    name: Linguistics
    sort: 1500000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1110;pages=100]</p><p>You are
        skilled at working with language, in both its spoken and written forms.
        You can speak multiple languages, and can decipher nearly any tongue
        given enough time. Your skill in writing allows you to create and detect
        forgeries as well.</p><p><strong>Check:</strong> You can decipher
        writing in an unfamiliar language or a message written in an incomplete
        or archaic form. The base DC is 20 for the simplest messages, 25 for
        standard texts, and 30 or higher for intricate, exotic, or very old
        writing. If the check succeeds, you understand the general content of a
        piece of writing about one page long (or the equivalent). If the check
        fails, make a DC 5 Wisdom check to see if you avoid drawing a false
        conclusion about the text. (Success means that you do not draw a false
        conclusion; failure means that you do.)</p><p>Both the Linguistics check
        and (if necessary) the Wisdom check are made secretly by the GM, so that
        you can’t tell whether the conclusion you draw is true or
        false.</p><table><thead><tr><td>Condition</td><td>Linguistics Check
        Modifier</td></tr></thead><tbody><tr><td>Type of document unknown to
        reader</td><td>–2</td></tr><tr><td>Type of document somewhat known to
        reader</td><td>+0</td></tr><tr><td>Type of document well known to
        reader</td><td>+2</td></tr><tr><td>Handwriting not known to
        reader</td><td>–2</td></tr><tr><td>Handwriting somewhat known to
        reader</td><td>+0</td></tr><tr><td>Handwriting intimately known to
        reader</td><td>+2</td></tr><tr><td>Reader only casually reviews the
        document</td><td>–2</td></tr><tr><td>Document contradicts orders or
        knowledge</td><td>+2</td></tr></tbody></table><p><strong>Create or
        Detect Forgeries:</strong> Forgery requires writing materials
        appropriate to the document being forged. To forge a document on which
        the handwriting is not specific to a person, you need only to have seen
        a similar document before, and you gain a +8 bonus on your check. To
        forge a signature, you need an autograph of that person to copy, and you
        gain a +4 bonus on the check. To forge a longer document written in the
        hand of some particular person, a large sample of that person’s
        handwriting is needed.</p><p>The Linguistics check is made secretly, so
        that you’re not sure how good your forgery is. As with
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.xg25z3GIpS590NDW]{Disguise},
        you don’t make a check until someone examines the work. Your Linguistics
        check is opposed by the Linguistics check of the person who examines the
        document to verify its authenticity. The examiner gains modifiers if any
        of the conditions are listed on the table above.</p><p><strong>Learn a
        Language:</strong> Whenever you put a rank into this skill, you learn to
        speak and read a new language. Common languages (and their typical
        speakers) include the following.</p><ul><li><strong>Abyssal</strong>
        (demons and other chaotic evil outsiders)</li><li><strong>Aklo</strong>
        (derros, inhuman or otherworldly monsters, evil
        fey)</li><li><strong>Aquan</strong> (aquatic creatures, water-based
        creatures)</li><li><strong>Auran</strong> (flying creatures, air-based
        creatures)</li><li><strong>Celestial</strong> (angels and other good
        outsiders)</li><li><strong>Common</strong> (humans and the core races
        from Races)</li><li><strong>Draconic</strong> (dragons, reptilian
        humanoids)</li><li><strong>Druidic</strong> (druids
        only)</li><li><strong>Dwarven</strong>
        (dwarves)</li><li><strong>Elven</strong> (elves,
        half-elves)</li><li><strong>Giant</strong> (cyclopses, ettins, giants,
        ogres, trolls)</li><li><strong>Gnome</strong>
        (gnomes)</li><li><strong>Goblin</strong> (bugbears, goblins,
        hobgoblins)</li><li><strong>Gnoll</strong>
        (gnolls)</li><li><strong>Halfling</strong>
        (halflings)</li><li><strong>Ignan</strong> (fire-based
        creatures)</li><li><strong>Infernal</strong> (devils and other lawful
        evil outsiders)</li><li><strong>Orc</strong> (orcs,
        half-orcs)</li><li><strong>Sylvan</strong> (centaurs, fey creatures,
        plant creatures, unicorns)</li><li><strong>Terran</strong> (earth-based
        creatures)</li><li><strong>Undercommon</strong> (drow, duergar,
        morlocks, svirfneblin)</li></ul><p><strong>Action:</strong> Varies.
        Deciphering a page of ordinary text takes 1 minute (10 consecutive
        rounds). Creating a forgery can take anywhere from 1 minute to 1d4
        minutes per page. Detecting a forgery using Linguistics takes 1 round of
        examination per page.</p><p><strong>Try Again:</strong>
        Yes.</p><p><strong>Special:</strong> You must be trained to use this
        skill, but you can always attempt to read archaic and strange forms of
        your own racial bonus languages. In addition, you can also always
        attempt to detect a forgery.</p><h1>Automatic
        Writing</h1><p><strong>Source</strong>
        @Source[PZO1132;pages=194]</p><p>You can produce mysterious writing that
        pertains to the immediate future, either under the influence of
        enigmatic guiding spirits or by unleashing your subconscious
        intuition.</p><p><strong>Check:</strong> Once per week, you can spend 1
        hour posing questions while your hand unconsciously scribbles messages
        of varying legibility and accuracy. At the end of this hour, you attempt
        a Linguistics check to decipher the meanings of these messages. If
        successful, you gain information as though you had used
        @UUID[Compendium.pf1.spells.d1wxnax51cecplm4]{Augury}. If you have 10 or
        more ranks in Linguistics, you can attempt a higher DC check to instead
        gain information as though you had used
        @UUID[Compendium.pf1.spells.pwueht12qqo0268e]{Divination}. The chance of
        successfully producing coherent or meaningful writing from any of these
        effects equals 60% plus 5% for every 1 by which your check result
        exceeds the DC (to a maximum of 90%). You must choose which DC you’ll
        try to meet before attempting the check. The GM rolls the check and d%
        roll secretly, so that you can’t tell whether the messages are
        accurate.</p><table><thead><tr><td>Writing Results</td><td>Ranks
        Required</td><td>DC</td></tr></thead><tbody><tr><td>As
        @UUID[Compendium.pf1.spells.d1wxnax51cecplm4]{Augury}
        spell</td><td>1</td><td>20</td></tr><tr><td>As
        @UUID[Compendium.pf1.spells.pwueht12qqo0268e]{Divination}
        spell</td><td>10</td><td>30</td></tr></tbody></table><p><strong>Action:</strong>
        Automatic writing takes 1 hour.</p><p><strong>Try Again:</strong> Yes.
        You can attempt to learn more about a subject, but can still attempt
        only one check per week.</p><h1>Occult Skill Unlocks</h1><p>Characters
        capable of casting psychic spells or who have the Psychic Sensitivity
        feat gain access to skill unlocks—a host of esoteric skill uses not
        available to other PCs. These are not entirely new skills, but rather
        new uses of existing skills for those trained in the occult arts. A
        character must be trained in the appropriate skill to use that skill’s
        unlock, even if the skill can normally be used untrained. It’s
        impossible to take 10 for an occult skill unlock. Occult skill unlocks
        require intense concentration and strenuous effort, so the amount a
        character can use each skill unlock is limited to once per day or per
        week. This limit is for all uses of the skill unlock; if a character
        uses hypnotism to implant a suggestion, he can’t also use it to recall
        memories on the same day are
        accurate.</p><h1>Technology</h1><p><strong>Source</strong>
        @Source[PZO9272;pages=5]</p><p>A character with the Technologist feat
        can attempt a Linguistics check to decipher certain complex messages
        that appear in ruins. Note that many of these messages are written in
        Androffan. This language is spoken outside only rarely, and even within
        its borders, some have tried (quite unsuccessfully) to keep it a secret
        language.</p><p><strong>Androffan:</strong> Some robots may also know it
        (either in addition to Common and Hallit or replacing these languages),
        depending on the robots’ nature. Androffan cannot be chosen as a bonus
        language for high Intelligence without GM permission.</p><h1>Skill
        Unlock</h1><p><strong>Source</strong>
        @Source[PZO1131;pages=85]</p><p>With sufficient ranks in Linguistics,
        you earn the following.</p><p><strong>5 Ranks:</strong> You can use
        Linguistics instead of
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.ka0VQGItdrWw3paO]{Sense
        Motive} to intercept and interpret secret messages (as the
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.kRK5XwVBvcMi35w2]{Bluff}
        skill). You gain a +1 insight bonus on
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.2h6hz5AkTDxKPFxr]{Perception}
        and
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.cSdUATLHBFfw3v4s]{Disable
        Device} checks to detect or disarm written magical traps. This bonus
        increases by 1 for every 5 ranks beyond 5 you possess in
        Linguistics.</p><p><strong>10 Ranks:</strong> If you succeed at a
        Linguistics check by at least 10 when examining writing, you can learn
        the precise meaning rather than general content, and you never draw
        false conclusions on a failed check. A successful DC 30 Linguistics
        check reveals the general meaning of speech, a successful DC 35 check
        reveals 1d4 pieces of specific information, and a successful DC 40 check
        reveals exact meaning.</p><p><strong>15 Ranks:</strong> You can decipher
        magical writings (as @UUID[Compendium.pf1.spells.j0bc0iii8zp1jiwr]{read
        magic}) by succeeding at a Linguistics check (DC = 25 + caster level).
        If you identify a written magical trap in this way, you gain a +2
        circumstance bonus on Disable Device checks to disarm
        it.</p><p><strong>20 Ranks:</strong> You can attempt to decipher magical
        or nonmagical text at a rate of one page per round. If you instead spend
        1 minute per page, roll twice and take the better result.</p>
      format: 1
    title:
      level: 1
      show: true
    type: text
  - _id: 2h6hz5AkTDxKPFxr
    _key: '!journal.pages!x175kVqUfLGPt8tC.2h6hz5AkTDxKPFxr'
    _stats:
      coreVersion: '12.331'
    name: Perception
    sort: 1600000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1110;pages=102]</p><p><em>Your
        senses allow you to notice fine details and alert you to danger.
        Perception covers all five senses, including sight, hearing, touch,
        taste, and smell.</em></p><p><strong>Check:</strong> Perception has a
        number of uses, the most common of which is an opposed check versus an
        opponent’s Stealth check to notice the opponent and avoid being
        surprised. If you are successful, you notice the opponent and can react
        accordingly. If you fail, your opponent can take a variety of actions,
        including sneaking past you and attacking you.</p><p>Perception is also
        used to notice fine details in the environment. The DC to notice such
        details varies depending upon distance, the environment, and how
        noticeable the detail is. The following table gives a number of
        guidelines.</p><table><thead><tr><td>Detail</td><td>Perception
        DC</td></tr></thead><tbody><tr><td>Hear the sound of
        battle</td><td>–10</td></tr><tr><td>Notice the stench of rotting
        garbage</td><td>–10</td></tr><tr><td>Detect the smell of
        smoke</td><td>0</td></tr><tr><td>Hear the details of a
        conversation</td><td>0</td></tr><tr><td>Notice a visible
        creature</td><td>0</td></tr><tr><td>Determine if food is
        spoiled</td><td>5</td></tr><tr><td>Hear the sound of a creature
        walking</td><td>10</td></tr><tr><td>Hear the details of a whispered
        conversation</td><td>15</td></tr><tr><td>Find the average concealed
        door</td><td>15</td></tr><tr><td>Hear the sound of a key being turned in
        a lock</td><td>20</td></tr><tr><td>Find the average secret
        door</td><td>20</td></tr><tr><td>Hear a bow being
        drawn</td><td>25</td></tr><tr><td>Sense a burrowing creature underneath
        you</td><td>25</td></tr><tr><td>Notice a pickpocket</td><td>Opposed by
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.joza8kAIiImrPft7]{Sleight
        of Hand}</td></tr><tr><td>Notice a creature using
        Stealth</td><td>Opposed by
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.wRWHk7tCUHR99PzD]{Stealth}</td></tr><tr><td>Find
        a hidden trap</td><td>Varies by trap</td></tr><tr><td>Identify the
        powers of a potion through taste</td><td>15 + the potion’s caster
        level</td></tr></tbody></table><table><thead><tr><td>Perception
        Modifiers</td><td>DC Modifier</td></tr></thead><tbody><tr><td>Distance
        to the source, object, or creature</td><td>+1/10
        feet</td></tr><tr><td>Through a closed
        door</td><td>+5</td></tr><tr><td>Through a wall</td><td>+10/foot of
        thickness</td></tr><tr><td>Favorable
        conditions<sup>1</sup></td><td>–2</td></tr><tr><td>Unfavorable
        conditions<sup>1</sup></td><td>+2</td></tr><tr><td>Terrible
        conditions<sup>2</sup></td><td>+5</td></tr><tr><td>Creature making the
        check is distracted</td><td>+5</td></tr><tr><td>Creature making the
        check is asleep</td><td>+10</td></tr><tr><td>Creature or object is
        invisible</td><td>+20</td></tr></tbody></table><p><sup>1 Favorable and
        unfavorable conditions depend upon the sense being used to make the
        check. For example, bright light might decrease the DC of checks
        involving sight, while torchlight or moonlight might increase the DC.
        Background noise might increase a DC involving hearing, while competing
        odors might increase the DC of a check involving scent.</sup><br
        /><sup>2 As for unfavorable conditions, but more extreme. For example,
        candlelight for DCs involving sight, a roaring dragon for DCs involving
        hearing, and an overpowering stench covering the area for DCs involving
        scent.</sup></p><p><strong>Action:</strong> Most Perception checks are
        reactive, made in response to observable stimulus. Intentionally
        searching for stimulus is a move action.</p><p><strong>Try
        Again:</strong> Yes. You can try to sense something you missed the first
        time, so long as the stimulus is still
        present.</p><p><strong>Special:</strong>
        @UUID[Compendium.pf1.races.NgIhxRI0axrf3fcO]{Elves},
        @UUID[Compendium.pf1.races.cCepRrfH5SalFfT4]{half-elves},
        @UUID[Compendium.pf1.races.efwHEwjvL9Z94MJI]{gnomes}, and
        @UUID[Compendium.pf1.races.Hf31mrYb3uucNyLO]{halflings} receive a +2
        racial bonus on Perception checks. Creatures with the scent special
        quality have a +8 bonus on Perception checks made to detect a scent.
        Creatures with the tremorsense special quality have a +8 bonus on
        Perception checks against creatures touching the ground and
        automatically make any such checks within their range. For more on
        special qualities, see Special Abilities.</p><p>A spellcaster with a
        hawk or owl familiar gains a +3 bonus on Perception checks. If you have
        the @UUID[Compendium.pf1.feats.Q1cY8r0Pvb66pMG0]{Alertness} feat, you
        get a bonus on Perception checks (see Feats).</p><h1>Read
        Aura</h1><p><strong>Source</strong>
        @Source[PZO1132;pages=197]</p><p>Your psychic sensitivity allows you to
        read the psychic and magical auras of creatures and
        objects.</p><p><strong>Check:</strong> Once per day, you can examine the
        natural aura of a creature or object to discern the subject’s alignment,
        emotions, health, or magic. This requires 10 minutes of concentration,
        after which you attempt a Perception check. Each time, you must pick one
        of four auras to read: alignment, emotion, health, or magic. The result
        of the check applies only to the selected aura. You must be within 30
        feet of the subject at all times during the reading. Objects typically
        have only magic auras, though some also have alignment auras (and
        intelligent items have emotion auras). You can still attempt to detect a
        type of aura an object doesn’t have, but you get no results. The DC
        varies depending on the aura, as shown on the table.</p><p><strong>Read
        Alignment Aura:</strong> You attempt to read the alignment aura,
        learning the alignment and its strength. An alignment aura’s strength
        depends on the creature’s Hit Dice or item’s caster level, as noted in
        the description of the detect evil spell.</p><p><strong>Read Emotion
        Aura:</strong> The colors within the target’s aura reveal its emotional
        state. If successful, you learn the target’s disposition and its
        attitude toward any creatures within 30 feet of it. For a number of
        rounds equal to the amount by which you exceeded the skill check’s DC,
        you gain a +2 circumstance bonus on
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.kRK5XwVBvcMi35w2]{Bluff},
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.uB9Fy36RUjibxqvt]{Diplomacy},
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.KNn8uxHu23phKC0y]{Intimidate},
        and
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.ka0VQGItdrWw3paO]{Sense
        Motive} checks against the target.</p><p><strong>Read Health
        Aura:</strong> Viewing the flow of vital force, you assess a creature’s
        physical condition. You learn if the creature is unharmed or wounded, if
        it is poisoned or diseased, and whether it is affected by any of the
        following conditions: confused, disabled, dying, nauseated, panicked,
        staggered, stunned, and unconscious. You also learn the total number of
        points available in its ki pool, grit pool, or similar
        resource.</p><p><strong>Read Magic Aura:</strong> You attempt to
        determine the number and power of all magical auras on a target creature
        or object (see detect magic to determine a magic aura’s power). If the
        check is successful, you can attempt Knowledge (arcana) or Spellcraft
        checks to determine the school or identify properties of a magic item,
        as normal. If the item is affected by magic aura or a similar spell, you
        can realize this and determine the actual properties of the item if your
        check result exceeds the DC by 5 or more. If the spell is of a higher
        level (such as aura alteration), increase this threshold DC by 2 for
        every spell level beyond
        1st.</p><table><thead><tr><td>Task</td><td>DC</td></tr></thead><tbody><tr><td>Read
        alignment aura</td><td>15 + creature’s HD or item’s caster
        level</td></tr><tr><td>Read emotion aura</td><td>20 + creature’s HD or
        item’s caster level<sup>†</sup></td></tr><tr><td>Read health
        aura</td><td>15 + creature’s HD</td></tr><tr><td>Read magic
        aura</td><td>20 + creature’s HD or item’s caster
        level</td></tr></tbody></table><p><sup>† Intelligent items
        only.</sup></p><p><strong>Action:</strong> Reading an aura requires 10
        minutes of study.</p><p><strong>Try Again:</strong> Yes. You can read a
        creature or object’s aura more than once, whether you read the same aura
        or a different one. You can still attempt only one skill check to read
        an aura per day.</p><h2>Occult Skill Unlocks</h2><p>Characters capable
        of casting psychic spells or who have the Psychic Sensitivity feat gain
        access to skill unlocks—a host of esoteric skill uses not available to
        other PCs. These are not entirely new skills, but rather new uses of
        existing skills for those trained in the occult arts. A character must
        be trained in the appropriate skill to use that skill’s unlock, even if
        the skill can normally be used untrained. It’s impossible to take 10 for
        an occult skill unlock. Occult skill unlocks require intense
        concentration and strenuous effort, so the amount a character can use
        each skill unlock is limited to once per day or per week. This limit is
        for all uses of the skill unlock; if a character uses hypnotism to
        implant a suggestion, he can’t also use it to recall memories on the
        same day.</p><h1>Skill Unlock</h1><p><strong>Source</strong>
        @Source[PZO1131;pages=85]</p><p>With sufficient ranks in Perception, you
        earn the following.</p><p><strong>5 Ranks:</strong> You remain alert to
        sounds even in your sleep, and the normal DC increase to Perception
        checks when you are sleeping is halved. The distance modifier on the DC
        of Perception checks you attempt is reduced to +1 per 20
        feet.</p><p><strong>10 Ranks:</strong> The distance modifier on the DC
        of Perception checks you attempt is reduced to +1 per 30 feet. In
        addition, you gain a +5 bonus on Perception checks to notice or locate
        an invisible creature or object.</p><p><strong>15 Ranks:</strong> You
        remain alert to sounds even in your sleep, and the normal DC increase to
        Perception checks when you are sleeping doesn’t apply to you. The
        distance modifier on the DC of your Perception checks is reduced to +1
        per 40 feet.</p><p><strong>20 Ranks:</strong> You gain a +10 bonus on
        Perception checks to notice invisible creatures or objects. The distance
        modifier on the DC of Perception checks you attempt is reduced to +1 per
        60 feet.</p>
      format: 1
    title:
      level: 1
      show: true
    type: text
  - _id: emzBKDFNkNnC7N8u
    _key: '!journal.pages!x175kVqUfLGPt8tC.emzBKDFNkNnC7N8u'
    _stats:
      coreVersion: '12.331'
    name: Perform
    sort: 1700000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1110;pages=102]</p><p>You are
        skilled at one form of entertainment, from singing to acting to playing
        an instrument. Like
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.3E8pxbjI8MD3JbfQ]{Craft},
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.BWeqgXSZvUQl68vt]{Knowledge},
        and
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.224EaK0K72NhCeRi]{Profession},
        Perform is actually a number of separate skills. You could have several
        Perform skills, each with its own ranks.</p><p>Each of the nine
        categories of the Perform skill includes a variety of methods,
        instruments, or techniques, a small sample of which is provided for each
        category below.</p><ul><li><strong>Act</strong> (comedy, drama,
        pantomime)</li><li><strong>Comedy</strong> (buffoonery, limericks,
        joke-telling)</li><li><strong>Dance</strong> (ballet, waltz,
        jig)</li><li><strong>Keyboard instruments</strong> (harpsichord, piano,
        pipe organ)</li><li><strong>Oratory</strong> (epic, ode,
        storytelling)</li><li><strong>Percussion instruments</strong> (bells,
        chimes, drums, gong)</li><li><strong>String instruments</strong>
        (fiddle, harp, lute, mandolin)</li><li><strong>Wind instruments</strong>
        (flute, pan pipes, recorder, trumpet)</li><li><strong>Sing</strong>
        (ballad, chant, melody)</li></ul><p><strong>Check:</strong> You can
        impress audiences with your talent and skill in your chosen performance
        type.</p><table><thead><tr><td>Perform
        DC</td><td>Performance</td></tr></thead><tbody><tr><td>10</td><td>Routine
        performance. Trying to earn money by playing in public is akin to
        begging. You can earn 1d10 cp/day.</td></tr><tr><td>15</td><td>Enjoyable
        performance. In a prosperous city, you can earn 1d10
        sp/day.</td></tr><tr><td>20</td><td>Great performance. In a prosperous
        city, you can earn 3d10 sp/day. In time, you may be invited to join a
        professional troupe and may develop a regional
        reputation.</td></tr><tr><td>25</td><td>Memorable performance. In a
        prosperous city, you can earn 1d6 gp/day. In time, you may come to the
        attention of noble patrons and develop a national
        reputation.</td></tr><tr><td>30</td><td>Extraordinary performance. In a
        prosperous city, you can earn 3d6 gp/day. In time, you may draw
        attention from distant patrons, or even from extraplanar
        beings.</td></tr></tbody></table><p>A masterwork musical instrument
        gives you a +2 circumstance bonus on all Perform checks that involve its
        use.</p><p><strong>Action:</strong> Varies. Trying to earn money by
        playing in public requires anywhere from an evening’s work to a full
        day’s performance. The
        @UUID[Compendium.pf1.classes.6GjOjO6r3R06fLwE]{Bard}’s special
        Perform-based abilities are described in that class’s
        description.</p><p><strong>Try Again:</strong> Yes. Retries are allowed,
        but they don’t negate previous failures, and an audience that has been
        unimpressed in the past is likely to be prejudiced against future
        performances. (Increase the DC by 2 for each previous
        failure.)</p><p><strong>Special:</strong> A
        @UUID[Compendium.pf1.classes.6GjOjO6r3R06fLwE]{Bard} must have ranks in
        specific Perform categories to use some of his Bardic Performance
        abilities.</p><h1>Skill Unlock</h1><p><strong>Source</strong>
        @Source[PZO1131;pages=85]</p><p>With sufficient ranks in Perform, you
        earn the following.</p><p><strong>5 Ranks:</strong> Whenever you attempt
        a
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.kRK5XwVBvcMi35w2]{Bluff},
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.uB9Fy36RUjibxqvt]{Diplomacy},
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.IrVgSeMcAM8rAh2B]{Handle
        Animal}, or
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.KNn8uxHu23phKC0y]{Intimidate}
        check, you can attempt a DC 20 Perform check to gain a +2 circumstance
        bonus on the check.</p><p><strong>10 Ranks:</strong> Whenever you cast a
        spell with the emotion or language-dependent descriptor, you can attempt
        a DC 25 Perform check to increase the save DC by 1.</p><p><strong>15
        Ranks:</strong> Whenever you cast a spell with the emotion or
        language-dependent descriptor, you can attempt a DC 30 Perform check to
        increase your caster level by 1. You must choose whether to use this
        ability or the ability unlocked at 10 ranks when casting the
        spell.</p><p><strong>20 Ranks:</strong> Choose one of the following
        skills:
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.kRK5XwVBvcMi35w2]{Bluff},
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.uB9Fy36RUjibxqvt]{Diplomacy},
        or
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.KNn8uxHu23phKC0y]{Intimidate}.
        When you attempt a skill check with that skill, you can also attempt a
        Perform check and use the better result to determine the success of that
        skill check.</p>
      format: 1
    title:
      level: 1
      show: true
    type: text
  - _id: 224EaK0K72NhCeRi
    _key: '!journal.pages!x175kVqUfLGPt8tC.224EaK0K72NhCeRi'
    _stats:
      coreVersion: '12.331'
    name: Profession
    sort: 1800000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1110;pages=103]</p><p>You are
        skilled at a specific job. Like
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.3E8pxbjI8MD3JbfQ]{Craft},
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.BWeqgXSZvUQl68vt]{Knowledge},
        and
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.emzBKDFNkNnC7N8u]{Perform},
        Profession is actually a number of separate skills. You could have
        several Profession skills, each with its own ranks. While a
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.3E8pxbjI8MD3JbfQ]{Craft}
        skill represents ability in creating an item, a Profession skill
        represents an aptitude in a vocation requiring a broader range of less
        specific knowledge. The most common Profession skills
        are:</p><ul><li>architect</li><li>baker</li><li>barrister</li><li>brewer</li><li>butcher</li><li>clerk</li><li>cook</li><li>courtesan</li><li>driver</li><li>engineer</li><li>farmer</li><li>fisherman</li><li>gambler</li><li>gardener</li><li>herbalist</li><li>innkeeper</li><li>librarian</li><li>merchant</li><li>midwife</li><li>miller</li><li>miner</li><li>porter</li><li>sailor</li><li>scribe</li><li>shepherd</li><li>stable
        master</li><li>soldier</li><li>tanner</li><li>trapper</li><li>woodcutter.</li></ul><p><strong>Check:</strong>
        You can earn half your Profession check result in gold pieces per week
        of dedicated work. You know how to use the tools of your trade, how to
        perform the profession’s daily tasks, how to supervise helpers, and how
        to handle common problems. You can also answer questions about your
        Profession. Basic questions are DC 10, while more complex questions are
        DC 15 or higher.</p><p><strong>Action:</strong> Not applicable. A single
        check generally represents a week of work.</p><p><strong>Try
        Again:</strong> Varies. An attempt to use a Profession skill to earn
        income cannot be retried. You are stuck with whatever weekly wage your
        check result brought you. Another check may be made after a week to
        determine a new income for the next period of time. An attempt to
        accomplish some specific task can usually be
        retried.</p><p><strong>Untrained:</strong> Untrained laborers and
        assistants (that is, characters without any ranks in Profession) earn an
        average of 1 silver piece per day.</p><p><strong>Special:</strong> A
        @UUID[Compendium.pf1.races.efwHEwjvL9Z94MJI]{Gnome} gets a +2 bonus on a
        Craft or Profession skill of her
        choice.</p><h1>Herbalism</h1><p><strong>Source</strong>
        @Source[PZO1140;pages=152]</p><p>Herbs and useful plants and fungi
        abound in most wilderness regions, and while these valuable plants can
        be obtained in special markets or shops, the skilled herbalist knows
        where to go to gather these resources by hand in the
        wild.</p><p><strong>Gathering Herbs:</strong> Gathering herbs is similar
        to foraging and can be accomplished while you are traveling or as your
        sole activity during an 8-hour period. If you gather herbs while
        traveling, your overland speed is halved. Spending 8 hours doing nothing
        but gathering herbs from the area grants 1 additional yield of each herb
        you’re gathering.</p><p>When you start your day of herb gathering, you
        must declare which herb you are looking for. If you have 5 ranks of
        Profession (herbalist), you can search for two different types of herbs
        at once, and for each additional 5 ranks you have in this skill, you can
        search for one additional herb, to a maximum of 5 herbs at once if you
        have 20 ranks in Profession (herbalist).</p><p>Each herb listed below
        has a gather DC. At the end of the time spent gathering, attempt a
        Profession (herbalist) or
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.BWeqgXSZvUQl68vt]{Knowledge
        (nature)} check against each herb’s gather DC. If the terrain you are
        searching in is one of your favored terrains, you can attempt a Survival
        check instead. If the herb in question is present in the region you
        searched (this is always subject to the GM’s discretion), success
        results in a single yield of that herb. Success by 5 or more grants 1
        extra yield. Success by 10 or more grants 2 extra yields.</p><p>A single
        yield of herb weighs 1/10 of a pound unless otherwise noted in its yield
        section in the stats below.</p><p>In addition to determining whether a
        particular herb is available to gather in a region, the GM also
        determines how many attempts to gather that herb can be attempted in the
        region. Typically, a region can support 1d4 herb-gathering expeditions
        before the herbs must be given 2d6 months to
        regrow.</p><p><strong>Preparing Herbs:</strong> Most herbs must be
        prepared to unlock their potency. If this is the case for an herb, its
        stat block describes the method required to process it, the
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.3E8pxbjI8MD3JbfQ]{Craft
        (alchemy)} DC to accomplish this task, and the amount of time needed to
        do so. A Profession (herbalist) check can be conducted instead of a
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.3E8pxbjI8MD3JbfQ]{Craft
        (alchemy)}, but the DC of the check to prepare the herb increases by 5
        in this case. If the preparer fails this check by 5 or more, the dose of
        the herb is ruined; if she fails by less, she can try again with the
        same herbs.</p><p><strong>Preparing Multiple Herbs:</strong> An
        herbalist can normally prepare one type of herb per day, but she can
        prepare a number of doses of that single type of herb equal to her ranks
        in Profession (herbalist). An herbalist with 7 or more ranks in
        Profession (herbalist) can simultaneously prepare a second type of herb.
        At 14 ranks in Profession (herbalist), the character can prepare up to
        three types of herbs at the same time.</p><p><strong>Herb
        Lifespan:</strong> A raw, unprepared herb spoils 24 hours after it is
        harvested. A prepared herb spoils after 1 month unless otherwise noted
        in its Use entry.</p><h1>Skill Unlock</h1><p><strong>Source</strong>
        @Source[PZO1131;pages=86]</p><p>With sufficient ranks in Profession, you
        earn the following.</p><p><strong>5 Ranks:</strong> When using
        Profession checks to earn income, you earn gold pieces equal to the
        result of your check each week.</p><p><strong>10 Ranks:</strong> When
        attempting Profession checks, you can roll twice and take the better
        result. When answering questions about your Profession, you can always
        take 10.</p><p><strong>15 Ranks:</strong> You can attempt checks to earn
        income once per day instead of once per week.</p><p><strong>20
        Ranks:</strong> When attempting Profession checks, you can choose to
        roll once instead of twice. If you do and the result of the roll is less
        than 10, replace it with 10. When answering questions about your
        Profession, you can always take 20.</p>
      format: 1
    title:
      level: 1
      show: true
    type: text
  - _id: xQbTtefpEfEaOYo7
    _key: '!journal.pages!x175kVqUfLGPt8tC.xQbTtefpEfEaOYo7'
    _stats:
      coreVersion: '12.331'
    name: Ride
    sort: 1900000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1110;pages=103]</p><p><em>You are
        skilled at riding mounts, usually a horse, but possibly something more
        exotic, like a griffon or pegasus. If you attempt to ride a creature
        that is ill suited as a mount, you take a –5 penalty on your Ride
        checks.</em></p><p><strong>Check:</strong> Typical riding actions don’t
        require checks. You can saddle, mount, ride, and dismount from a mount
        without a problem. The following tasks do require
        checks.</p><table><thead><tr><td>Task</td><td>Ride
        DC</td></tr></thead><tbody><tr><td>Guide with
        knees</td><td>5</td></tr><tr><td>Stay in
        saddle</td><td>5</td></tr><tr><td>Fight with a combat-trained
        mount</td><td>10</td></tr><tr><td>Cover</td><td>15</td></tr><tr><td>Soft
        fall</td><td>15</td></tr><tr><td>Leap</td><td>15</td></tr><tr><td>Spur
        mount</td><td>15</td></tr><tr><td>Control mount in
        battle</td><td>20</td></tr><tr><td>Fast mount or
        dismount</td><td>20</td></tr></tbody></table><p><strong>Guide with
        Knees:</strong> You can guide your mount with your knees so you can use
        both hands in combat. Make your Ride check at the start of your turn. If
        you fail, you can use only one hand this round because you need to use
        the other to control your mount. This does not take an
        action.</p><p><strong>Stay in Saddle:</strong> You can react instantly
        to try to avoid falling when your mount rears or bolts unexpectedly or
        when you take damage. This usage does not take an
        action.</p><p><strong>Fight with a Combat-Trained Mount:</strong> If you
        direct your war-trained mount to attack in battle, you can still make
        your own attack or attacks normally. This usage is a free
        action.</p><p><strong>Cover:</strong> You can react instantly to drop
        down and hang alongside your mount, using it as cover. You can’t attack
        or cast spells while using your mount as cover. If you fail your Ride
        check, you don’t get the cover benefit. Using this option is an
        immediate action, but recovering from this position is a move action (no
        check required).</p><p><strong>Soft Fall:</strong> You negate damage
        when you fall off a mount. If you fail the Ride check, you take 1d6
        points of damage and are
        @UUID[Compendium.pf1.pf1e-rules.NSqfXaj4MevUR2uJ.JournalEntryPage.VbagnIPQS523dwxa]{prone}.
        This usage does not take an action.</p><p><strong>Leap:</strong> You can
        get your mount to leap obstacles as part of its movement. If the Ride
        check to make the leap succeeds, make a check using your Ride modifier
        or the mount’s jump modifier, which is lower, to see how far the
        creature can jump. If you fail your Ride check, you fall off the mount
        when it leaps and take the appropriate falling damage (at least 1d6
        points). This usage does not take an action but is part of the mount’s
        movement.</p><p><strong>Spur Mount:</strong> You can spur your mount to
        greater speed with a move action. A successful Ride check increases the
        mount’s speed by 10 feet for 1 round but deals 1d3 points of damage to
        the creature. You can use this ability every round, but the mount
        becomes fatigued after a number of rounds equal to its Constitution
        score. This ability cannot be used on a fatigued
        mount.</p><p><strong>Control Mount in Battle:</strong> As a move action,
        you can attempt to control a light horse, pony, heavy horse, or other
        mount not trained for combat riding while in battle. If you fail the
        Ride check, you can do nothing else in that round. You do not need to
        roll for horses or ponies trained for combat.</p><p><strong>Fast Mount
        or Dismount:</strong> You can attempt to mount or dismount from a mount
        of up to one size category larger than yourself as a free action,
        provided that you still have a move action available that round. If you
        fail the Ride check, mounting or dismounting is a move action. You can’t
        use fast mount or dismount on a mount more than one size category larger
        than yourself.</p><p><strong>Action:</strong> Varies. Mounting or
        dismounting normally is a move action. Other checks are a move action, a
        free action, or no action at all, as noted
        above.</p><p><strong>Special:</strong> If you are riding bareback, you
        take a –5 penalty on Ride checks.</p><p>If you have the
        @UUID[Compendium.pf1.feats.bqoIfsrF8BF1GC28]{Animal Affinity} feat, you
        get a bonus on Ride checks.</p><p>If you use a military saddle you get a
        +2 circumstance bonus on Ride checks related to staying in the
        saddle.</p><p>Ride is a prerequisite for
        @UUID[Compendium.pf1.feats.rp9HV7wYcMb333si]{Mounted Archery},
        @UUID[Compendium.pf1.feats.0spsP9ylE3goD3jc]{Mounted Combat},
        @UUID[Compendium.pf1.feats.liPAO5urMI9chctT]{Ride-By Attack},
        @UUID[Compendium.pf1.feats.jKVhOxHu6VmUgFdp]{Spirited Charge}, and
        @UUID[Compendium.pf1.feats.8mS9B8Uc8odklIpl]{Trample}.</p><h1>Skill
        Unlock</h1><p><strong>Source</strong>
        @Source[PZO1131;pages=86]</p><p>With sufficient ranks in Ride, you earn
        the following.</p><p><strong>5 Ranks:</strong> Your mount gains a +2
        bonus on Fortitude saves or Constitution checks to avoid becoming
        @UUID[Compendium.pf1.pf1e-rules.NSqfXaj4MevUR2uJ.JournalEntryPage.AVaxTNildXRzYnQm]{fatigued}
        or
        @UUID[Compendium.pf1.pf1e-rules.NSqfXaj4MevUR2uJ.JournalEntryPage.ITxxh53qgl74wWcE]{exhausted}.
        This bonus increases by 1 for every 5 ranks beyond 5 you possess in
        Ride.</p><p><strong>10 Ranks:</strong> When you spur your mount, its
        speed is increased by 20 feet, and it gains a +2 bonus on Reflex saves
        and a +2 dodge bonus to AC.</p><p><strong>15 Ranks:</strong> When an
        opponent targets you or your mount with a bull rush, drag, overrun,
        reposition, or trip combat maneuver while you are mounted, you can
        substitute the result of a Ride check in place of your (or your mount’s)
        CMD.</p><p><strong>20 Ranks:</strong> When you spur your mount, its
        speed is increased by 30 feet, and it gains a +4 bonus on Reflex saves
        and a +4 dodge bonus to AC.</p>
      format: 1
    title:
      level: 1
      show: true
    type: text
  - _id: ka0VQGItdrWw3paO
    _key: '!journal.pages!x175kVqUfLGPt8tC.ka0VQGItdrWw3paO'
    _stats:
      coreVersion: '12.331'
    name: Sense Motive
    sort: 2000000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1110;pages=104]</p><p><em>You are
        skilled at detecting falsehoods and true
        intentions.</em></p><p><strong>Check:</strong> A successful check lets
        you avoid being bluffed (see the
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.kRK5XwVBvcMi35w2]{Bluff}
        skill). You can also use this skill to determine when "something is up"
        (that is, something odd is going on) or to assess someone’s
        trustworthiness.</p><table><thead><tr><td>Task</td><td>Sense Motive
        DC</td></tr></thead><tbody><tr><td>Hunch</td><td>20</td></tr><tr><td>Sense
        enchantment</td><td>25 or 15</td></tr><tr><td>Discern secret
        message</td><td>Varies</td></tr></tbody></table><p><strong>Hunch:</strong>
        This use of the skill involves making a gut assessment of the social
        situation. You can get the feeling from another’s behavior that
        something is wrong, such as when you’re talking to an impostor.
        Alternatively, you can get the feeling that someone is
        trustworthy.</p><p><strong>Sense Enchantment:</strong> You can tell that
        someone’s behavior is being influenced by an enchantment effect even if
        that person isn’t aware of it. The usual DC is 25, but if the target is
        dominated (see @UUID[Compendium.pf1.spells.q070n0zoq3zojpas]{Dominate
        Person}), the DC is only 15 because of the limited range of the target’s
        activities.</p><p><strong>Discern Secret Message:</strong> You may use
        Sense Motive to detect that a hidden message is being transmitted via
        the Bluff skill. In this case, your Sense Motive check is opposed by the
        Bluff check of the character transmitting the message. For each piece of
        information relating to the message that you are missing, you take a –2
        penalty on your Sense Motive check. If you succeed by 4 or less, you
        know that something hidden is being communicated, but you can’t learn
        anything specific about its content. If you beat the DC by 5 or more,
        you intercept and understand the message. If you fail by 4 or less, you
        don’t detect any hidden communication. If you fail by 5 or more, you
        might infer false information.</p><p><strong>Action:</strong> Trying to
        gain information with Sense Motive generally takes at least 1 minute,
        and you could spend a whole evening trying to get a sense of the people
        around you.</p><p><strong>Try Again:</strong> No, though you may make a
        Sense Motive check for each
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.kRK5XwVBvcMi35w2]{Bluff}
        check made against you.</p><p><strong>Special:</strong> A ranger gains a
        bonus on Sense Motive checks when using this skill against a favored
        enemy.</p><p>If you have the
        @UUID[Compendium.pf1.feats.Q1cY8r0Pvb66pMG0]{Alertness} feat, you get a
        bonus on Sense Motive checks (see
        Feats).</p><h1>Prognostication</h1><p><strong>Source</strong>
        @Source[PZO1132;pages=196]</p><p>You are skilled in means of folk
        divination. The most common methods are cartomancy (reading cards),
        cheiromancy (reading a creature’s palms), crystallomancy
        (crystal-gazing), extispicy (reading animal entrails), horoscopy
        (reading a creature’s birth stars), oneiromancy (interpreting dreams),
        osteomancy (reading cast bones), and pyromancy (reading
        flames).</p><p><strong>Check:</strong> Once per day, you can predict a
        creature’s fortune for the near future. You spend 10 minutes
        interpreting the divination means at your disposal. The GM then attempts
        a secret Sense Motive check with a DC modified by the subject’s Hit Dice
        (see the table below). The result of the check can give you basic
        insight into the subject’s nature, including its alignment, class, and
        levels or Hit Dice, and might reveal clues to the creature’s immediate
        future. Determining the immediate future as an augury spell has a chance
        of successfully interpreting meaningful readings equal to 60% plus 5%
        for every point by which the check result exceeds the DC (to a maximum
        of 90%). With a single check, you determine all the information whose DC
        you meet. For instance, if you had a result of 22 when telling the
        fortune of a creature with 2 HD, you would learn that creature’s
        alignment and class, but not its level, HD, or
        fortune.</p><table><thead><tr><td>Task</td><td>DC</td></tr></thead><tbody><tr><td>Determine
        alignment</td><td>15 + creature’s HD</td></tr><tr><td>Determine
        class</td><td>20 + creature’s HD</td></tr><tr><td>Determine level or
        HD</td><td>25 + creature’s HD</td></tr><tr><td>Determine fortune as
        @UUID[Compendium.pf1.spells.d1wxnax51cecplm4]{Augury} spell</td><td>25 +
        creature’s HD</td></tr></tbody></table><p><strong>Action:</strong>
        Reading a creature’s fortune requires 10 minutes of uninterrupted
        contemplation, and the subject creature must be
        present.</p><p><strong>Try Again:</strong> Yes. You can attempt to read
        a particular creature’s fortune repeatedly, but only once per 24
        hours.</p><p><strong>Special:</strong> Specially crafted items purchased
        for the exclusive use of this skill grant a +2 circumstance bonus on
        Sense Motive checks to prognosticate.</p><h2>Occult Skill
        Unlocks</h2><p>Characters capable of casting psychic spells or who have
        the Psychic Sensitivity feat gain access to skill unlocks—a host of
        esoteric skill uses not available to other PCs. These are not entirely
        new skills, but rather new uses of existing skills for those trained in
        the occult arts. A character must be trained in the appropriate skill to
        use that skill’s unlock, even if the skill can normally be used
        untrained. It’s impossible to take 10 for an occult skill unlock. Occult
        skill unlocks require intense concentration and strenuous effort, so the
        amount a character can use each skill unlock is limited to once per day
        or per week. This limit is for all uses of the skill unlock; if a
        character uses hypnotism to implant a suggestion, he can’t also use it
        to recall memories on the same day.</p><h1>Skill
        Unlock</h1><p><strong>Source</strong>
        @Source[PZO1131;pages=86]</p><p>With sufficient ranks in Sense Motive,
        you earn the following.</p><p><strong>5 Ranks:</strong> If you were
        aware of an opponent before rolling initiative (such as when you ambush
        an enemy or negotiations break down into combat, but not when both sides
        happen upon each other or you are surprised), you can attempt a Sense
        Motive check as part of your initiative check (DC = 11 + the highest
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.kRK5XwVBvcMi35w2]{Bluff}
        modifier among your opponents or DC 15, whichever is higher). If you
        succeed, you gain a +1 bonus on the initiative check, plus an additional
        +1 for every 5 by which you exceeded the DC.</p><p><strong>10
        Ranks:</strong> After 1 minute of conversation, you can read a
        creature’s surface thoughts (as detect thoughts) by attempting a Sense
        Motive check at a –20 penalty opposed by the creature’s
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.kRK5XwVBvcMi35w2]{Bluff}
        check.</p><p><strong>15 Ranks:</strong> You can read surface thoughts as
        above after 1 round. In addition, when attacked, you can attempt a Sense
        Motive check as an immediate action opposed by your target’s attack
        roll. A successful check grants a +2 insight bonus to your AC against
        attacks from that specific opponent for 1 minute.</p><p><strong>20
        Ranks:</strong> You can read surface thoughts as above as a standard
        action. A successful check to gain an insight bonus to your AC also
        negates the attack that triggered it.</p>
      format: 1
    title:
      level: 1
      show: true
    type: text
  - _id: joza8kAIiImrPft7
    _key: '!journal.pages!x175kVqUfLGPt8tC.joza8kAIiImrPft7'
    _stats:
      coreVersion: '12.331'
    name: Sleight of Hand
    sort: 2100000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1110;pages=104]</p><p><em>Your
        training allows you to pick pockets, draw hidden weapons, and take a
        variety of actions without being
        noticed.</em></p><p><strong>Check:</strong> A DC 10 Sleight of Hand
        check lets you palm a coin-sized, unattended object. Performing a minor
        feat of legerdemain, such as making a coin disappear, also has a DC of
        10 unless an observer is determined to note where the item
        went.</p><p>When you use this skill under close observation, your skill
        check is opposed by the observer’s
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.2h6hz5AkTDxKPFxr]{Perception}
        check. The observer’s success doesn’t prevent you from performing the
        action, just from doing it unnoticed.</p><p>You can hide a small object
        (including a light weapon or an easily concealed ranged weapon, such as
        a @UUID[Compendium.pf1.weapons-and-ammo.mCwwHo32SU7kjGyu]{dart},
        @UUID[Compendium.pf1.weapons-and-ammo.cJV7OBm9KiF2WWiu]{sling}, or
        @UUID[Compendium.pf1.weapons-and-ammo.BgTqaNqyS3tnLGAg]{hand crossbow})
        on your body. Your Sleight of Hand check is opposed by the
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.2h6hz5AkTDxKPFxr]{Perception}
        check of anyone observing you or of anyone frisking you. In the latter
        case, the searcher gains a +4 bonus on the
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.2h6hz5AkTDxKPFxr]{Perception}
        check, since it’s generally easier to find such an object than to hide
        it. A @UUID[Compendium.pf1.weapons-and-ammo.fOSuWwRSZLTrROch]{dagger} is
        easier to hide than most light weapons, and grants you a +2 bonus on
        your Sleight of Hand check to conceal it. An extraordinarily small
        object, such as a coin,
        @UUID[Compendium.pf1.weapons-and-ammo.42M7kFLkyccrj1uf]{shuriken}, or
        ring, grants you a +4 bonus on your Sleight of Hand check to conceal it,
        and heavy or baggy clothing (such as a cloak) grants you a +2 bonus on
        the check.</p><p>Drawing a hidden weapon is a standard action and
        doesn’t provoke an attack of opportunity.</p><p>If you try to take
        something from a creature, you must make a DC 20 Sleight of Hand check.
        The opponent makes a Perception check to detect the attempt, opposed by
        the Sleight of Hand check result you achieved when you tried to grab the
        item. An opponent who succeeds on this check notices the attempt,
        regardless of whether you got the item. You cannot use this skill to
        take an object from another creature during combat if the creature is
        aware of your presence.</p><p>You can also use Sleight of Hand to
        entertain an audience as though you were using the Perform skill. In
        such a case, your "act" encompasses elements of legerdemain, juggling,
        and the like.</p><table><thead><tr><td>Sleight of Hand
        DC</td><td>Task</td></tr></thead><tbody><tr><td>10</td><td>Palm a
        coin-sized object, make a coin
        disappear</td></tr><tr><td>20</td><td>Lift a small object from a
        person</td></tr></tbody></table><p><strong>Action:</strong> Any Sleight
        of Hand check is normally a standard action. However, you may perform a
        Sleight of Hand check as a move action by taking a –20 penalty on the
        check.</p><p><strong>Try Again:</strong> Yes, but after an initial
        failure, a second Sleight of Hand attempt against the same target (or
        while you are being watched by the same observer who noticed your
        previous attempt) increases the DC for the task by
        10.</p><p><strong>Untrained:</strong> An untrained Sleight of Hand check
        is simply a Dexterity check. Without actual training, you can’t succeed
        on any Sleight of Hand check with a DC higher than 10, except for hiding
        an object on your body.</p><p><strong>Special:</strong> If you have the
        @UUID[Compendium.pf1.feats.SMyexRzOm5PfjT5I]{Deft Hands} feat, you get a
        bonus on Sleight of Hand checks (see Feats).</p><h1>Palm
        Weapon</h1><p><strong>Source</strong> @Source[PZO9469;pages=9]</p><p>You
        can draw a light weapon without anyone
        noticing.</p><p><strong>Check:</strong> A successful DC 20 Sleight of
        Hand check allows you to unobtrusively draw a weapon or other object no
        larger or longer than a light weapon (which includes potions, but not
        wands or alchemist bombs). Observers can notice you drawing the item as
        normal with opposed Perception checks. Creatures carefully observing you
        gain a +4 bonus on this Perception check.</p><h1>Skill
        Unlock</h1><p><strong>Source</strong>
        @Source[PZO1131;pages=86]</p><p>With sufficient ranks in Sleight of
        Hand, you earn the following.</p><p><strong>5 Ranks</strong>: When
        attempting a disarm or steal maneuver, a successful Sleight of Hand
        check against your target’s CMD grants a +2 circumstance bonus on your
        combat maneuver check.</p><p><strong>10 Ranks:</strong> The penalty for
        attempting a Sleight of Hand check (including drawing a hidden weapon)
        as a move action is reduced to –10.</p><p><strong>15 Ranks:</strong> You
        can attempt a Sleight of Hand check (including drawing a hidden weapon)
        as a swift action at a –20 penalty.</p><p><strong>20 Ranks:</strong> You
        take no penalty for using Sleight of Hand as a move action, and take
        only a –10 penalty when using it as a swift action.</p>
      format: 1
    title:
      level: 1
      show: true
    type: text
  - _id: VRD7jxiIAxKPt6EF
    _key: '!journal.pages!x175kVqUfLGPt8tC.VRD7jxiIAxKPt6EF'
    _stats:
      coreVersion: '12.331'
    name: Spellcraft
    sort: 2200000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1110;pages=106]</p><p>You are
        skilled at the art of casting spells, identifying magic items, crafting
        magic items, and identifying spells as they are being
        cast.</p><p><strong>Check:</strong> Spellcraft is used whenever your
        knowledge and skill of the technical art of casting a spell or crafting
        a magic item comes into question. This skill is also used to identify
        the properties of magic items in your possession through the use of
        spells such as @UUID[Compendium.pf1.spells.uqh87jz757r2cb7r]{Detect
        Magic} and @UUID[Compendium.pf1.spells.llxrra87kbofmyhl]{Identify}. The
        DC of this check varies depending upon the task at
        hand.</p><p><strong>Action:</strong> Identifying a spell as it is being
        cast requires no action, but you must be able to clearly see the spell
        as it is being cast, and this incurs the same penalties as a Perception
        skill check due to distance, poor conditions, and other factors.
        Learning a spell from a spellbook takes 1 hour per level of the spell
        (0-level spells take 30 minutes). Preparing a spell from a borrowed
        spellbook does not add any time to your spell preparation. Making a
        Spellcraft check to craft a magic item is made as part of the creation
        process. Attempting to ascertain the properties of a magic item takes 3
        rounds per item to be identified and you must be able to thoroughly
        examine the object.</p><p><strong>Retry:</strong> You cannot retry
        checks made to identify a spell. If you fail to learn a spell from a
        spellbook or scroll, you must wait at least 1 week before you can try
        again. If you fail to prepare a spell from a borrowed spellbook, you
        cannot try again until the next day. When using
        @UUID[Compendium.pf1.spells.uqh87jz757r2cb7r]{Detect Magic} or identify
        to learn the properties of magic items, you can only attempt to
        ascertain the properties of an individual item once per day. Additional
        attempts reveal the same results.</p><p><strong>Special:</strong> If you
        are a specialist wizard, you get a +2 bonus on Spellcraft checks made to
        identify, learn, and prepare spells from your chosen school. Similarly,
        you take a –5 penalty on similar checks made concerning spells from your
        opposition schools.</p><p>An
        @UUID[Compendium.pf1.races.NgIhxRI0axrf3fcO]{Elf} gets a +2 racial bonus
        on Spellcraft checks to identify the properties of magic items.</p><p>If
        you have the @UUID[Compendium.pf1.feats.CLSsMyNmdcNAOUKC]{Magical
        Aptitude} feat, you gain a bonus on Spellcraft checks (see
        Feats).</p><table><thead><tr><td>Task</td><td>Spellcraft
        DC</td></tr></thead><tbody><tr><td>Identify a spell as it is being
        cast</td><td>15 + spell level</td></tr><tr><td>Learn a spell from a
        spellbook or scroll</td><td>15 + spell level</td></tr><tr><td>Prepare a
        spell from a borrowed spellbook</td><td>15 + spell
        level</td></tr><tr><td>Identify the properties of a magic item using
        detect magic</td><td>15 + item’s caster level</td></tr><tr><td>Decipher
        a scroll</td><td>20 + spell level</td></tr><tr><td>Craft a magic
        item</td><td>Varies by
        item</td></tr></tbody></table><h1>Salvaging</h1><p><strong>Source</strong>
        @Source[PZO1140;pages=134]</p><p>Foraging is one way to gather resources
        in the wild, but you can also recycle or repurpose items and gear as
        well, salvaging materials from items you no longer need or are willing
        to sacrifice. You can’t salvage materials from artifacts, cursed items,
        or items you can’t destroy. Successfully salvaging an item requires a
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.3E8pxbjI8MD3JbfQ]{Craft}
        or Spellcraft check and takes an amount of time as indicated in the
        specific type of salvage operation
        below.</p><p><strong>Ammunition:</strong> You can use destroyed
        ammunition as raw materials for new ammunition. Five pieces of destroyed
        ammunition provide suitable material to create one new piece of
        ammunition using the normal crafting
        rules.</p><p><strong>Potions:</strong> If you have the
        @UUID[Compendium.pf1.feats.nNVFVFRBCT4O2ab9]{Brew Potion} feat, you can
        combine natural catalysts with a potion to salvage it and create a
        different potion of a lower spell level. Salvaging a potion requires raw
        magic item materials (these can be salvaged from existing items, as
        detailed below). To salvage a potion, you must spend 1 hour per spell
        level of the original potion and then attempt a
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.3E8pxbjI8MD3JbfQ]{Craft
        (alchemy)} or Spellcraft check with a DC equal to 15 + 3 × the original
        potion’s spell level. If you succeed, you transmute the original potion
        into a new potion of a spell at least one spell level lower, provided
        you know the spell in question (it need not be one you can currently
        cast). If you fail this check by 4 or less, the attempt fails and the
        catalyst is wasted, but the potion is unharmed. If you fail by 5 or
        more, the raw materials are lost and the original potion is
        ruined.</p><p><strong>Raw Crafting Materials:</strong> Anyone trained in
        the
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.3E8pxbjI8MD3JbfQ]{Craft}
        skill can salvage raw materials from equipment for use in crafting or
        repair. You must carefully dismantle the item to be salvaged, resulting
        in the item’s destruction. If the item’s price is 1 gp or less, its
        materials can be salvaged with only 1 hour of work; otherwise it takes 8
        hours to salvage crafting materials. A successful Craft check against
        the item’s creation DC + 5 yields raw materials worth one-quarter the
        item’s price. If you fail the Craft check by 4 or less, the item is
        destroyed but the materials can still be salvaged in a future attempt.
        If you fail the Craft check by 5 or more, the item is destroyed and the
        materials are ruined. Salvaged raw materials can be used to create or
        repair any item of the same materials and reduces the construction time
        by the proportion of the new item’s raw materials that are salvaged
        (minimum 8 hours).</p><p><strong>Raw Magic Item Materials:</strong>
        Anyone with an item creation feat can salvage the raw materials from
        magic items for the creation of new ones or repair of existing ones. You
        must have the item creation feat required for that item to salvage its
        raw materials. Each attempt requires destroying a magic item and 8 hours
        of work. If the item’s price is 500 gp or less, you can salvage its
        materials in only 2 hours. A successful
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.3E8pxbjI8MD3JbfQ]{Craft}
        or Spellcraft check with a DC equal to 10 + the item’s caster level
        yields raw materials worth two-thirds the creation cost of the destroyed
        item (one-third the market price). If you fail the skill check by 4 or
        less, the item is destroyed but the materials can still be salvaged in a
        future attempt. If you fail the skill check by 5 or more, the item is
        destroyed and the materials are ruined. Salvaged raw materials can be
        used to create or repair any item made of similar materials or that
        shares any of the creation requirements as the original. Including the
        majority of the materials allows you to automatically meet any
        construction requirements of a new item that the salvaged item also
        required and reduces the construction or repair time by the proportion
        of the new item’s construction materials that are salvaged (with the
        usual minimum creation time). Spellbooks and formula books can be
        salvaged for magic inks and paper usable in formula books, scrolls, and
        spellbooks.</p><p><strong>Costly Spell Components:</strong> Anyone
        trained in Spellcraft can salvage costly material or focus spell
        components from magic items. Each attempt requires destroying the item
        and 8 hours of work. An item can be broken down into a powder that can
        be used in place of gemstone dust as a material component. Otherwise,
        the item must have a spell requiring the component in its construction
        requirements to salvage that component. A successful Spellcraft check
        with a DC equal to 10 + the item’s caster level yields materials usable
        in place of that spell component worth two-thirds the item’s creation
        cost (one-third its market price). If you fail the check by 4 or less,
        the item is destroyed without yielding spell components, but you can try
        to salvage them again. If you fail the check by 5 or more, the item is
        destroyed and the spell components are ruined.</p><h1>Skill
        Unlock</h1><p><strong>Source</strong>
        @Source[PZO1131;pages=86]</p><p>With sufficient ranks in Spellcraft, you
        earn the following.</p><p><strong>5 Ranks:</strong> Identifying magic
        items takes 1 full round, and the time required to learn a spell from a
        spellbook is halved.</p><p><strong>10 Ranks:</strong> You can identify
        magic items without using detect magic, though the DC is increased by
        10.</p><p><strong>15 Ranks:</strong> Identifying magic items is a
        standard action, and the time required to learn a new spell from a
        spellbook is reduced to 1 minute per spell level.</p><p><strong>20
        Ranks:</strong> Whenever you attempt a caster level check, attempt a
        Spellcraft check at a –20 penalty at the same DC. If the spellcraft
        check succeeds, you gain a +2 circumstance bonus on your caster level
        check.</p>
      format: 1
    title:
      level: 1
      show: true
    type: text
  - _id: wRWHk7tCUHR99PzD
    _key: '!journal.pages!x175kVqUfLGPt8tC.wRWHk7tCUHR99PzD'
    _stats:
      coreVersion: '12.331'
    name: Stealth
    sort: 2300000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1110;pages=106]</p><p><em>You are
        skilled at avoiding detection, allowing you to slip past foes or strike
        from an unseen position. This skill covers hiding and moving
        silently.</em></p><p><strong>Check:</strong> Your Stealth check is
        opposed by the
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.2h6hz5AkTDxKPFxr]{Perception}
        check of anyone who might notice you. Creatures that fail to beat your
        Stealth check are not aware of you and treat you as if you had total
        concealment. You can move up to half your normal speed and use Stealth
        at no penalty. When moving at a speed greater than half but less than
        your normal speed, you take a -5 penalty. It’s impossible to use Stealth
        while attacking, running, or charging.</p><p>Creatures gain a bonus or
        penalty on Stealth checks based on their size: Fine +16, Diminutive +12,
        Tiny +8, Small +4, Medium +0, Large -4, Huge -8, Gargantuan -12,
        Colossal -16.</p><p>If people are observing you using any of their
        senses (but typically sight), you can’t use Stealth. Against most
        creatures, finding cover or concealment allows you to use Stealth. If
        your observers are momentarily distracted (such as by a Bluff check),
        you can attempt to use Stealth. While the others turn their attention
        from you, you can attempt a Stealth check if you can get to an
        unobserved place of some kind. This check, however, is made at a –10
        penalty because you have to move fast.</p><p><strong>Breaking
        Stealth:</strong> When you start your turn using Stealth, you can leave
        cover or concealment and remain unobserved as long as you succeed at a
        Stealth check and end your turn in cover or concealment. Your Stealth
        immediately ends after you make and attack roll, whether or not the
        attack is successful (except when sniping as noted
        below).</p><p><strong>Sniping:</strong> If you’ve already successfully
        used Stealth at least 10 feet from your target, you can make one ranged
        attack and then immediately use Stealth again. You take a –20 penalty on
        your Stealth check to maintain your obscured
        location.</p><p><strong>Creating a Diversion to Hide:</strong> You can
        use Bluff to allow you to use Stealth. A successful
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.kRK5XwVBvcMi35w2]{Bluff}
        check can give you the momentary diversion you need to attempt a Stealth
        check while people are aware of you.</p><p><strong>Action:</strong>
        Usually none. Normally, you make a Stealth check as part of movement, so
        it doesn’t take a separate action. However, using Stealth immediately
        after a ranged attack (see Sniping, above) is a move
        action.</p><p><strong>Special:</strong> If you are invisible, you gain a
        +40 bonus on Stealth checks if you are immobile, or a +20 bonus on
        Stealth checks if you’re moving.</p><p>If you have the
        @UUID[Compendium.pf1.feats.f5FPqAYWlKj3zCIY]{Stealthy} feat, you get a
        bonus on Stealth checks (see Feats).</p><h1>Skill
        Unlock</h1><p><strong>Source</strong>
        @Source[PZO1131;pages=86]</p><p>With sufficient ranks in Stealth, you
        earn the following.</p><p><strong>5 Ranks:</strong> Reduce the Stealth
        penalty from sniping by 10.</p><p><strong>10 Ranks:</strong> Stealth
        check penalties for moving quickly are halved, including the ability
        unlocked at 5 ranks, moving full speed, and reaching concealment after
        creating a distraction.</p><p><strong>15 Ranks:</strong> If you attack
        after successfully using Stealth, your target is denied its Dexterity
        bonus against all attacks that you make before the end of your
        turn.</p><p><strong>20 Ranks:</strong> If you attack after successfully
        using Stealth, your target is denied its Dexterity bonus against all
        attacks that you make before the beginning of your next turn.</p>
      format: 1
    title:
      level: 1
      show: true
    type: text
  - _id: pLdYavy4nssLEoGV
    _key: '!journal.pages!x175kVqUfLGPt8tC.pLdYavy4nssLEoGV'
    _stats:
      coreVersion: '12.331'
    name: Survival
    sort: 2400000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1110;pages=107]</p><p>You are
        skilled at surviving in the wild and at navigating in the wilderness.
        You also excel at following trails and tracks left by
        others.</p><p><strong>Check:</strong> You can keep yourself and others
        safe and fed in the wild. The table below gives the DCs for various
        tasks that require Survival checks.</p><table><thead><tr><td>Survival
        DC</td><td>Task</td></tr></thead><tbody><tr><td>10</td><td>Get along in
        the wild. Move up to half your overland speed while hunting and foraging
        (no food or water supplies needed). You can provide food and water for
        one other person for every 2 points by which your check result exceeds
        10.</td></tr><tr><td>15</td><td>Gain a +2 bonus on all Fortitude saves
        against severe weather while moving up to half your overland speed, or
        gain a +4 bonus if you remain stationary. You may grant the same bonus
        to one other character for every 1 point by which your Survival check
        result exceeds 15.</td></tr><tr><td>15</td><td>Keep from getting lost or
        avoid natural hazards, such as
        quicksand.</td></tr><tr><td>15</td><td>Predict the weather up to 24
        hours in advance. For every 5 points by which your Survival check result
        exceeds 15, you can predict the weather for one additional day in
        advance.</td></tr></tbody></table><p><strong>Follow Tracks:</strong> To
        find tracks or to follow them for 1 mile requires a successful Survival
        check. You must make another Survival check every time the tracks become
        difficult to follow. If you are not trained in this skill, you can make
        untrained checks to find tracks, but you can follow them only if the DC
        for the task is 10 or lower. Alternatively, you can use the
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.2h6hz5AkTDxKPFxr]{Perception}
        skill to find a footprint or similar sign of a creature’s passage using
        the same DCs, but you can’t use Perception to follow tracks, even if
        someone else has already found them.</p><p>You move at half your normal
        speed while following tracks (or at your normal speed with a –5 penalty
        on the check, or at up to twice your normal speed with a –20 penalty on
        the check). The DC depends on the surface and the prevailing conditions,
        as given on the table.</p><table><thead><tr><td>Surface</td><td>Survival
        DC</td></tr></thead><tbody><tr><td>Very soft
        ground</td><td>5</td></tr><tr><td>Soft
        ground</td><td>10</td></tr><tr><td>Firm
        ground</td><td>15</td></tr><tr><td>Hard
        ground</td><td>20</td></tr></tbody></table><p><strong>Very Soft
        Ground:</strong> Any surface (fresh snow, thick dust, wet mud) that
        holds deep, clear impressions of footprints.</p><p><strong>Soft
        Ground:</strong> Any surface soft enough to yield to pressure, but
        firmer than wet mud or fresh snow, in which a creature leaves frequent
        but shallow footprints.</p><p><strong>Firm Ground:</strong> Most normal
        outdoor surfaces (such as lawns, fields, woods, and the like) or
        exceptionally soft or dirty indoor surfaces (thick rugs and very dirty
        or dusty floors). The creature might leave some traces (broken branches
        or tufts of hair), but it leaves only occasional or partial
        footprints.</p><p><strong>Hard Ground:</strong> Any surface that doesn’t
        hold footprints at all, such as bare rock or an indoor floor. Most
        streambeds fall into this category, since any footprints left behind are
        obscured or washed away. The creature leaves only traces (scuff marks or
        displaced pebbles).</p><table><thead><tr><td>Condition</td><td>Survival
        DC Modifier</td></tr></thead><tbody><tr><td>Every three creatures in the
        group being tracked</td><td>–1</td></tr><tr><td>Size of creature or
        creatures being
        tracked:<sup>1</sup></td><td></td></tr><tr><td>-Fine</td><td>+8</td></tr><tr><td>-Diminutive</td><td>+4</td></tr><tr><td>-Tiny</td><td>+2</td></tr><tr><td>-Small</td><td>+1</td></tr><tr><td>-Medium</td><td>+0</td></tr><tr><td>-Large</td><td>–1</td></tr><tr><td>-Huge</td><td>–2</td></tr><tr><td>-Gargantuan</td><td>–4</td></tr><tr><td>-Colossal</td><td>–8</td></tr><tr><td>Every
        24 hours since the trail was made</td><td>+1</td></tr><tr><td>Every hour
        of rain since the trail was made</td><td>+1</td></tr><tr><td>Fresh snow
        since the trail was made</td><td>+10</td></tr><tr><td>Poor
        visibility:<sup>2</sup></td><td></td></tr><tr><td>-Overcast or moonless
        night</td><td>+6</td></tr><tr><td>-Moonlight</td><td>+3</td></tr><tr><td>-Fog
        or precipitation</td><td>+3</td></tr><tr><td>Tracked party hides trail
        (and moves at half speed)</td><td>+5</td></tr></tbody></table><p><sup>1
        For a group of mixed sizes, apply only the modifier for the largest size
        category.</sup><br /><sup>2 Apply only the largest modifier from this
        category.</sup></p><p>Several modifiers may apply to the Survival check,
        as given on the table above.</p><p><strong>Action:</strong> Varies. A
        single Survival check may represent activity over the course of hours or
        a full day. A Survival check made to find tracks is at least a
        full-round action, and it may take even longer.</p><p><strong>Try
        Again:</strong> Varies. For getting along in the wild or for gaining the
        Fortitude save bonus noted in the first table above, you make a Survival
        check once every 24 hours. The result of that check applies until the
        next check is made. To avoid getting lost or avoid natural hazards, you
        make a Survival check whenever the situation calls for one. Retries to
        avoid getting lost in a specific situation or to avoid a specific
        natural hazard are not allowed. For finding tracks, you can retry a
        failed check after 1 hour (outdoors) or 10 minutes (indoors) of
        searching.</p><p><strong>Special:</strong> If you are trained in
        Survival, you can automatically determine where true north lies in
        relation to yourself.</p><p>A ranger gains a bonus on Survival checks
        when using this skill to find or follow the tracks of a favored
        enemy.</p><p>If you have the
        @UUID[Compendium.pf1.feats.8VZQJOyAXbXghxd7]{Self-Sufficient} feat, you
        get a bonus on Survival checks (see Feats).</p><h1>Building Makeshift
        Tools and Structures</h1><p><strong>Source</strong>
        @Source[PZO9456;pages=8]</p><p>With a successful DC 15 Survival check
        and 1 hour of work, you can build the following temporary tools and
        structures from natural materials using a
        @UUID[Compendium.pf1.weapons-and-ammo.F9GR4mUpehjkNdMj]{handaxe},
        @UUID[Compendium.pf1.weapons-and-ammo.Uw42p33QKEUhlSMi]{kukri}, utility
        knife, or similar item (including anything that can be used as a shovel,
        if building a snow cave). Without a proper tool, you have to use
        improvised tools (imposing a –2 penalty on the Survival check).
        Makeshift structures and objects have half the normal hardness and hit
        points of a properly constructed version, and have a 10% chance of
        falling apart for each day of use. GMs may choose to allow other
        primitive tools based on these, at their
        discretion.</p><p><strong>Cooking Vessel:</strong> Flat rocks can be
        used as primitive frying pans, and wood can be hollowed out and charred
        to make simple bowls and even pots.</p><p><strong>Lean-To:</strong> This
        rudimentary shelter for two creatures of your size grants its occupants
        a +4 bonus on Fortitude saves against severe weather. The construction
        requires 20 feet of rope.</p><p><strong>Raft:</strong> This log raft for
        two people requires 10 feet of rope to
        construct.</p><p><strong>Rope:</strong> Makeshift rope is constructed in
        10-foot lengths, though multiple lengths can be spliced together to make
        a longer rope. A makeshift rope gains the broken condition if the user
        rolls a natural 1 on a skill check involving the rope. If already
        broken, the rope snaps instead.</p><p><strong>Snow Cave:</strong> The
        temperature in an inhabited snow cave generally remains around 32º F
        regardless of outside temperature. A lit candle further increases the
        temperature by 10º F.</p><p><strong>Torch:</strong> A makeshift
        @UUID[Compendium.pf1.items.snfogneawzopfzzl]{torch} burns for 1d6 × 5
        minutes and has the fragile quality if used as an improvised
        weapon.</p><h1>Dowsing</h1><p><strong>Source</strong>
        @Source[PZO1132;pages=195]</p><p>You channel mysterious forces in the
        nearby environment to locate hidden
        resources.</p><p><strong>Check:</strong> Once per day, you can follow a
        dowsing rod’s movements to locate a particular type of location. Each
        attempt requires 10 minutes of intense concentration, after which you
        attempt the Survival check with the DC listed on the table below. The
        maximum range at which you can detect anything using dowsing is 400 feet
        + 40 feet per rank in Survival you possess. The rod’s directions persist
        for up to 10 minutes. You choose a particular target each time you
        dowse, and get the following information on a successful
        check.</p><p><strong>Find Water:</strong> The dowsing rod points toward
        the largest source of fresh water within range, including aquifers,
        lakes, ponds, and springs.</p><p><strong>Grave Dowsing:</strong> The
        dowsing rod points in the direction of the largest burial site, cairn,
        or tomb within range.</p><p><strong>Locate Metal and Gems:</strong> You
        concentrate on a specific metal or mineral. On a successful check, the
        dowsing rod points to the largest quantity of the selected mineral
        within range.</p><table><thead><tr><td>Dowsing
        Target</td><td>DC</td></tr></thead><tbody><tr><td>Water</td><td>15</td></tr><tr><td>Grave</td><td>20</td></tr><tr><td>Mineral</td><td>25</td></tr></tbody></table><p><strong>Action:</strong>
        Dowsing attempts take 10 minutes to initiate. The results of the check
        persist for 10 minutes afterward.</p><p><strong>Try Again:</strong> Yes.
        You can try to dowse from the same location more than once, but still
        only once per day.</p><h2>Occult Skill Unlocks</h2><p>Characters capable
        of casting psychic spells or who have the Psychic Sensitivity feat gain
        access to skill unlocks—a host of esoteric skill uses not available to
        other PCs. These are not entirely new skills, but rather new uses of
        existing skills for those trained in the occult arts. A character must
        be trained in the appropriate skill to use that skill’s unlock, even if
        the skill can normally be used untrained. It’s impossible to take 10 for
        an occult skill unlock. Occult skill unlocks require intense
        concentration and strenuous effort, so the amount a character can use
        each skill unlock is limited to once per day or per week. This limit is
        for all uses of the skill unlock; if a character uses hypnotism to
        implant a suggestion, he can’t also use it to recall memories on the
        same day.</p><h1>Foraging</h1><p><strong>Source</strong>
        @Source[PZO1140;pages=134]</p><p>These foraging techniques assume a
        search in a typically bountiful wilderness area. The exact time required
        to forage for supplies depends on the specific supplies desired and the
        type of terrain being searched, as does the DC of the skill check to
        successfully forage, as listed on Table 4–4 below. As a general rule, a
        character who spends more than 8 hours per day foraging becomes
        fatigued.</p><p>The base amount of time required to forage for supplies
        depends on the type of supplies you’re searching for, as listed in each
        supply category below. When foraging, multiply this base time by the
        terrain’s “forage factor” as listed on the table below. Whether the
        terrain in question counts as standard, barren, or abundant depends on
        the type of terrain being searched, what is begin searched for, and the
        GM’s discretion (for example, a remote shoreline may qualify as abundant
        for the purposes of foraging for tools and weapons, but barren for the
        purposes of foraging for herbs), but in most cases, the standard
        category should be used. Rugged terrain includes all terrain with
        difficult physical obstacles (numerous steep mountainsides or cliffs,
        particularly dense undergrowth, or any other terrain where the
        searcher’s movement type is impeded), and its forage factor stacks with
        other forage factors for different types of
        terrain.</p><table><thead><tr><td>Type of Terrain</td><td>Forage
        Factor</td><td>Forage
        DC</td></tr></thead><tbody><tr><td>Standard</td><td>×1</td><td>15</td></tr><tr><td>Barren</td><td>×2</td><td>20</td></tr><tr><td>Abundant</td><td>×1/2</td><td>10</td></tr><tr><td>Terrain
        is rugged</td><td>×2</td><td>+5</td></tr></tbody></table><p>Time spent
        to forage for supplies need not be consecutive and can be split over
        multiple days. Once the required time has passed, attempt a skill check
        against the appropriate forage DC as indicated on the table above;
        typically this is a Survival check, but searching for some types of
        supplies sometimes allows the substitution of a different
        skill.</p><p>When a character attempts to forage for supplies, he must
        choose what kind of supplies he is searching for from the broad
        categories detailed below.</p><p><strong>Alchemical Supplies and
        Material Components:</strong> Many alchemical supplies and material
        components can be found in the wilderness. You can forage enough
        supplies to approximate the contents of an alchemy crafting kit or a
        spell component pouch with a successful Survival check and 2d4 hours of
        effort, but the GM can rule that certain components simply aren’t
        available in an area (for example, bat guano cannot be foraged in
        terrain where no bats live). If a component is unavailable in the area
        but its cost remains negligible, you can create a rudimentary substitute
        component from your foraged supplies with a successful
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.3E8pxbjI8MD3JbfQ]{Craft
        (alchemh)} or
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.VRD7jxiIAxKPt6EF]{Spellcraft}
        check and 1 hour of effort (DC = 15 + double the level of the extract or
        spell). An extract or spell cast with such an improvised substitute has
        a 20% chance of failure (in addition to any other chance of failure).
        Focus components or costly material components cannot be
        foraged.</p><p><strong>Herbs:</strong> Foraging for specific herbs
        requires a
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.BWeqgXSZvUQl68vt]{Knowledge
        (nature)}
        or@UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.224EaK0K72NhCeRi]{Profession
        (herbalist)} check and follows special rules, as presented on page 152
        of this book.</p><p><strong>Repair Materials and Improvised
        Tools:</strong> A period of 1d6 hours and a successful Survival check
        are enough to forage rudimentary supplies to perform field repairs for
        damaged equipment when the proper tools and supplies are not available.
        On a successful check, a character gathers the equivalent of 2d6 gp in
        raw materials. She must still spend the time and attempt
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.3E8pxbjI8MD3JbfQ]{Craft}
        or
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.VRD7jxiIAxKPt6EF]{Spellcraft}
        skill checks as normal to use these materials to repair an object, but
        she takes a –5 penalty on the check due to the foraged nature of the
        materials used. Repair materials gathered in this way cannot be
        sold.</p><p>If these gathered materials are instead used to craft
        improvised tools, a successful forage check gathers only the equivalent
        of 1d6 gp in raw materials. A
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.3E8pxbjI8MD3JbfQ]{Craft}
        or
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.VRD7jxiIAxKPt6EF]{Spellcraft}
        check to repair an object or to craft an improvised tool with foraged
        supplies always fails on a natural 1.</p><p><strong>Weapons:</strong>
        Functional
        @UUID[Compendium.pf1.weapons-and-ammo.vu3N4zCRDTUJ5FW4]{clubs} and
        @UUID[Compendium.pf1.weapons-and-ammo.6eAg4BT0RM8tfyUN]{quarterstaves}
        can be foraged with 10 minutes of foraging in any area with trees or
        wood; in other regions, clubs and quarterstaves require 1d4 hours of
        searching and function as improvised weapons. At the GM’s discretion,
        other improvised weapons can be foraged.</p><h1>Harvesting
        Poison</h1><p><strong>Source</strong>
        @Source[PZO1140;pages=142]</p><p>While some think of poison as an
        assassin’s tool, the herbalists and naturalists of the world know that
        poison carries in it no more inherent evil than fire or water. Indeed,
        in the wildlands of the world, harvesting poison to give a hunter an
        edge or to aid in the production of antivenom is a time-honored
        practice.</p><p>While
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.3E8pxbjI8MD3JbfQ]{Craft
        (alchemy)} is necessary to brew long-lasting poisons, there are many
        natural sources of poison in the world, and poison crafters who wish to
        avoid the expense of purchasing raw ingredients may seek to harvest
        poison from natural sources instead. The following section presents
        rules for harvesting poisons from the wild.</p><p>Unless a dose of
        harvested poison is preserved (see Preserving Harvested Poison on page
        143), it remains potent for 24 hours after it is
        harvested.</p><h2>Harvesting from Dead
        Creatures</h2><p><strong>Source</strong>
        @Source[PZO1140;pages=142]</p><p>Once a venomous creature is slain, its
        venom sacs can be removed, allowing 1 or more doses of its venom to be
        harvested for later use. In order to harvest venom, the creature must
        have been dead for less than 24 hours. Every hour the source creature
        has been dead reduces the lifespan of the harvested poison by an hour.
        Removing venom sacs is a messy and timeconsuming process, requiring 10
        minutes of work, access to surgical tools, and a container to store the
        venom in. If proper surgical tools are not available, a dagger or other
        light slashing weapon can be used, although this imposes a –2 penalty on
        checks to harvest the venom. The harvester must succeed at a Survival
        check (DC = 15 + the dead creature’s CR) in order to successfully
        harvest poison. On a success, the harvester acquires a single dose of
        the creature’s venom, plus 1 additional dose for every 5 by which the
        result of this check exceeded the DC (to a maximum number of doses equal
        to the creature’s Constitution modifier, minimum 1). Failing the check
        causes all of the venom to be lost. Failure by 5 or more exposes the
        harvester to 1d3 doses of the creature’s venom unless she has the poison
        use class feature.</p><h1>Harvesting Poison from
        Hazards</h1><p><strong>Source</strong>
        @Source[PZO1140;pages=142]</p><p>Some hazards, such as poison oak and
        spider vines, feature poisons that can be harvested by those who know
        how to do so. This process requires 1 hour and an
        @UUID[Compendium.pf1.items.vsanawzysjtywomw]{alchemist's lab} or
        @UUID[Compendium.pf1.items.xkunfssqoyoupryi]{alchemy crafting kit}. If
        the harvester succeeds at a Survival check (DC = 15 + the hazard’s CR),
        she collects 1 dose of poison. Harvesting poison from a hazard in this
        way requires getting close enough to it to touch it, which may expose
        the harvester to the hazard’s effects.</p><h1>Making a
        Fire</h1><p><strong>Source</strong> @Source[PZO9456;pages=8]</p><p>It is
        possible to make a fire even without flint and steel or other
        fire-making tools. Finding suitable materials to start a fire requires
        10 minutes of effort and a successful DC 20 Survival
        check.</p><h1>Obscuring Tracks</h1><p><strong>Source</strong>
        @Source[PZO9456;pages=8]</p><p>You can use Survival to make your tracks
        more difficult to follow. A successful DC 15 Survival check increases
        the DC of following your tracks by 4. You can move at only half speed
        while obscuring your tracks unless you increase the Survival check DC to
        do so by 5. If you’re traveling in a group, for every creature beyond
        yourself whose tracks you wish to obscure, increase the DC by an
        additional 1. Large creatures count as two creatures for this purpose,
        and Huge creatures count as four. You cannot conceal the tracks of
        groups traveling with Gargantuan or larger creatures.</p><h1>Snares and
        Simple Traps</h1><p><strong>Source</strong>
        @Source[PZO9456;pages=8]</p><p>As a normal part of using a Survival
        check to get along in the wild, a character can make simple snares and
        deadfalls to trap small game. Though not as robust or dangerous as
        ranger traps or traps created using the
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.3E8pxbjI8MD3JbfQ]{Craft
        (traps)} skill, simple traps and snares can also be used against prey
        that is more dangerous than typical game.</p><p>Regardless of the nature
        of its construction, such a trap acts as an extraordinary ranger snare
        trap (Pathfinder RPG Ultimate Magic 65), with the following
        modifications. With a successful DC 15 Survival check, a simple trap can
        be constructed in 20 minutes in a typical wilderness area using proper
        tools. The trap affects only creatures of a single size category,
        determined when the trap is constructed. (Smaller creatures slip out
        easily, and larger creatures are too big to be effectively snared.) The
        trap is obvious unless it is hidden with a successful DC 20 Stealth
        check, in which case noticing it requires a successful DC 15 Perception
        check. The trap’s DC is 13, it has 10 hit points, and it can be burst
        with a successful DC 15 Strength check. If left unattended, a simple
        trap has a 25% chance of becoming ineffective each day.</p><p>Characters
        who wish to create more effective traps should invest skill ranks in
        Craft (traps) or take the Learn Ranger Trap feat.</p><h1>Skill
        Unlock</h1><p><strong>Source</strong>
        @Source[PZO1131;pages=87]</p><p>With sufficient ranks in Survival, you
        earn the following.</p><p><strong>5 Ranks:</strong> You reduce all
        nonlethal damage you take from heat, cold, starvation, or thirst by 1
        point for every 5 ranks you possess in Survival.</p><p><strong>10
        Ranks:</strong> You can track creatures that leave no tracks, including
        flying and swimming creatures and creatures using trackless step or pass
        without trace, taking a –20 penalty on your Survival
        check.</p><p><strong>15 Ranks:</strong> Once per day, you can spend 1
        hour and attempt a DC 30 Survival check. Success grants you cold
        resistance or fire resistance 5 for 24 hours. You can share this with
        one ally for every 5 by which you exceeded the check.</p><p><strong>20
        Ranks:</strong> You take only a –10 penalty when tracking creatures that
        leave no tracks.</p>
      format: 1
    title:
      level: 1
      show: true
    type: text
  - _id: xhmDhOXuBbfVcD0Q
    _key: '!journal.pages!x175kVqUfLGPt8tC.xhmDhOXuBbfVcD0Q'
    _stats:
      coreVersion: '12.331'
    name: Swim
    sort: 2500000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1110;pages=108]</p><p><em>You know
        how to swim and can do so even in stormy
        water.</em></p><p><strong>Check:</strong> Make a Swim check once per
        round while you are in the water. Success means you may swim at up to
        half your speed (as a full-round action) or at a quarter of your speed
        (as a move action). If you fail by 4 or less, you make no progress. If
        you fail by 5 or more, you go underwater.</p><p>If you are underwater,
        either because you failed a Swim check or because you are swimming
        underwater intentionally, you must hold your breath. You can hold your
        breath for a number of rounds equal to twice your Constitution score,
        but only if you do nothing other than take move actions or free actions.
        If you take a standard action or a full-round action (such as making an
        attack), the remainder of the duration for which you can hold your
        breath is reduced by 1 round. (Effectively, a character in combat can
        hold his breath only half as long as normal.) After that period of time,
        you must make a DC 10 Constitution check every round to continue holding
        your breath. Each round, the DC for that check increases by 1. If you
        fail the Constitution check, you begin to drown. The DC for the Swim
        check depends on the water, as given on the table
        below.</p><table><thead><tr><td>Water</td><td>Swim
        DC</td></tr></thead><tbody><tr><td>Calm
        water</td><td>10</td></tr><tr><td>Rough
        water</td><td>15</td></tr><tr><td>Stormy
        water</td><td>20*</td></tr></tbody></table><p><sup>* You can’t take 10
        on a Swim check in stormy water, even if you aren’t otherwise being
        threatened or distracted.</sup></p><p>Each hour that you swim, you must
        make a DC 20 Swim check or take 1d6 points of nonlethal damage from
        fatigue.</p><p><strong>Action:</strong> A successful Swim check allows
        you to swim a quarter of your speed as a move action or half your speed
        as a full-round action.</p><p><strong>Special:</strong> A creature with
        a swim speed can move through water at its indicated speed without
        making Swim checks. It gains a +8 racial bonus on any Swim check to
        perform a special action or avoid a hazard. The creature can always
        choose to take 10 on a Swim check, even if distracted or endangered when
        swimming. Such a creature can use the run action while swimming,
        provided that it swims in a straight line.</p><p>If you have the
        @UUID[Compendium.pf1.feats.rMR6ahXEfYqASE7D]{Athletic} feat, you get a
        bonus on Swim checks (see Feats).</p><h1>Skill
        Unlock</h1><p><strong>Source</strong>
        @Source[PZO1131;pages=87]</p><p>With sufficient ranks in Swim, you earn
        the following.</p><p><strong>5 Ranks:</strong> You gain a swim speed of
        10 feet, but only in water with a Swim DC of 15 or
        lower.</p><p><strong>10 Ranks:</strong> You gain a swim speed (though
        you do not gain the +8 racial bonus on Swim checks) equal to your base
        speed in water with a Swim DC of 15 or lower, or 10 feet in all other
        water.</p><p><strong>15 Ranks:</strong> You ignore the penalties for
        using slashing or bludgeoning weapons underwater, as freedom of
        movement.</p><p><strong>20 Ranks:</strong> You gain a swim speed equal
        to your base speed in all water. If you have both hands free, you gain a
        +8 racial bonus on Swim checks.</p>
      format: 1
    title:
      level: 1
      show: true
    type: text
  - _id: A8j7nF6qHwuGEC2E
    _key: '!journal.pages!x175kVqUfLGPt8tC.A8j7nF6qHwuGEC2E'
    _stats:
      coreVersion: '12.331'
    name: Use Magic Device
    sort: 2600000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1110;pages=108]</p><p><em>You are
        skilled at activating magic items, even if you are not otherwise trained
        in their use.</em></p><p><strong>Check:</strong> You can use this skill
        to read a spell or to activate a magic item. Use Magic Device lets you
        use a magic item as if you had the spell ability or class features of
        another class, as if you were a different race, or as if you were of a
        different alignment.</p><p>You make a Use Magic Device check each time
        you activate a device such as a wand. If you are using the check to
        emulate an alignment or some other quality in an ongoing manner, you
        need to make the relevant Use Magic Device check once per
        hour.</p><p>You must consciously choose which requirement to emulate.
        That is, you must know what you are trying to emulate when you make a
        Use Magic Device check for that purpose. The DCs for various tasks
        involving Use Magic Device checks are summarized on the table
        below.</p><table><thead><tr><td>Task</td><td>Use Magic Device
        DC</td></tr></thead><tbody><tr><td>Activate
        blindly</td><td>25</td></tr><tr><td>Decipher a written spell</td><td>25
        + spell level</td></tr><tr><td>Use a scroll</td><td>20 + caster
        level</td></tr><tr><td>Use a wand</td><td>20</td></tr><tr><td>Emulate a
        class feature</td><td>20</td></tr><tr><td>Emulate an ability
        score</td><td>See text</td></tr><tr><td>Emulate a
        race</td><td>25</td></tr><tr><td>Emulate an
        alignment</td><td>30</td></tr></tbody></table><p><strong>Activate
        Blindly:</strong> Some magic items are activated by special words,
        thoughts, or actions. You can activate such an item as if you were using
        the activation word, thought, or action, even when you’re not and even
        if you don’t know it. You do have to perform some equivalent activity in
        order to make the check. That is, you must speak, wave the item around,
        or otherwise attempt to get it to activate. You get a +2 bonus on your
        Use Magic Device check if you’ve activated the item in question at least
        once before. If you fail by 9 or less, you can’t activate the device. If
        you fail by 10 or more, you suffer a mishap. A mishap means that magical
        energy gets released but doesn’t do what you wanted it to do. The
        default mishaps are that the item affects the wrong target or that
        uncontrolled magical energy is released, dealing 2d6 points of damage to
        you. This mishap is in addition to the chance for a mishap that you
        normally risk when you cast a spell from a scroll that you could not
        otherwise cast yourself.</p><p><strong>Decipher a Written
        Spell:</strong> This usage works just like deciphering a written spell
        with the Spellcraft skill, except that the DC is 5 points higher.
        Deciphering a written spell requires 1 minute of
        concentration.</p><p><strong>Emulate an Ability Score:</strong> To cast
        a spell from a scroll, you need a high score in the appropriate ability
        (Intelligence for @UUID[Compendium.pf1.classes.0c4lYDywj6bQ0i8r]{wizard}
        spells, Wisdom for divine spells, or Charisma for
        @UUID[Compendium.pf1.classes.AoWSbnuTSGIxmv61]{sorcerer} or
        @UUID[Compendium.pf1.classes.6GjOjO6r3R06fLwE]{bard} spells). Your
        effective ability score (appropriate to the class you’re emulating when
        you try to cast the spell from the scroll) is your Use Magic Device
        check result minus 15. If you already have a high enough score in the
        appropriate ability, you don’t need to make this
        check.</p><p><strong>Emulate an Alignment:</strong> Some magic items
        have positive or negative effects based on the user’s alignment. Use
        Magic Device lets you use these items as if you were of an alignment of
        your choice. You can emulate only one alignment at a
        time.</p><p><strong>Emulate a Class Feature:</strong> Sometimes you need
        to use a class feature to activate a magic item. In this case, your
        effective level in the emulated class equals your Use Magic Device check
        result minus 20. This skill does not let you actually use the class
        feature of another class. It just lets you activate items as if you had
        that class feature. If the class whose feature you are emulating has an
        alignment requirement, you must meet it, either honestly or by emulating
        an appropriate alignment with a separate Use Magic Device check (see
        above).</p><p><strong>Emulate a Race:</strong> Some magic items work
        only for members of certain races, or work better for members of those
        races. You can use such an item as if you were a member of a race of
        your choice. You can emulate only one race at a time.</p><p><strong>Use
        a Scroll:</strong> Normally, to cast a spell from a scroll, you must
        have the scroll’s spell on your class spell list. Use Magic Device
        allows you to use a scroll as if you had a particular spell on your
        class spell list. The DC is equal to 20 + the caster level of the spell
        you are trying to cast from the scroll. In addition, casting a spell
        from a scroll requires a minimum score (10 + spell level) in the
        appropriate ability. If you don’t have a sufficient score in that
        ability, you must emulate the ability score with a separate Use Magic
        Device check.</p><p>This use of the skill also applies to other spell
        completion magic items.</p><p><strong>Use a Wand, Staff, or Other Spell
        Trigger Item:</strong> Normally, to use a wand, you must have the wand’s
        spell on your class spell list. This use of the skill allows you to use
        a wand as if you had a particular spell on your class spell list.
        Failing the roll does not expend a
        charge.</p><p><strong>Action:</strong> None. The Use Magic Device check
        is made as part of the action (if any) required to activate the magic
        item.</p><p><strong>Try Again:</strong> Yes, but if you ever roll a
        natural 1 while attempting to activate an item and you fail, then you
        can’t try to activate that item again for 24
        hours.</p><p><strong>Special:</strong> You cannot take 10 with this
        skill. You can’t aid another on Use Magic Device checks. Only the user
        of the item may attempt such a check.</p><p>If you have the
        @UUID[Compendium.pf1.feats.CLSsMyNmdcNAOUKC]{Magical Aptitude} feat, you
        gain a bonus on Use Magic Device checks (see Feats).</p><h1>Intentional
        Mishap</h1><p><strong>Source</strong> @Source[PZO9469;pages=8]</p><p>You
        can intentionally cause a magic item to produce a
        mishap.</p><p><strong>Check:</strong> You can cause a magic item to have
        an intentional magic mishap, as if you had attempted to activate it
        blindly and failed by 10 or more. The DC to produce an intentional
        mishap is 30. If you succeed, you have some control over the mishap. The
        item deals 2d6 points of damage to any one creature or object that the
        item could have targeted if activated normally. You can attempt to aim
        it, but if you select an invalid target, you take the damage instead. If
        you fail the check by 9 or less, you create a normal mishap you do not
        control. If you fail by 10 or more, nothing
        happens.</p><p><strong>Action:</strong> Attempting to create a mishap is
        like activating an item blindly, and requires a standard action during
        which you try out magic words or other appropriate actions.</p><h1>Skill
        Unlock</h1><p><strong>Source</strong>
        @Source[PZO1131;pages=87]</p><p>With sufficient ranks in Use Magic
        Device, you earn the following.</p><p><strong>5 Ranks:</strong> You can
        use the aid another action to assist another creature’s Use Magic Device
        check by attempting a check against the item’s Use Magic Device
        DC.</p><p><strong>10 Ranks:</strong> If you roll a natural 1 when
        activating an item, you take a –10 penalty on Use Magic Device checks
        with that item for 24 hours instead of being unable to activate it. This
        penalty stacks with itself.</p><p><strong>15 Ranks:</strong> You can use
        this skill to emulate two races or two alignments
        simultaneously.</p><p><strong>20 Ranks:</strong> If you roll a natural 1
        when activating an item, you can reroll the check at a –10 penalty to
        activate the item. You must take the result of the second check, even if
        it is worse, and you can’t reroll it again.</p>
      format: 1
    title:
      level: 1
      show: true
    type: text
  - _id: vH2PLto0QPzkG4io
    _key: '!journal.pages!x175kVqUfLGPt8tC.vH2PLto0QPzkG4io'
    _stats:
      coreVersion: '12.331'
    name: Artistry
    sort: 250000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1131;pages=48]</p><p>You are
        skilled in the creative arts, following your aesthetic sensibilities to
        bring to life the wonders of your imagination. Like Craft, Perform, and
        Profession, Artistry is actually a number of separate skills. You could
        have several Artistry skills, each with its own ranks. The most common
        Artistry skills are choreography, criticism, literature (including
        poetry), musical composition, philosophy, and playwriting.</p><p>Like
        Craft, an Artistry skill is focused on creating something. However, what
        it creates is not necessarily a physical object; it could be a pattern
        or blueprint for an item, or a better method for crafting a type of
        item. Thus, an Artistry (musical composition) check could be used to
        create a new song, but the important act of creation is the song itself,
        not the paper on which it is written or even the performance. An artist
        is not necessarily a skilled performer, though she might be. An artist’s
        province is the creation of ideas and concepts, and the realization of
        those ideas in a way that can be enjoyed by others and contribute to the
        broader culture of the arts. Some art forms (such as painting or
        sculpture) skirt the line between Artistry and Craft. It’s up to the GM
        to rule whether certain Craft skills can be taken as Artistry skills
        instead.</p><p><strong>Check:</strong> You can create works of art and
        try to earn a living by impressing possible patrons with your talent and
        ideas.</p><table><thead><tr><td>Artistry
        DC</td><td>Workmanship</td></tr></thead><tbody><tr><td>10</td><td>Pedestrian
        work. No one buys your original work, but you get a few odd jobs using
        your skills—often just repairing or copying someone else’s work. You
        earn 1d10 cp per day.</td></tr><tr><td>15</td><td>Pleasing work. In a
        prosperous city, you find a few who wish to purchase your work, and earn
        1d10 sp per day.</td></tr><tr><td>20</td><td>Impressive work. In a
        prosperous city, you earn 3d10 sp per day, and may receive an artistic
        commission from a wealthy or public figure. As a result, you gain a
        local reputation.</td></tr><tr><td>25</td><td>Memorable work. In a
        prosperous city, you earn 1d6 gp per day, and you are likely to attract
        the attention of wealthy patrons and to develop a national
        reputation.</td></tr><tr><td>30</td><td>Masterful work. In a prosperous
        city, you earn 3d6 gp per day. In time, you may draw attention from
        distant patrons, or even from extraplanar
        beings.</td></tr></tbody></table><p>Since works of art are products of
        imagination, masterwork tools are of no use in their
        creation.</p><p><em>Creating a Commissioned Work:</em> If you are
        creating a specif ic commissioned work, determine the value of the work
        you wish to create by looking at the table below, then follow the listed
        steps. You must have a patron willing to pay this value to attempt to
        create a commissioned work. The amount earned from trying to make a
        living using Artistry is for works that are distributed among many
        people and publications, not bought by one
        patron.</p><table><thead><tr><td>Quality of
        Work</td><td>DC</td><td>Commission
        Fee</td></tr></thead><tbody><tr><td>Pedestrian work</td><td>10</td><td>1
        sp</td></tr><tr><td>Pleasing work</td><td>15</td><td>25 gp (250
        sp)</td></tr><tr><td>Impressive work</td><td>20</td><td>50 gp (500
        sp)</td></tr><tr><td>Memorable work</td><td>25)</td><td>100 gp (1,000
        sp)</td></tr><tr><td>Masterful work</td><td>30</td><td>200 gp (2,000
        sp)</td></tr></tbody></table><p>To determine how much time and money it
        takes to complete a work of art, follow these
        steps.</p><ul><li><strong>Step 1:</strong> Find the DC and price
        corresponding to the quality of the work you intend to
        create.</li><li><strong>Step 2:</strong> Spend 1/4 the price of the work
        you intend to create. This represents buying supplies such as parchment
        and ink, hiring the services of musicians, paying for research
        materials, and the like.</li><li><strong>Step 3:</strong> Attempt an
        Artistry check with the appropriate DC, representing 1 week’s worth of
        work. If you succeed, multiply your check result by the DC. If the
        resulting value equals the price of the item in sp, then you have
        completed the work of art and gain your commission fee. (If the
        resulting value equals double or triple the price of the work in silver
        pieces, then you’ve completed the task in half or one-third of the time.
        Other multiples of the DC reduce the completion time in the same
        manner.) If the resulting value doesn’t equal the price, then it
        represents the progress you’ve made this week in sp. If the check fails,
        you make no progress.</li></ul><p>If you didn’t complete the work of
        art, you can either continue working or call it done and cut your
        losses. If you continue working, you must spend 1/4 the price again for
        each week you work. Record the result of your check from the first week,
        and add your progress for each subsequent week to the total until you
        either complete the item or cut your losses. If you decide to cut your
        losses, you gain the commission of the highest-quality level that your
        total could have completed. For instance, if you were trying to create a
        memorable work (a commission price of 1,000 sp) and have made only 600
        sp worth of progress, you can cut your losses to gain a commission fee
        for an impressive work (500 sp, or 50 gp). You can’t earn the value for
        a higher quality than you were aiming for, so if you aimed to create a
        memorable work but ended up creating a masterful work, you couldn’t gain
        a commission price higher than 100 gp. When you cut your losses, you
        don’t gain back any money you spent on supplies and services. So if you
        spent 250 sp when trying to create a memorable work, selling an
        impressive work would net you only 250 sp total if you spent 1 week of
        work, and would cause you to break even if you spent 2 weeks. It’s
        possible to lose money working on a
        commission.</p><p><strong>Action:</strong> Varies. Trying to earn money
        by creating minor works of art typically involves a full week’s work. If
        you work less than 1 week, you earn the daily average amount appropriate
        for your level of workmanship. Creating a commissioned work typically
        takes a week or more.</p><p><strong>Try Again:</strong> Yes. Retries are
        allowed, but they don’t negate previous failures. If you’re trying to
        earn a living as an artist in a city where the public hasn’t been
        impressed with your work (because you failed a DC 15 Artistry check in
        the previous week), you have a hard time breaking into the marketplace
        with future artwork (increase the DC by 2 for each previous failure). If
        you leave the area for a month or more before trying again, this
        increase resets to 0.</p>
