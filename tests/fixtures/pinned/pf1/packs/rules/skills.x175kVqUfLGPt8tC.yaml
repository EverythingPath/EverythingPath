_id: x175kVqUfLGPt8tC
_key: '!journal!x175kVqUfLGPt8tC'
_stats:
  coreVersion: '12.343'
name: Skills
pages:
  - _id: gGfJO90ZuRT4sZ9X
    _key: '!journal.pages!x175kVqUfLGPt8tC.gGfJO90ZuRT4sZ9X'
    _stats:
      coreVersion: '12.331'
    name: Acrobatics
    sort: 100000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1110;pages=87]</p><p>You can keep
        your balance while traversing narrow or treacherous surfaces. You can
        also dive, flip, jump, and roll to avoid attacks and overcome
        obstacles.</p><p><strong>Check:</strong> You can use Acrobatics to move
        on narrow surfaces and uneven ground without falling. A successful check
        allows you to move at half speed across such surfaces—only one check is
        needed per round. Use the following table to determine the base DC,
        which is then modified by the Acrobatics skill modifiers noted below.
        While you are using Acrobatics in this way, you are considered
        flat-footed and lose your Dexterity bonus to your AC (if any). If you
        take damage while using Acrobatics, you must immediately make another
        Acrobatics check at the same DC to avoid falling or being knocked
        prone.</p><table><thead><tr><td>Surface Width</td><td>Base Acrobatics
        DC</td></tr></thead><tbody><tr><td>Greater than 3 feet
        wide</td><td>0*</td></tr><tr><td>1–3 feet
        wide</td><td>5*</td></tr><tr><td>7–11 inches
        wide</td><td>10</td></tr><tr><td>2–6 inches
        wide</td><td>15</td></tr><tr><td>Less than 2 inches
        wide</td><td>20</td></tr></tbody></table><p><sup>* No Acrobatics check
        is needed to move across these surfaces unless the modifiers to the
        surface (see below) increase the DC to 10 or higher.</sup></p><p>In
        addition, you can move through a threatened square without provoking an
        attack of opportunity from an enemy by using Acrobatics. When moving in
        this way, you move at half speed. You can move at full speed by
        increasing the DC of the check by 10. You cannot use Acrobatics to move
        past foes if your speed is reduced due to carrying a medium or heavy
        load or wearing medium or heavy armor. If an ability allows you to move
        at full speed under such conditions, you can use Acrobatics to move past
        foes. You can use Acrobatics in this way while prone, but doing so
        requires a full-round action to move 5 feet, and the DC is increased by
        5. If you attempt to move through an enemy’s space and fail the check,
        you lose the move action and provoke an attack of
        opportunity.</p><table><thead><tr><td>Situation</td><td>Base Acrobatics
        DC*</td></tr></thead><tbody><tr><td>Move through a threatened
        area</td><td>Opponent’s Combat Maneuver Defense</td></tr><tr><td>Move
        through an enemy’s space</td><td>5 + opponent’s Combat Maneuver
        Defense</td></tr></tbody></table><p><sup>* This DC is used to avoid an
        attack of opportunity due to movement. This DC increases by 2 for each
        additional opponent avoided in 1
        round.</sup></p><table><thead><tr><td>Long Jump</td><td>Acrobatics
        DC</td></tr></thead><tbody><tr><td>5 feet</td><td>5</td></tr><tr><td>10
        feet</td><td>10</td></tr><tr><td>15 feet</td><td>15</td></tr><tr><td>20
        feet</td><td>20</td></tr><tr><td>Greater than 20 feet</td><td>+5 per 5
        feet</td></tr></tbody></table><table><thead><tr><td>High
        Jump</td><td>Acrobatics DC</td></tr></thead><tbody><tr><td>1
        foot</td><td>4</td></tr><tr><td>2 feet</td><td>8</td></tr><tr><td>3
        feet</td><td>12</td></tr><tr><td>4
        feet</td><td>16</td></tr><tr><td>Greater than 4 feet</td><td>+4 per
        foot</td></tr></tbody></table><p>Finally, you can use the Acrobatics
        skill to make jumps or to soften a fall. The base DC to make a jump is
        equal to the distance to be crossed (if horizontal) or four times the
        height to be reached (if vertical). These DCs double if you do not have
        at least 10 feet of space to get a running start. The only Acrobatics
        modifiers that apply are those concerning the surface you are jumping
        from. If you fail this check by 4 or less, you can attempt a DC 20
        Reflex save to grab hold of the other side after having missed the jump.
        If you fail by 5 or more, you fail to make the jump and fall (or land
        prone, in the case of a vertical jump). Creatures with a base land speed
        above 30 feet receive a +4 racial bonus on Acrobatics checks made to
        jump for every 10 feet of their speed above 30 feet. Creatures with a
        base land speed below 30 feet receive a –4 racial bonus on Acrobatics
        checks made to jump for every 10 feet of their speed below 30 feet. No
        jump can allow you to exceed your maximum movement for the round. For a
        running jump, the result of your Acrobatics check indicates the distance
        traveled in the jump (and if the check fails, the distance at which you
        actually land and fall prone). Halve this result for a standing long
        jump to determine where you land.</p><p>When you deliberately fall any
        distance, even as a result of a missed jump, a DC 15 Acrobatics skill
        check allows you to ignore the first 10 feet fallen, although you still
        end up prone if you take damage from a fall. See the falling rules for
        further details.</p><p>Many conditions can affect your chances of
        success with Acrobatics checks. The following modifiers to target DCs
        apply to all Acrobatics skill checks. The modifiers stack with one
        another, but only the most severe modifier for any one condition
        applies.</p><table><thead><tr><td>Acrobatics Modifiers</td><td>DC
        Modifier</td></tr></thead><tbody><tr><td>Slightly obstructed (gravel,
        sand)</td><td>+2</td></tr><tr><td>Severely obstructed (cavern,
        rubble)</td><td>+5</td></tr><tr><td>Slightly slippery
        (wet)</td><td>+2</td></tr><tr><td>Severely slippery
        (icy)</td><td>+5</td></tr><tr><td>Slightly sloped
        (&lt;45°)</td><td>+2</td></tr><tr><td>Severely sloped
        (&gt;45°)</td><td>+5</td></tr><tr><td>Slightly unsteady (boat in rough
        water)</td><td>+2</td></tr><tr><td>Moderately unsteady (boat in a
        storm)</td><td>+5</td></tr><tr><td>Severely unsteady
        (earthquake)</td><td>+10</td></tr><tr><td>Move at full speed on narrow
        or uneven surfaces</td><td>+5*</td></tr></tbody></table><p><sup>* This
        does not apply to checks made to
        jump.</sup></p><p><strong>Action:</strong> None. An Acrobatics check is
        made as part of another action or as a reaction to a
        situation.</p><p><strong>Special:</strong> If you have 3 or more ranks
        in Acrobatics, you gain a +3 dodge bonus to AC when fighting defensively
        instead of the usual +2, and a +6 dodge bonus to AC when taking the
        total defense action instead of the usual +4.</p><p>If you have the
        @UUID[Compendium.pf1.feats.jCxcObXJfdDrx4WS]{Acrobatic} feat, you get a
        bonus on Acrobatics checks.</p><h1>Skill
        Unlock</h1><p><strong>Source</strong> @Source[PZO1131;pages=82]<br
        />With sufficient ranks in Acrobatics, you earn the
        following.</p><p><strong>5 Ranks:</strong> You can move at normal speed
        through a threatened square without provoking an attack of opportunity
        by increasing the DC of the check by 5 (instead of by 10). You aren’t
        denied your Dexterity bonus when attempting Acrobatics checks with DCs
        of 20 or lower.</p><p><strong>10 Ranks:</strong> You can attempt an
        Acrobatics check at a –10 penalty and use the result as your CMD against
        trip maneuvers. You can also attempt an Acrobatics check at a –10
        penalty in place of a Reflex save to avoid falling. You must choose to
        use this ability before the trip attempt or Reflex save is rolled. With
        a successful DC 20 Acrobatics check, you treat an unintentional fall as
        10 feet shorter plus 10 feet for every 10 by which you exceed the DC,
        and treat an intentional fall as 10 feet shorter for every 10 by which
        you exceed the DC.</p><p><strong>15 Ranks:</strong> You do not provoke
        attacks of opportunity when standing up from prone.</p><p><strong>20
        Ranks:</strong> You double the result of any Acrobatics check when
        jumping and never fall prone at the end of a fall as long as you remain
        conscious.</p>
      format: 1
    title:
      level: 1
      show: true
    type: text
  - _id: QGxoGsSIAOoe5dTW
    _key: '!journal.pages!x175kVqUfLGPt8tC.QGxoGsSIAOoe5dTW'
    _stats:
      coreVersion: '12.331'
    name: Appraise
    sort: 200000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1110;pages=90]</p><p><em>You can
        evaluate the monetary value of an
        object.</em></p><p><strong>Check:</strong> A DC 20 Appraise check
        determines the value of a common item. If you succeed by 5 or more, you
        also determine if the item has magic properties, although this success
        does not grant knowledge of the magic item’s abilities. If your fail the
        check by less than 5, you determine the price of that item to within 20%
        of its actual value. If you fail this check by 5 or more, the price is
        wildly inaccurate, subject to GM discretion. Particularly rare or exotic
        items might increase the DC of this check by 5 or more.</p><p>You can
        also use this check to determine the most valuable item visible in a
        treasure hoard. The DC of this check is generally 20 but can increase to
        as high as 30 for a particularly large
        hoard.</p><p><strong>Action:</strong> Appraising an item takes 1
        standard action. Determining the most valuable object in a treasure
        hoard takes 1 full-round action.</p><p><strong>Try Again:</strong>
        Additional attempts to Appraise an item reveal the same
        result.</p><p><strong>Special:</strong> A spellcaster with a raven
        familiar gains a +3 bonus on Appraise
        checks.</p><h1>Psychometry</h1><p><strong>Source</strong>
        @Source[PZO1132;pages=196]<br />You can read the psychic impressions
        left on objects or in places by previous owners and
        events.</p><p><strong>Check:</strong> Once per day, you can concentrate
        for 1 minute while in physical contact with an item or location, during
        which you receive flashes of insight regarding the subject’s nature and
        ownership. After 1 minute, you attempt a DC 15 Appraise check to
        decipher the visions. You gain one piece of information about the
        historical significance or the last previous owner—such as a glimpse of
        the last owner’s appearance or its emotional state when it last used the
        item—determined by the GM. You learn one more piece of information for
        every 10 by which your check result exceeds the DC, as long as you
        concentrate for 1 additional minute for each piece of information. If
        you fail the check by less than 5 or the item has no significant psychic
        imprint, you don’t learn any information. If you fail this check by 5 or
        more, the item appears to be psychically significant even if it’s not,
        and the information you gain is wildly inaccurate. If you attempt to use
        psychometry on an item affected by charge object or implant false
        reading, you automatically learn all information imprinted by the spell.
        You must also attempt a Will save. If the item is affected by an implant
        false reading spell, on a success, you realize the information was
        false, and can determine the true information as well. On a failure, or
        if the item is affected by a charge object spell, you believe the
        information is true.</p><p><strong>Action:</strong> Reading an object
        requires at least 1 minute of uninterrupted
        concentration.</p><p><strong>Try Again:</strong> Yes. Multiple readings
        on an object or place always give the same results unless its
        circumstances or ownership have changed, but additional checks might
        reach further back into an object’s history. You don’t reroll the saving
        throw to determine if a psychic imprint is false. You can still use
        psychometry only once per day.</p><h2>Occult Skill
        Unlocks</h2><p>Characters capable of casting psychic spells or who have
        the Psychic Sensitivity feat gain access to skill unlocks—a host of
        esoteric skill uses not available to other PCs. These are not entirely
        new skills, but rather new uses of existing skills for those trained in
        the occult arts. A character must be trained in the appropriate skill to
        use that skill’s unlock, even if the skill can normally be used
        untrained. It’s impossible to take 10 for an occult skill unlock. Occult
        skill unlocks require intense concentration and strenuous effort, so the
        amount a character can use each skill unlock is limited to once per day
        or per week. This limit is for all uses of the skill unlock; if a
        character uses hypnotism to implant a suggestion, he can’t also use it
        to recall memories on the same day.</p><h1>Skill
        Unlock</h1><p><strong>Source</strong> @Source[PZO1131;pages=82]<br
        />With sufficient ranks in Appraise, you earn the
        following.</p><p><strong>5 Ranks:</strong> A successful DC 20 Appraise
        check reveals whether an item is magical, and a second check (DC = 25 +
        the item’s caster level) unveils its properties. You can use Appraise to
        detect non-written forgeries and counterfeits.</p><p><strong>10
        Ranks:</strong> You can determine the most expensive object a creature
        is wearing or wielding (or in a 5-foot cube) as a standard action by
        succeeding at a DC 20 check. You never make a wildly inaccurate
        appraisal of an item’s value.</p><p><strong>15 Ranks:</strong>
        Determining the most expensive object as above is a move action. You can
        substitute an Appraise check at a –10 penalty for a Will save to
        disbelieve a figment or glamer.</p><p><strong>20 Ranks:</strong>
        Determining the most expensive object as above is a move action, and if
        the check succeeds, you gain a +2 circumstance bonus on combat maneuver
        checks to steal that object or disarm a creature of that object for 1
        minute.</p>
      format: 1
    title:
      level: 1
      show: true
    type: text
  - _id: kRK5XwVBvcMi35w2
    _key: '!journal.pages!x175kVqUfLGPt8tC.kRK5XwVBvcMi35w2'
    _stats:
      coreVersion: '12.331'
    name: Bluff
    sort: 300000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1110;pages=90]</p><p><em>You know
        how to tell a lie.</em></p><p><strong>Check:</strong> Bluff is an
        opposed skill check against your opponent’s
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.ka0VQGItdrWw3paO]{Sense
        Motive} skill. If you use Bluff to fool someone, with a successful check
        you convince your opponent that what you are saying is true. Bluff
        checks are modified depending upon the believability of the lie. The
        following modifiers are applied to the roll of the creature attempting
        to tell the lie. Note that some lies are so improbable that it is
        impossible to convince anyone that they are true (subject to GM
        discretion).</p><table><thead><tr><td>Circumstances</td><td>Bluff
        Modifier</td></tr></thead><tbody><tr><td>The target wants to believe
        you</td><td>+5</td></tr><tr><td>The lie is
        believable</td><td>+0</td></tr><tr><td>The lie is
        unlikely</td><td>–5</td></tr><tr><td>The lie is
        far-fetched</td><td>–10</td></tr><tr><td>The lie is
        impossible</td><td>–20</td></tr><tr><td>The target is drunk or
        impaired</td><td>+5</td></tr><tr><td>You possess convincing
        proof</td><td>up to
        +10</td></tr></tbody></table><p><strong>Feint:</strong> You can use
        Bluff to feint in combat, causing your opponent to be denied his
        Dexterity bonus to his AC against your next attack. The DC of this check
        is equal to 10 + your opponent’s base attack bonus + your opponent’s
        Wisdom modifier. If your opponent is trained in Sense Motive, the DC is
        instead equal to 10 + your opponent’s Sense Motive bonus, if higher. For
        more information on feinting in combat, see Combat.</p><p><strong>Secret
        Messages:</strong> You can use Bluff to pass hidden messages along to
        another character without others understanding your true meaning by
        using innuendo to cloak your actual message. The DC of this check is 15
        for simple messages and 20 for complex messages. If you are successful,
        the target automatically understands you, assuming you are communicating
        in a language that it understands. If your check fails by 5 or more, you
        deliver the wrong message. Other creatures that receive the message can
        decipher it by succeeding at an opposed Sense Motive check against your
        Bluff result.</p><p><strong>Action:</strong> Attempting to deceive
        someone takes at least 1 round, but can possibly take longer if the lie
        is elaborate (as determined by the GM on a case-by-case
        basis).</p><p>Feinting in combat is a standard action.</p><p>Using Bluff
        to deliver a secret message takes twice as long as the message would
        otherwise take to relay.</p><p><strong>Try Again:</strong> If you fail
        to deceive someone, further attempts to deceive them are at a –10
        penalty and may be impossible (GM discretion).</p><p>You can attempt to
        feint against someone again if you fail. Secret messages can be relayed
        again if the first attempt fails.</p><p><strong>Special:</strong> A
        spellcaster with a viper familiar gains a +3 bonus on Bluff
        checks.</p><p>If you have the
        @UUID[Compendium.pf1.feats.SUACufUXl12sUvnQ]{Deceitful} feat, you get a
        bonus on Bluff checks (see Feats).</p><h1>Inconspicuous
        Action</h1><p><strong>Source</strong> @Source[PZO9469;pages=8]</p><p>You
        can avoid drawing attention to yourself when performing conspicuous
        actions such as picking up an object in a museum where handling the
        exhibits is frowned upon but not a matter of grave concern, or closely
        studying someone across a room at a party.</p><p><strong>Check:</strong>
        Your Bluff check is opposed by observers’
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.ka0VQGItdrWw3paO]{Sense
        Motive} checks. You can’t attempt the check if your very presence is
        suspicious (which you could prevent by altering your appearance with the
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.xg25z3GIpS590NDW]{Disguise}
        skill).</p><p><strong>Action:</strong> You attempt the Bluff check as
        part of performing the action you wish to render inconspicuous.
        Normally, you must take twice as long as normal to perform the action in
        order to make it inconspicuous. A standard action becomes a full-round
        action completed just before the start of your next turn and a free,
        immediate, move, or swift action becomes a standard action.</p><h1>Skill
        Unlock</h1><p><strong>Source</strong> @Source[PZO1131;pages=82]<br
        />With sufficient ranks in Bluff, you earn the
        following.</p><p><strong>5 Ranks:</strong> The penalty to Bluff a
        creature after a failed check is halved unless you failed by 5 or
        more.</p><p><strong>10 Ranks:</strong> You take no penalty to Bluff a
        creature after a failed check unless you failed by 5 or
        more.</p><p><strong>15 Ranks:</strong> Creatures magically attempting to
        read your thoughts, detect your alignment, or reveal when you are lying
        must attempt a caster level check (DC = 11 + your ranks in Bluff ) or
        the effect reveals nothing.</p><p><strong>20 Ranks:</strong> As a
        full-round action, you can make a suggestion (as the spell, maximum
        duration 1 hour) to a creature within 30 feet (Will negates, DC = 15 +
        your Charisma modifier). A creature that saves against your suggestion
        is immune to further uses of this effect for 24 hours, and whenever the
        suggested creature is specifically confronted with proof of your
        manipulation, it receives another saving throw. This is an extraordinary
        mindaffecting compulsion.</p>
      format: 1
    title:
      level: 1
      show: true
    type: text
  - _id: ZAwjVOTwsBpZRgw4
    _key: '!journal.pages!x175kVqUfLGPt8tC.ZAwjVOTwsBpZRgw4'
    _stats:
      coreVersion: '12.331'
    name: Climb
    sort: 400000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1110;pages=90]</p><p><em>You are
        skilled at scaling vertical surfaces, from smooth city walls to rocky
        cliffs.</em></p><p><strong>Check:</strong> With a successful Climb
        check, you can advance up, down, or across a slope, wall, or other steep
        incline (or even across a ceiling, provided it has handholds) at
        one-quarter your normal speed. A slope is considered to be any incline
        at an angle measuring less than 60 degrees; a wall is any incline at an
        angle measuring 60 degrees or more.</p><p>A Climb check that fails by 4
        or less means that you make no progress, and one that fails by 5 or more
        means that you fall from whatever height you have already
        attained.</p><p>The DC of the check depends on the conditions of the
        climb. Compare the task with those on the following table to determine
        an appropriate DC.</p><table><thead><tr><td>Climb DC</td><td>Example
        Surface or Activity</td></tr></thead><tbody><tr><td>0</td><td>A slope
        too steep to walk up, or a knotted rope with a wall to brace
        against.</td></tr><tr><td>5</td><td>A rope with a wall to brace against,
        or a knotted rope, or a rope affected by the rope trick
        spell.</td></tr><tr><td>10</td><td>A surface with ledges to hold on to
        and stand on, such as a very rough wall or a ship’s
        rigging.</td></tr><tr><td>15</td><td>Any surface with adequate handholds
        and footholds (natural or artificial), such as a very rough natural rock
        surface or a tree, or an unknotted rope, or pulling yourself up when
        dangling by your hands.</td></tr><tr><td>20</td><td>An uneven surface
        with narrow handholds and footholds, such as a typical wall in a
        dungeon.</td></tr><tr><td>25</td><td>A rough surface, such as a natural
        rock wall or a brick wall.</td></tr><tr><td>30</td><td>An overhang or
        ceiling with handholds only.</td></tr><tr><td>—</td><td>A perfectly
        smooth, flat vertical (or inverted) surface cannot be
        climbed.</td></tr></tbody></table><table><thead><tr><td>Climb DC
        Modifier*</td><td>Example Surface or
        Activity</td></tr></thead><tbody><tr><td>–10</td><td>Climbing a chimney
        (artificial or natural) or other location where you can brace against
        two opposite walls.</td></tr><tr><td>–5</td><td>Climbing a corner where
        you can brace against perpendicular
        walls.</td></tr><tr><td>+5</td><td>Surface is
        slippery.</td></tr></tbody></table><p><sup>* These modifiers are
        cumulative; use all that apply.</sup><br />You need both hands free to
        climb, but you may cling to a wall with one hand while you cast a spell
        or take some other action that requires only one hand. While climbing,
        you can’t move to avoid a blow, so you lose your Dexterity bonus to AC
        (if any). You also can’t use a shield while climbing. Anytime you take
        damage while climbing, make a Climb check against the DC of the slope or
        wall. Failure means you fall from your current height and sustain the
        appropriate falling damage.</p><p><strong>Accelerated Climbing:</strong>
        You try to climb more quickly than normal. By accepting a –5 penalty,
        you can move half your speed (instead of one-quarter your
        speed).</p><p><strong>Make Your Own Handholds and Footholds:</strong>
        You can make your own handholds and footholds by pounding pitons into a
        wall. Doing so takes 1 minute per piton, and one piton is needed per 5
        feet of distance. As with any surface that offers handholds and
        footholds, a wall with pitons in it has a DC of 15. In the same way, a
        climber with a handaxe or similar implement can cut handholds in an ice
        wall.</p><p><strong>Catch Yourself When Falling:</strong> It’s
        practically impossible to catch yourself on a wall while falling, yet if
        you wish to attempt such a difficult task, you can make a Climb check
        (DC = wall’s DC + 20) to do so. It’s much easier to catch yourself on a
        slope (DC = slope’s DC + 10).</p><p><strong>Catch a Falling Character
        While Climbing:</strong> If someone climbing above you or adjacent to
        you falls, you can attempt to catch the falling character if he or she
        is within your reach. Doing so requires a successful melee touch attack
        against the falling character (though he or she can voluntarily forego
        any Dexterity bonus to AC if desired). If you hit, you must immediately
        attempt a Climb check (DC = wall’s DC + 10). Success indicates that you
        catch the falling character, but his total weight, including equipment,
        cannot exceed your heavy load limit or you automatically fall. If you
        fail your Climb check by 4 or less, you fail to stop the character’s
        fall but don’t lose your grip on the wall. If you fail by 5 or more, you
        fail to stop the character’s fall and begin falling as
        well.</p><p><strong>Action:</strong> Climbing is part of movement, so
        it’s generally part of a move action (and may be combined with other
        types of movement in a move action). Each move action that includes any
        climbing requires a separate Climb check. Catching yourself or another
        falling character doesn’t take an
        action.</p><p><strong>Special:</strong> You can use a rope to haul a
        character upward (or lower a character) through sheer strength. You can
        lift double your maximum load in this manner.</p><p>A creature with a
        climb speed has a +8 racial bonus on all Climb checks. The creature must
        make a Climb check to climb any wall or slope with a DC higher than 0,
        but it can always choose to take 10, even if rushed or threatened while
        climbing. If a creature with a climb speed chooses an accelerated climb
        (see above), it moves at double its climb speed (or at its land speed,
        whichever is slower) and makes a single Climb check at a –5 penalty.
        Such a creature retains its Dexterity bonus to Armor Class (if any)
        while climbing, and opponents get no special bonus to their attacks
        against it. It cannot, however, use the run action while
        climbing.</p><p>If you have the
        @UUID[Compendium.pf1.feats.rMR6ahXEfYqASE7D]{Athletic} feat, you get a
        bonus on Climb checks (see Feats).</p><h1>Skill
        Unlock</h1><p><strong>Source</strong>
        @Source[PZO1131;pages=82]</p><p>With sufficient ranks in Climb, you earn
        the following.</p><p><strong>5 Ranks:</strong> You are no longer denied
        your Dexterity bonus when climbing.</p><p><strong>10 Ranks:</strong> You
        gain a natural climb speed (but not the +8 racial bonus on Climb checks)
        of 10 feet, but only on surfaces with a Climb DC of 20 or
        lower.</p><p><strong>15 Ranks:</strong> You gain a natural climb speed
        (but not the +8 racial bonus on Climb checks) equal to your base speed
        on surfaces with a Climb DC of 20 or lower, and of 10 feet on all other
        surfaces.</p><p><strong>20 Ranks:</strong> You gain a natural climb
        speed equal to your base speed on all surfaces. If you have both hands
        free, you gain a +8 racial bonus on Climb checks.</p>
      format: 1
    title:
      level: 1
      show: true
