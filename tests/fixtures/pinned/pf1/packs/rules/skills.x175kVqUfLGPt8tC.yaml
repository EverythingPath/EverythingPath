    name: Lore
    sort: 1550000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1131;pages=50]</p><p>You possess a
        specialized area of knowledge, generally narrower than that of a
        full-fledged scholar. Lore acts as a catchall skill for information,
        similar to how Craft handles artisanal skills and Profession handles
        professional skills. The category of a Lore skill can vary widely from
        that of another Lore skill. It could be regional (such as a city or
        country), about a discipline (such as cryptography), or related to a
        narrow set of people (such as famous musicians). The scope of
        region-based Lore skills can also refer to specific subcategories, such
        as taverns in a particular region.</p><p>A Lore skill must be narrow—far
        narrower than the most relevant Knowledge skill. The broader the scope
        of a given category of Lore, the shallower your knowledge is on that
        topic. If you know about taverns in a wide region, you know less about
        each of them than you would if you had Lore in taverns of a specific
        city. Lore skills normally can’t be used to identify monsters the way
        Knowledge skills can, unless they refer to a specific type of monster
        (such as owlbears or vampires). If Lore involves a common, broad
        category of race or monster, it needs to be more specific. Lore (elves)
        would be too broad, as would Lore
        (dragons).</p><p><strong>Check:</strong> Lore skills use the same DC
        scale as Knowledge skills: DC 10 to answer easy questions, DC 15 for
        basic questions, and DC 20 to 30 for really tough questions. In many
        cases, Lore can substitute for a Knowledge skill, such as Lore (elven
        history) filling in for Knowledge (history) in a check involving elves.
        At the GM’s discretion, a player might be able to apply a Lore skill
        that’s only partially related to a subject with a –5 penalty, such as
        using a Lore skill about a region to recall information about a
        particular city in that region or applying knowledge of distilling to
        winemaking.</p><p>The table below describes some examples of Lore skills
        alongside examples of skills that would be too broad. This is by no
        means a comprehensive list, and the GM has final say on whether a
        particular Lore skill is
        appropriate.</p><table><thead><tr><td>Appropriate Lore
        Skills</td><td>Inappropriate Choices</td></tr></thead><tbody><tr><td>A
        particular small city (or smaller
        settlement)</td><td>Settlements</td></tr><tr><td>One district of a large
        city or metropolis</td><td>An entire large city or
        metropolis</td></tr><tr><td>a particular
        monastery</td><td>Monasteries</td></tr><tr><td>Taverns in a
        region</td><td>Taverns</td></tr><tr><td>Bandits in a
        region</td><td>Banditry</td></tr><tr><td>Famous battles in a
        region</td><td>Famous battles</td></tr><tr><td>The spice
        trade</td><td>Commerce</td></tr><tr><td>Cats</td><td>Animals</td></tr><tr><td>Drow
        matriarchs</td><td>Drow</td></tr><tr><td>Dwarven
        history</td><td>Dwarves</td></tr><tr><td>Frost
        giants</td><td>Giants</td></tr><tr><td>Sarenrae</td><td>Gods</td></tr><tr><td>Dagon</td><td>Demon
        lords</td></tr><tr><td>Phlegethon</td><td>Hell</td></tr><tr><td>Military
        commanders</td><td>Warfare</td></tr><tr><td>Famous
        singers</td><td>Music</td></tr><tr><td>Infernal
        contracts</td><td>Devils</td></tr><tr><td>Evocations</td><td>Spells</td></tr><tr><td>Silver
        and
        mithral</td><td>Metals</td></tr><tr><td>Tea</td><td>Beverages</td></tr><tr><td>Trees</td><td>Plants</td></tr><tr><td>Tattoos</td><td>Art</td></tr></tbody></table><p><strong>Bards:</strong>
        Lore is treated as a Knowledge skill for the purposes of bardic
        knowledge and lore master, as well as similar abilities found in other
        classes, creatures, and archetypes. This applies only to Lore skills in
        which a character is trained. In other circumstances, use the more
        relevant Knowledge skill.</p>
