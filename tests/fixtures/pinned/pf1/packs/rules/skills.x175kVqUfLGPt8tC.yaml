  - _id: 3E8pxbjI8MD3JbfQ
    _key: '!journal.pages!x175kVqUfLGPt8tC.3E8pxbjI8MD3JbfQ'
    _stats:
      coreVersion: '12.331'
    name: Craft
    sort: 500000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1110;pages=91]</p><p>You are
        skilled in the creation of a specific group of items, such as armor or
        weapons. Like
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.BWeqgXSZvUQl68vt]{Knowledge},
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.emzBKDFNkNnC7N8u]{Perform},
        and
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.224EaK0K72NhCeRi]{Profession},
        Craft is actually a number of separate skills. You could have several
        Craft skills, each with its own ranks. The most common Craft skills
        are:</p><ul><li>alchemy</li><li>armor</li><li>baskets</li><li>books</li><li>bows</li><li>calligraphy</li><li>carpentry</li><li>cloth</li><li>clothing</li><li>glass</li><li>jewelry</li><li>leather</li><li>locks</li><li>paintings</li><li>pottery</li><li>sculptures</li><li>ships</li><li>shoes</li><li>stonemasonry</li><li>traps</li><li>weapons.</li></ul><p>A
        Craft skill is specifically focused on creating something. If nothing is
        created by the endeavor, it probably falls under the heading of a
        Profession skill.</p><p><strong>Check:</strong> You can practice your
        trade and make a decent living, earning half your check result in gold
        pieces per week of dedicated work. You know how to use the tools of your
        trade, how to perform the craft’s daily tasks, how to supervise
        untrained helpers, and how to handle common problems. (Untrained
        laborers and assistants earn an average of 1 silver piece per
        day.)</p><p>The basic function of the Craft skill, however, is to allow
        you to make an item of the appropriate type. The DC depends on the
        complexity of the item to be created. The DC, your check result, and the
        price of the item determine how long it takes to make a particular item.
        The item’s finished price also determines the cost of raw
        materials.</p><p>In some cases, the fabricate spell can be used to
        achieve the results of a Craft check with no actual check involved. You
        must still make an appropriate Craft check when using the spell to make
        articles requiring a high degree of craftsmanship.</p><p>A successful
        Craft check related to woodworking in conjunction with the casting of
        the ironwood spell enables you to make wooden items that have the
        strength of steel.</p><p>When casting the spell
        @UUID[Compendium.pf1.spells.jsvjsax2eabrlx8g]{Minor Creation}, you must
        succeed on an appropriate Craft check to make a complex item.</p><p>All
        crafts require artisan’s tools to give the best chance of success. If
        improvised tools are used, the check is made with a –2 penalty. On the
        other hand, masterwork artisan’s tools provide a +2 circumstance bonus
        on the check.</p><p>To determine how much time and money it takes to
        make an item, follow these steps.</p><ol><li>Find the item’s price in
        silver pieces (1 gp = 10 sp).</li><li>Find the item’s DC from Table:
        Craft Skills.</li><li>Pay 1/3 of the item’s price for the raw material
        cost.</li><li>Make an appropriate Craft check representing one week’s
        worth of work. If the check succeeds, multiply your check result by the
        DC. If the result × the DC equals the price of the item in sp, then you
        have completed the item. (If the result × the DC equals double or triple
        the price of the item in silver pieces, then you’ve completed the task
        in one-half or one-third of the time. Other multiples of the DC reduce
        the time in the same manner.) If the result × the DC doesn’t equal the
        price, then it represents the progress you’ve made this week. Record the
        result and make a new Craft check for the next week. Each week, you make
        more progress until your total reaches the price of the item in silver
        pieces.</li></ol><p>If you fail a check by 4 or less, you make no
        progress this week. If you fail by 5 or more, you ruin half the raw
        materials and have to pay half the original raw material cost
        again.</p><p><strong>Progress by the Day:</strong> You can make checks
        by the day instead of by the week. In this case your progress (check
        result × DC) should be divided by the number of days in a
        week.</p><p><strong>Create Masterwork Items</strong>: You can make a
        masterwork item: a weapon, suit of armor, shield, or tool that conveys a
        bonus on its use through its exceptional craftsmanship. To create a
        masterwork item, you create the masterwork component as if it were a
        separate item in addition to the standard item. The masterwork component
        has its own price (300 gp for a weapon or 150 gp for a suit of armor or
        a shield, see Equipment for the price of other masterwork tools) and a
        Craft DC of 20. Once both the standard component and the masterwork
        component are completed, the masterwork item is finished. The cost you
        pay for the masterwork component is one-third of the given amount, just
        as it is for the cost in raw materials.</p><p><strong>Repair
        Items:</strong> You can repair an item by making checks against the same
        DC that it took to make the item in the first place. The cost of
        repairing an item is one-fifth of the item’s
        price.</p><table><thead><tr><td>Item Craft</td><td>Skill</td><td>Craft
        DC</td></tr></thead><tbody><tr><td>Acid</td><td>Alchemy</td><td>15</td></tr><tr><td>Alchemist’s
        fire, smokestick, or
        tindertwig</td><td>Alchemy</td><td>20</td></tr><tr><td>Antitoxin,
        sunrod, tanglefoot bag, or
        thunderstone</td><td>Alchemy</td><td>25</td></tr><tr><td>Armor or
        shield</td><td>Armor</td><td>10 + AC bonus</td></tr><tr><td>Longbow,
        shortbow, or arrows</td><td>Bows</td><td>12</td></tr><tr><td>Composite
        longbow or composite
        shortbow</td><td>Bows</td><td>15</td></tr><tr><td>Composite longbow or
        composite shortbow with high strength rating</td><td>Bows</td><td>15 +
        (2 × rating)</td></tr><tr><td>Mechanical
        trap</td><td>Traps</td><td>Varies*</td></tr><tr><td>Crossbow, or
        bolts</td><td>Weapons</td><td>15</td></tr><tr><td>Simple melee or thrown
        weapon</td><td>Weapons</td><td>12</td></tr><tr><td>Martial melee or
        thrown weapon</td><td>Weapons</td><td>15</td></tr><tr><td>Exotic melee
        or thrown weapon</td><td>Weapons</td><td>18</td></tr><tr><td>Very simple
        item (wooden spoon)</td><td>Varies</td><td>5</td></tr><tr><td>Typical
        item (iron pot)</td><td>Varies</td><td>10</td></tr><tr><td>High-quality
        item (bell)</td><td>Varies</td><td>15</td></tr><tr><td>Complex or
        superior item
        (lock)</td><td>Varies</td><td>20</td></tr></tbody></table><p><sup>*
        Traps have their own rules for construction (see Traps).</sup><br
        /><strong>Action:</strong> Does not apply. Craft checks are made by the
        day or week (see above).</p><p><strong>Try Again:</strong> Yes, but each
        time you fail by 5 or more, you ruin half the raw materials and have to
        pay half the original raw material cost
        again.</p><p><strong>Special:</strong> You may voluntarily add +10 to
        the indicated DC to craft an item. This allows you to create the item
        more quickly (since you’ll be multiplying this higher DC by your Craft
        check result to determine progress). You must decide whether to increase
        the DC before you make each weekly or daily check.</p><p>To make an item
        using Craft (alchemy), you must have alchemical equipment. If you are
        working in a city, you can buy what you need as part of the raw
        materials cost to make the item, but alchemical equipment is difficult
        or impossible to come by in some places. Purchasing and maintaining an
        alchemist’s lab grants a +2 circumstance bonus on Craft (alchemy) checks
        because you have the perfect tools for the job, but it does not affect
        the cost of any items made using the skill.</p><p>A
        @UUID[Compendium.pf1.races.efwHEwjvL9Z94MJI]{Gnome} receives a +2 bonus
        on a Craft or Profession skill of her choice.</p><h1>Additional Craft
        DCs</h1><p><strong>Source</strong>
        @Source[PZO1118;pages=101]</p><table><thead><tr><td>Item</td><td>Craft
        Skill</td><td>Craft DC</td></tr></thead><tbody><tr><td>A weapon with the
        fragile special quality</td><td>Weapon or Bow</td><td>Normal DC
        –5</td></tr><tr><td>One-handed
        firearm</td><td>Firearm</td><td>20</td></tr><tr><td>Two-handed
        firearm</td><td>Firearm</td><td>20</td></tr><tr><td>Siege firearm,
        heavy</td><td>Firearm</td><td>25</td></tr><tr><td>Siege firearm,
        medium</td><td>Firearm</td><td>30</td></tr><tr><td>Siege firearm,
        light</td><td>Firearm</td><td>35</td></tr><tr><td>Ranged siege engine,
        heavy</td><td>Siege Engine</td><td>20</td></tr><tr><td>Ranged siege
        engine, medium</td><td>Siege
        Engine</td><td>25</td></tr></tbody></table><h1>Crafting
        Antivenom</h1><p><strong>Source</strong>
        @Source[PZO1140;pages=143]</p><p>While antitoxin, as presented in the
        Pathfinder RPG Core Rulebook, presents a generalized tool for protecting
        oneself from poison, more specialized antivenoms can provide even
        greater protection against specific poisons. Creating a dose of
        antivenom requires a dose of the specific poison that the antivenom is
        designed to protect against.</p><p><strong>Antivenom Effects:</strong> A
        single dose of antivenom automatically neutralizes the first exposure of
        the specific poison it is made to combat and provides a +8 alchemical
        bonus on saving throws against additional exposure to that specific
        poison; this bonus decreases by 1 every hour, until the effect ends
        after 8 hours.</p><p><strong>Crafting Antivenom:</strong> To create a
        dose of antivenom, a living creature must first be exposed to a half
        dose of the poison in question. The creature suffers the poison’s
        effects normally, except the saving throw DC to resist the poison is
        reduced by 2. In order to be able to produce antivenom, the creature
        must succeed at the necessary saving throws to be cured of the poison.
        If the poison’s duration expires without the creature being cured, no
        antivenom can be harvested.</p><p>Once the creature has resisted the
        poison’s effects, a viable sample of the creature’s blood can be
        extracted with a successful DC 20 Craft (alchemy) or Heal check. This
        blood must then be refined to extract the natural antibodies that combat
        the poison in a process that takes 1 hour and requires a successful
        Craft (alchemy) check (DC = 5 + the poison’s saving throw DC). Success
        yields 1 dose of antivenom.</p><p>Antivenom can also be harvested in the
        same fashion from a creature that has been afflicted by a full dose of
        poison, rather than a creature deliberately given a half dose for this
        purpose. Regardless of how much poison the creature is exposed to, the
        antibodies in its system can be harvested only for 24 hours after it has
        recovered from the poison.</p><p><strong>Purchasing Antivenom:</strong>
        Antivenom is not particularly expensive, but because it is highly
        specialized, it can be difficult to find. A dose of antivenom has a
        market price equal to half the market price of a dose of the poison in
        question, but it is treated as though its price were five times the
        market price of the poison for the purposes of determining its
        availability in any given settlement. Alternatively, if 1 or more doses
        of the poison in question can be provided, most alchemists will supply
        as much antivenom as they can produce from the doses for a fee of 10% of
        the market price of the poison.</p><h1>Preserving Harvested
        Poison</h1><p><strong>Source</strong> @Source[PZO1140;pages=143]<br
        />Poison harvested from a creature or hazard remains potent for 24
        hours. If a character wishes to preserve harvested poison for a longer
        period, she must treat it alchemically, as if crafting the poison with
        Craft (alchemy) but using the poison dose as the raw ingredients
        normally needed to brew a dose of the poison and thus avoiding the gp
        cost to craft the
        poison.</p><h1>Salvaging</h1><p><strong>Source</strong>
        @Source[PZO1140;pages=134]</p><p>Foraging is one way to gather resources
        in the wild, but you can also recycle or repurpose items and gear as
        well, salvaging materials from items you no longer need or are willing
        to sacrifice. You can’t salvage materials from artifacts, cursed items,
        or items you can’t destroy. Successfully salvaging an item requires a
        Craft or
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.VRD7jxiIAxKPt6EF]{Spellcraft}
        check and takes an amount of time as indicated in the specific type of
        salvage operation below.</p><p><strong>Ammunition:</strong> You can use
        destroyed ammunition as raw materials for new ammunition. Five pieces of
        destroyed ammunition provide suitable material to create one new piece
        of ammunition using the normal crafting
        rules.</p><p><strong>Potions:</strong> If you have the
        @UUID[Compendium.pf1.feats.nNVFVFRBCT4O2ab9]{Brew Potion} feat, you can
        combine natural catalysts with a potion to salvage it and create a
        different potion of a lower spell level. Salvaging a potion requires raw
        magic item materials (these can be salvaged from existing items, as
        detailed below). To salvage a potion, you must spend 1 hour per spell
        level of the original potion and then attempt a Craft (alchemy) or
        Spellcraft check with a DC equal to 15 + 3 × the original potion’s spell
        level. If you succeed, you transmute the original potion into a new
        potion of a spell at least one spell level lower, provided you know the
        spell in question (it need not be one you can currently cast). If you
        fail this check by 4 or less, the attempt fails and the catalyst is
        wasted, but the potion is unharmed. If you fail by 5 or more, the raw
        materials are lost and the original potion is ruined.</p><p><strong>Raw
        Crafting Materials:</strong> Anyone trained in the Craft skill can
        salvage raw materials from equipment for use in crafting or repair. You
        must carefully dismantle the item to be salvaged, resulting in the
        item’s destruction. If the item’s price is 1 gp or less, its materials
        can be salvaged with only 1 hour of work; otherwise it takes 8 hours to
        salvage crafting materials. A successful Craft check against the item’s
        creation DC + 5 yields raw materials worth one-quarter the item’s price.
        If you fail the Craft check by 4 or less, the item is destroyed but the
        materials can still be salvaged in a future attempt. If you fail the
        Craft check by 5 or more, the item is destroyed and the materials are
        ruined. Salvaged raw materials can be used to create or repair any item
        of the same materials and reduces the construction time by the
        proportion of the new item’s raw materials that are salvaged (minimum 8
        hours).</p><p><strong>Raw Magic Item Materials:</strong> Anyone with an
        item creation feat can salvage the raw materials from magic items for
        the creation of new ones or repair of existing ones. You must have the
        item creation feat required for that item to salvage its raw materials.
        Each attempt requires destroying a magic item and 8 hours of work. If
        the item’s price is 500 gp or less, you can salvage its materials in
        only 2 hours. A successful Craft or Spellcraft check with a DC equal to
        10 + the item’s caster level yields raw materials worth two-thirds the
        creation cost of the destroyed item (one-third the market price). If you
        fail the skill check by 4 or less, the item is destroyed but the
        materials can still be salvaged in a future attempt. If you fail the
        skill check by 5 or more, the item is destroyed and the materials are
        ruined. Salvaged raw materials can be used to create or repair any item
        made of similar materials or that shares any of the creation
        requirements as the original. Including the majority of the materials
        allows you to automatically meet any construction requirements of a new
        item that the salvaged item also required and reduces the construction
        or repair time by the proportion of the new item’s construction
        materials that are salvaged (with the usual minimum creation time).
        Spellbooks and formula books can be salvaged for magic inks and paper
        usable in formula books, scrolls, and spellbooks.</p><p><strong>Costly
        Spell Components:</strong> Anyone trained in
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.VRD7jxiIAxKPt6EF]{Spellcraft}
        can salvage costly material or focus spell components from magic items.
        Each attempt requires destroying the item and 8 hours of work. An item
        can be broken down into a powder that can be used in place of gemstone
        dust as a material component. Otherwise, the item must have a spell
        requiring the component in its construction requirements to salvage that
        component. A successful
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.VRD7jxiIAxKPt6EF]{Spellcraft}
        check with a DC equal to 10 + the item’s caster level yields materials
        usable in place of that spell component worth two-thirds the item’s
        creation cost (one-third its market price). If you fail the check by 4
        or less, the item is destroyed without yielding spell components, but
        you can try to salvage them again. If you fail the check by 5 or more,
        the item is destroyed and the spell components are
        ruined.</p><h1>Technology</h1><p><strong>Source</strong>
        @Source[PZO9272;pages=5]</p><p>Those who wish to construct or repair
        technological items use the Craft (mechanical) skill in conjunction with
        the technological item crafting feats. Without the Technologist feat,
        Craft (mechanical) can still be used to craft less advanced forms of
        technology such as gears, hinges, and pulleys. Note that in the campaign
        setting, NPCs with the means of crafting technological items are
        extremely rare, and it is not assumed that PCs have access to such
        resources. GMs are encouraged to discuss such considerations with their
        players before allowing technological crafting into the
        game.</p><h1>Skill Unlock</h1><p><strong>Source</strong>
        @Source[PZO1131;pages=83]<br />With sufficient ranks in Craft, you earn
        the following.</p><p><strong>5 Ranks:</strong> When determining your
        weekly progress, double the result of your Craft check before
        multiplying the result by the item’s DC.</p><p><strong>10
        Ranks:</strong> You do not ruin any of your raw materials unless you
        fail a check by 10 or more.</p><p><strong>15 Ranks:</strong> When you
        determine your progress, the result of your check is how much work you
        complete each day in silver pieces.</p><p><strong>20 Ranks:</strong> You
        can craft magic armor, magic weapons, magic rings, and wondrous items
        that fall under your category of Craft using the normal Craft rules.</p>
      format: 1
    title:
      level: 1
      show: true
    type: text
  - _id: uB9Fy36RUjibxqvt
    _key: '!journal.pages!x175kVqUfLGPt8tC.uB9Fy36RUjibxqvt'
    _stats:
      coreVersion: '12.331'
    name: Diplomacy
    sort: 600000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1110;pages=93]</p><p>You can use
        this skill to persuade others to agree with your arguments, to resolve
        differences, and to gather valuable information or rumors from people.
        This skill is also used to negotiate conflicts by using the proper
        etiquette and manners suitable to the
        problem.</p><p><strong>Check:</strong> You can change the initial
        attitudes of nonplayer characters with a successful check. The DC of
        this check depends on the creature’s starting attitude toward you,
        adjusted by its Charisma modifier. If you succeed, the character’s
        attitude toward you is improved by one step. For every 5 by which your
        check result exceeds the DC, the character’s attitude toward you
        increases by one additional step. A creature’s attitude cannot be
        shifted more than two steps up in this way, although the GM can override
        this rule in some situations. If you fail the check by 4 or less, the
        character’s attitude toward you is unchanged. If you fail by 5 or more,
        the character’s attitude toward you is decreased by one step.</p><p>You
        cannot use Diplomacy against a creature that does not understand you or
        has an Intelligence of 3 or less. Diplomacy is generally ineffective in
        combat and against creatures that intend to harm you or your allies in
        the immediate future. Any attitude shift caused through Diplomacy
        generally lasts for 1d4 hours but can last much longer or shorter
        depending upon the situation (GM
        discretion).</p><table><thead><tr><td>Starting
        Attitude</td><td>Diplomacy
        DC</td></tr></thead><tbody><tr><td>Hostile</td><td>25 + creature’s Cha
        modifier</td></tr><tr><td>Unfriendly</td><td>20 + creature’s Cha
        modifier</td></tr><tr><td>Indifferent</td><td>15 + creature’s Cha
        modifier</td></tr><tr><td>Friendly</td><td>10 + creature’s Cha
        modifier</td></tr><tr><td>Helpful</td><td>0 + creature’s Cha
        modifier</td></tr></tbody></table><p>If a creature’s attitude toward you
        is at least indifferent, you can make requests of the creature. This is
        an additional Diplomacy check, using the creature’s current attitude to
        determine the base DC, with one of the following modifiers. Once a
        creature’s attitude has shifted to helpful, the creature gives in to
        most requests without a check, unless the request is against its nature
        or puts it in serious peril. Some requests automatically fail if the
        request goes against the creature’s values or its nature, subject to GM
        discretion.</p><table><thead><tr><td>Request</td><td>Diplomacy DC
        Modifier</td></tr></thead><tbody><tr><td>Give simple advice or
        directions</td><td>–5</td></tr><tr><td>Give detailed
        advice</td><td>+0</td></tr><tr><td>Give simple
        aid</td><td>+0</td></tr><tr><td>Reveal an unimportant
        secret</td><td>+5</td></tr><tr><td>Give lengthy or complicated
        aid</td><td>+5</td></tr><tr><td>Give dangerous
        aid</td><td>+10</td></tr><tr><td>Reveal an important secret</td><td>+10
        or more</td></tr><tr><td>Give aid that could result in
        punishment</td><td>+15 or more</td></tr><tr><td>Additional
        requests</td><td>+5 per
        request</td></tr></tbody></table><p><strong>Gather Information:</strong>
        You can also use Diplomacy to gather information about a specific topic
        or individual. To do this, you must spend at least 1d4 hours canvassing
        people at local taverns, markets, and gathering places. The DC of this
        check depends on the obscurity of the information sought, but for most
        commonly known facts or rumors it is 10. For obscure or secret
        knowledge, the DC might increase to 20 or higher. The GM might rule that
        some topics are simply unknown to common
        folk.</p><p><strong>Action:</strong> Using Diplomacy to influence a
        creature’s attitude takes 1 minute of continuous interaction. Making a
        request of a creature takes 1 or more rounds of interaction, depending
        upon the complexity of the request. Using Diplomacy to gather
        information takes 1d4 hours of work searching for rumors and
        informants.</p><p><strong>Try Again:</strong> You cannot use Diplomacy
        to influence a given creature’s attitude more than once in a 24-hour
        period. If a request is refused, the result does not change with
        additional checks, although other requests might be made. You can retry
        Diplomacy checks made to gather
        information.</p><p><strong>Special:</strong> If you have the
        @UUID[Compendium.pf1.feats.L10V7jTzmMYz62zz]{Persuasive} feat, you gain
        a bonus on Diplomacy checks (see Feats).</p><h2>Calling for the
        Guards</h2><p><strong>Source</strong>
        @Source[PZO1114;pages=204]</p><p>It’s inevitable—sooner or later, the
        PCs will want to call upon the town guard or cause a situation where
        citizens do so instead. Calling for the guard requires a Diplomacy check
        modified by the settlement’s law modifier. It’s only a DC 5 check to
        call for the guard—with a success, the guards generally arrive on the
        scene in 1d6 minutes. Every 5 points by which the Diplomacy check
        exceeds DC 5 (rounding down) reduces the arrival time by 1 minute—if
        this reduces their arrival time below 1 minute, the increments of
        reduction instead change to 1 round. For example, Ezren is being mugged
        by thugs and calls for the guard. The result of his Diplomacy check is a
        23, and the GM rolls a 2 on 1d6 to determine how long it’ll be before
        the guards arrive. Since Ezren rolled three times the amount he needed,
        the 2-minute wait time is reduced to 8 rounds.</p><h2>Directing
        Crowds</h2><p><strong>Source</strong>
        @Source[PZO1110;pages=436]</p><p>It takes a DC 15 Diplomacy check or DC
        20
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.KNn8uxHu23phKC0y]{Intimidate}
        check to convince a crowd to move in a particular direction, and the
        crowd must be able to hear or see the character making the attempt. It
        takes a full-round action to make the Diplomacy check, but only a free
        action to make the
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.KNn8uxHu23phKC0y]{Intimidate}
        check.</p><h1>Hypnotism</h1><p><strong>Source</strong>
        @Source[PZO1132;pages=195]</p><p>You use the power of suggestion and
        subtle psychic influence to alter a subject’s mind and dredge up
        repressed memories.</p><p><strong>Check:</strong> You can use hypnotism
        once per day. The DC of a Diplomacy check to hypnotize is 20 + the
        subject’s Will save modifier against mind-affecting enchantment
        (compulsion) effects. All uses of hypnotism are mind-affecting
        enchantment (compulsion) effects.</p><p><strong>Implant
        Suggestion:</strong> You can implant a suggested course of reasonable
        action in the mind of a willing creature, along with a defined trigger.
        To implant a suggestion, you spend 1 minute inducing a trance-like state
        in the subject, after which you attempt a Diplomacy check. If the check
        is successful, you implant the course of action, as a suggestion spell
        with a duration of 10 minutes plus 10 additional minutes for every 1 by
        which your check result exceeds the DC. If the subject ceases to be
        willing, it can attempt a Will save once each round to shake off the
        effects. The save DC is equal to 10 + 1/2 your character level + your
        Charisma modifier. You can attempt to subtly implant a suggestion in the
        mind of an unwilling creature with an attitude of indifferent or better
        after 1 minute of continuous, calm interaction with that creature, but
        the DC is 10 higher.</p><p><strong>Recall Memory:</strong> You can draw
        out forgotten memories from a willing subject. You spend 1 minute
        inducing a calming, trance-like state in the subject, after which you
        attempt a Diplomacy check. If you succeed at the check, the hypnotized
        creature can reroll any previously failed Intelligence or Knowledge
        check to recall the forgotten information with a +4 bonus. The
        information must be something the subject once knew or was exposed
        to.</p><p><strong>Action:</strong> Hypnotism takes 1 minute of calm
        interaction.</p><p><strong>Try Again:</strong> Yes. You can try to
        hypnotize the same creature more than once, but only once per
        day.</p><h2>Occult Skill Unlocks</h2><p>Characters capable of casting
        psychic spells or who have the Psychic Sensitivity feat gain access to
        skill unlocks—a host of esoteric skill uses not available to other PCs.
        These are not entirely new skills, but rather new uses of existing
        skills for those trained in the occult arts. A character must be trained
        in the appropriate skill to use that skill’s unlock, even if the skill
        can normally be used untrained. It’s impossible to take 10 for an occult
        skill unlock. Occult skill unlocks require intense concentration and
        strenuous effort, so the amount a character can use each skill unlock is
        limited to once per day or per week. This limit is for all uses of the
        skill unlock; if a character uses hypnotism to implant a suggestion, he
        can’t also use it to recall memories on the same day.</p><h1>Skill
        Unlock</h1><p><strong>Source</strong>
        @Source[PZO1131;pages=83]</p><p>With sufficient ranks in Diplomacy, you
        earn the following.</p><p><strong>5 Ranks:</strong> The time required to
        influence a creature’s attitude or gather information is
        halved.</p><p><strong>10 Ranks:</strong> You can attempt to adjust a
        creature’s attitude in 1 round by taking a –10 penalty. If you take 1
        minute to adjust a creature’s attitude, add your Charisma bonus to the
        number of hours that attitude change persists.</p><p><strong>15
        Ranks:</strong> You can attempt to adjust a creature’s attitude in 1
        round with no penalty. If you take 1 minute to adjust a creature’s
        attitude, the duration of the resulting change is measured in days, not
        hours. You can gather information in 10 minutes by taking a –5
        penalty.</p><p><strong>20 Ranks:</strong> You can attempt to adjust a
        creature’s attitude in 1 round with no penalty. If you take 1 minute to
        adjust a creature’s attitude, the duration of the resulting change is
        measured in weeks, not hours. You can gather information in 1d4 minutes
        with no penalty.</p>
      format: 1
    title:
      level: 1
      show: true
    type: text
  - _id: cSdUATLHBFfw3v4s
    _key: '!journal.pages!x175kVqUfLGPt8tC.cSdUATLHBFfw3v4s'
    _stats:
      coreVersion: '12.331'
    name: Disable Device
    sort: 700000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1110;pages=94]</p><p><em>You are
        skilled at disarming traps and opening locks. In addition, this skill
        lets you sabotage simple mechanical devices, such as catapults, wagon
        wheels, and doors.</em></p><p><strong>Check:</strong> When disarming a
        trap or other device, the Disable Device check is made secretly, so that
        you don’t necessarily know whether you’ve succeeded.</p><p>The DC
        depends on how tricky the device is. If the check succeeds, you disable
        the device. If it fails by 4 or less, you have failed but can try again.
        If you fail by 5 or more, something goes wrong. If the device is a trap,
        you trigger it. If you’re attempting some sort of sabotage, you think
        the device is disabled, but it still works normally.</p><p>You also can
        rig simple devices such as saddles or wagon wheels to work normally for
        a while and then fail or fall off some time later (usually after 1d4
        rounds or minutes of
        use).</p><table><thead><tr><td>Device</td><td>Time</td><td>Disable
        Device
        DC*</td><td>Example</td></tr></thead><tbody><tr><td>Simple</td><td>1
        round</td><td>10</td><td>Jam a lock</td></tr><tr><td>Tricky</td><td>1d4
        rounds</td><td>15</td><td>Sabotage a wagon
        wheel</td></tr><tr><td>Difficult</td><td>2d4
        rounds</td><td>20</td><td>Disarm a trap, reset a
        trap</td></tr><tr><td>Extreme</td><td>2d4
        rounds</td><td>25</td><td>Disarm a complex trap, cleverly sabotage a
        clockwork device</td></tr></tbody></table><p><sup>* If you attempt to
        leave behind no trace of your tampering, add 5 to the
        DC.</sup></p><table><thead><tr><td>Lock Quality</td><td>Disable Device
        DC</td></tr></thead><tbody><tr><td>Simple</td><td>20</td></tr><tr><td>Average</td><td>25</td></tr><tr><td>Good</td><td>30</td></tr><tr><td>Superior</td><td>40</td></tr></tbody></table><p><strong>Open
        Locks:</strong> The DC for opening a lock depends on its quality. If you
        do not have a set of thieves’ tools, these DCs increase by
        10.</p><p><strong>Action:</strong> The amount of time needed to make a
        Disable Device check depends on the task, as noted above. Disabling a
        simple device takes 1 round and is a full-round action. A tricky or
        difficult device requires 1d4 or 2d4 rounds. Attempting to open a lock
        is a full-round action.</p><p><strong>Try Again:</strong> Varies. You
        can retry checks made to disable traps if you miss the check by 4 or
        less. You can retry checks made to open
        locks.</p><p><strong>Special:</strong> If you have the
        @UUID[Compendium.pf1.feats.SMyexRzOm5PfjT5I]{Deft Hands} feat, you get a
        bonus on Disable Device checks (see Feats).</p><p>A rogue who beats a
        trap’s DC by 10 or more can study the trap, figure out how it works, and
        bypass it without disarming it. A rogue can rig a trap so her allies can
        bypass it as well.</p><p><strong>Restriction:</strong> Characters with
        the @UUID[Compendium.pf1.class-abilities.pEODJDoTk7uhCZY7]{Trapfinding}
        (like rogues) can disarm magic traps. A magic trap generally has a DC of
        25 + the level of the spell used to create it.</p><p>The spells
        @UUID[Compendium.pf1.spells.vi5fko8sb8mxlk0i]{Fire Trap},
        @UUID[Compendium.pf1.spells.53dyu81yaw4y0nz4]{Glyph of Warding}, symbol,
        and @UUID[Compendium.pf1.spells.if867t28tu6zxaei]{Teleportation Circle}
        also create traps that a rogue can disarm with a successful Disable
        Device check. @UUID[Compendium.pf1.spells.tog7q2uezhexxp92]{Spike
        Growth} and @UUID[Compendium.pf1.spells.hfyycpn0wdimx1n9]{Spike Stones},
        however, create magic hazards against which Disable Device checks do not
        succeed. See the individual spell descriptions for
        details.</p><h1>Technology</h1><p><strong>Source</strong>
        @Source[PZO9272;pages=5]</p><p>With the Technologist feat, you can use
        Disable Device to arm or disarm high-tech explosives or disable
        electronic triggers or locks. The Technologist feat is not required to
        disable a high-tech trap or object, but such traps and objects often
        have significantly higher DCs to disable than low-tech versions of a
        similar device would have.</p><p><strong>Arm Explosive:</strong> If you
        possess a detonator, you can arm an explosive weapon as a trap.
        Connecting a detonator to an explosive requires a successful DC 10
        Disable Device check. Failure means that the attempt fails, but you can
        attempt to arm the explosive again. Failure by 5 or more means the
        explosive is triggered as the detonator is installed. You can attempt to
        make an explosive difficult to disarm. To do so, choose a target disarm
        DC of 15 or higher, with a DC increment of 5. This becomes your target
        DC to set the explosive as well as the DC to disarm the
        explosive.</p><p><strong>Disable Electronic Lock or Trigger:</strong>
        Disabling an electronic lock on a door or an electronic trigger for a
        trap (not the trap itself) is easier if you use an e-pick—without an
        e-pick, you take a -5 penalty on such checks.</p><p><strong>Disarm
        Explosive:</strong> Disarming an explosive requires the character to
        succeed at a Disable Device check as if disarming a trap. The DC is
        usually 10, unless the person who set the explosive successfully did so
        with a higher disarm DC. A failure to disarm an explosive by 5 or more
        immediately triggers the explosive.</p><p><strong>Special:</strong> A
        character can take 10 when using Disable Device to arm or disarm
        explosives, but cannot take 20.</p><p><strong>Time:</strong> Arming an
        explosive device takes 1 minute or more, depending on the scope of the
        job. Disarming an explosive is treated as if the explosive were a
        complex trap, and takes 2d4 rounds to attempt.</p><h1>Skill
        Unlock</h1><p><strong>Source</strong>
        @Source[PZO1131;pages=83]</p><p>With sufficient ranks in Disable Device,
        you earn the following.</p><p><strong>5 Ranks:</strong> Reduce the time
        required to disarm a trap or open a lock by taking a –5 penalty on your
        Disable Device check for each step by which you reduce the time
        required: 2d4 rounds, 1d4 rounds, 1 round, a standard action, a move
        action, a swift action.</p><p><strong>10 Ranks:</strong> You can disarm
        magical traps at a –10 penalty even if you lack the trapfinding ability.
        If you possess the trapfinding ability, when attempting to disable magic
        traps, you never trigger them, even if you perform the trigger action
        (such as looking at a symbol). If you fail the check, you can still
        trigger the trap, and you can’t use this ability to bypass
        it.</p><p><strong>15 Ranks:</strong> When attacked by a trap, you can
        attempt a Disable Device check as an immediate action (adding your trap
        sense bonus, if any) opposed by the trap’s attack roll or its save DC.
        If you succeed, you take half damage (or no damage if you exceed the DC
        by at least 10).</p><p><strong>20 Ranks:</strong> You halve the
        penalties for performing a quick disarm as described in the 5 Ranks
        entry. If you possess the trapfinding ability and accept a –20 penalty
        while using the ability unlocked at 15 ranks, all nearby allies gain the
        benefit, and you disable the trap as an immediate action before it can
        trigger if you exceed the DC by at least 10.</p>
      format: 1
    title:
      level: 1
      show: true
    type: text
  - _id: xg25z3GIpS590NDW
    _key: '!journal.pages!x175kVqUfLGPt8tC.xg25z3GIpS590NDW'
    _stats:
      coreVersion: '12.331'
    name: Disguise
    sort: 800000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1110;pages=95]</p><p><em>You are
        skilled at changing your appearance.</em></p><p><strong>Check:</strong>
        Your Disguise check result determines how good the disguise is, and it
        is opposed by others’
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.2h6hz5AkTDxKPFxr]{Perception}
        check results. If you don’t draw any attention to yourself, others do
        not get to make
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.2h6hz5AkTDxKPFxr]{Perception}
        checks. If you come to the attention of people who are suspicious (such
        as a guard who is watching commoners walking through a city gate), it
        can be assumed that such observers are taking 10 on their
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.2h6hz5AkTDxKPFxr]{Perception}
        checks.</p><p>You get only one Disguise check per use of the skill, even
        if several people make
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.2h6hz5AkTDxKPFxr]{Perception}
        checks against it. The Disguise check is made secretly, so that you
        can’t be sure how good the result is.</p><p>The effectiveness of your
        disguise depends on how much you’re changing your appearance. Disguise
        can be used to make yourself appear like a creature that is one size
        category larger or smaller than your actual size. This does not change
        your actual size or reach, should you enter combat while wearing such a
        disguise.</p><table><thead><tr><td>Disguise</td><td>Check
        Modifier</td></tr></thead><tbody><tr><td>Minor details
        only</td><td>+5</td></tr><tr><td>Disguised as different
        gender<sup>1</sup></td><td>–2</td></tr><tr><td>Disguised as different
        race<sup>1</sup></td><td>–2</td></tr><tr><td>Disguised as different age
        category<sup>1</sup></td><td>–2<sup>2</sup></td></tr><tr><td>Disguised
        as different size
        category<sup>1</sup></td><td>–10</td></tr></tbody></table><p><sup>1
        These modifiers are cumulative; use all that apply.</sup><br /><sup>2
        Per step of difference between your actual age category and your
        disguised age category. The steps are: young (younger than adulthood),
        adulthood, middle age, old, and
        venerable.</sup></p><table><thead><tr><td>Familiarity</td><td>Viewer’s
        Perception Check Bonus</td></tr></thead><tbody><tr><td>Recognizes on
        sight</td><td>+4</td></tr><tr><td>Friends or
        associates</td><td>+6</td></tr><tr><td>Close
        friends</td><td>+8</td></tr><tr><td>Intimate</td><td>+10</td></tr></tbody></table><p>If
        you are impersonating a particular individual, those who know what that
        person looks like get a bonus on their Perception checks according to
        the table below. Furthermore, they are automatically considered to be
        suspicious of you, so opposed checks are always called for.</p><p>An
        individual makes a
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.2h6hz5AkTDxKPFxr]{Perception}
        check to see through your disguise immediately upon meeting you and
        again every hour thereafter. If you casually meet a large number of
        different creatures, each for a short time, check once per day or hour,
        using an average Perception modifier for the
        group.</p><p><strong>Action:</strong> Creating a disguise requires 1d3 ×
        10 minutes of work. Using magic (such as the
        @UUID[Compendium.pf1.spells.oj36nfak6jc2s5ky]{Disguise Self} spell)
        reduces this action to the time required to cast the spell or trigger
        the effect.</p><p><strong>Try Again:</strong> Yes. You may try to redo a
        failed disguise, but once others know that a disguise was attempted,
        they’ll be more suspicious.</p><p><strong>Special:</strong> Magic that
        alters your form, such as
        @UUID[Compendium.pf1.spells.kouqz0pm1xl8xilm]{Alter Self},
        @UUID[Compendium.pf1.spells.oj36nfak6jc2s5ky]{Disguise Self},
        @UUID[Compendium.pf1.spells.d40ia71c2eljm91k]{Polymorph}, or
        @UUID[Compendium.pf1.spells.n3lp01euzcdmtbw5]{Shapechange}, grants you a
        +10 bonus on Disguise checks (see the individual spell descriptions).
        Divination magic that allows people to see through illusions (such as
        true seeing) does not penetrate a mundane disguise, but it can negate
        the magical component of a magically enhanced one.</p><p>You must make a
        Disguise check when you cast a simulacrum spell to determine how good
        the likeness is.</p><p>If you have the
        @UUID[Compendium.pf1.feats.SUACufUXl12sUvnQ]{Deceitful} feat, you gain a
        bonus on Disguise checks (see Feats).</p><h1>Skill
        Unlock</h1><p><strong>Source</strong>
        @Source[PZO1131;pages=83]</p><p>With sufficient ranks in Disguise, you
        earn the following.</p><p><strong>5 Ranks:</strong> You can create a
        disguise in 1d3 minutes.</p><p><strong>10 Ranks:</strong> You can create
        a disguise in 1d3 rounds. If you take the full normal amount of time to
        create your disguise, you take no penalty for disguising your gender,
        race, or age category.</p><p><strong>15 Ranks:</strong> You can create a
        disguise as a full-round action.</p><p><strong>20 Ranks:</strong> You
        can create a disguise as a standard action, or as a full-round action
        combined with a
        @UUID[Compendium.pf1.pf1e-rules.x175kVqUfLGPt8tC.JournalEntryPage.kRK5XwVBvcMi35w2]{Bluff}
        check to create a diversion to hide.</p>
      format: 1
    title:
      level: 1
      show: true
    type: text
  - _id: DTNlXXg77s3178WJ
    _key: '!journal.pages!x175kVqUfLGPt8tC.DTNlXXg77s3178WJ'
    _stats:
      coreVersion: '12.331'
    name: Escape Artist
    sort: 900000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1110;pages=95]</p><p><em>Your
        training allows you to slip out of bonds and escape from
        grapples.</em></p><p><strong>Check:</strong> The table below gives the
        DCs needed to escape various forms of
        restraints.</p><p><strong>Ropes:</strong> The DC of your Escape Artist
        check is equal to the binder’s Combat Maneuver Bonus
        +20.</p><p><strong>Manacles and Masterwork Manacles:</strong> The DC for
        manacles is set by their construction (see the table
        below).</p><p><strong>Tight Space:</strong> The DC noted is for getting
        through a space through which your head fits but your shoulders don’t.
        If the space is long, you may need to make multiple checks. You can’t
        squeeze through a space that your head does not fit
        through.</p><p><strong>Grappler:</strong> You can make an Escape Artist
        check in place of a combat maneuver check to escape a grapple (see
        Combat) or a pin.</p><table><thead><tr><td>Restraint</td><td>Escape
        Artist DC</td></tr></thead><tbody><tr><td>Rope/bindings</td><td>Binder’s
        CMB +20</td></tr><tr><td>Net, animate rope, command plants, control
        plants, or entangle</td><td>20</td></tr><tr><td>Snare
        spell</td><td>23</td></tr><tr><td>Manacles</td><td>30</td></tr><tr><td>Tight
        space</td><td>30</td></tr><tr><td>Masterwork
        manacles</td><td>35</td></tr><tr><td>Grappler</td><td>Grappler’s
        CMD</td></tr></tbody></table><p><strong>Action:</strong> Making an
        Escape Artist check to escape from rope bindings, manacles, or other
        restraints (except a grappler) requires 1 minute of work. Escaping from
        a net or an animate rope, command plants, control plants, or entangle
        spell is a full-round action. Escaping from a grapple or pin is a
        standard action. Squeezing through a tight space takes at least 1
        minute, maybe longer, depending on how long the space
        is.</p><p><strong>Try Again:</strong> Varies. You can make another check
        after a failed check if you’re squeezing your way through a tight space,
        making multiple checks. If the situation permits, you can make
        additional checks, or even take 20, as long as you’re not being actively
        opposed. If the DC to escape from rope or bindings is higher than 20 +
        your Escape Artist skill bonus, you cannot escape from the bonds using
        Escape Artist.</p><p><strong>Special:</strong> If you have the
        @UUID[Compendium.pf1.feats.f5FPqAYWlKj3zCIY]{Stealthy} feat, you gain a
        bonus on Escape Artist checks (see Feats).</p><h1>Skill
        Unlock</h1><p><strong>Source</strong>
        @Source[PZO1131;pages=94]</p><p>With sufficient ranks in Escape Artist,
        you earn the following.</p><p><strong>5 Ranks:</strong> If you take a
        –10 penalty, the time required to use this skill is halved; escaping a
        grapple or pin is a move action, and escaping a net, animate rope,
        command plants, or control plants spell is a standard
        action.</p><p><strong>10 Ranks:</strong> You can attempt to escape from
        any entangling effect as a standard action with an Escape Artist check
        (DC = the effect’s save DC + 10). You can attempt an Escape Artist check
        as a move action to set the DC for a creature to escape from ropes or
        bindings; you gain a +10 bonus on the check if you instead attempt it as
        a full-round action.</p><p><strong>15 Ranks:</strong> You can escape any
        entangling effect (as above) as a move action. As a standard action, you
        can attempt an Escape Artist check (DC = the effect’s save DC + 20) to
        suppress a slow or paralysis effect for 1 round, plus 1 round for every
        5 by which you exceed the DC. This action counts as purely mental for
        the purpose of being able to take it while paralyzed.</p><p><strong>20
        Ranks:</strong> You can escape being entangled, grappled, or pinned as
        an immediate action with an Escape Artist check (DC = the effect’s DC +
        10 or the attacker’s CMB + 10). You can attempt to suppress a slow or
        paralysis effect as a standard action (increasing the DC by 10), a move
        action (increasing the DC by 15), or an immediate action (increasing the
        DC by 20).</p>
      format: 1
    title:
      level: 1
      show: true
    type: text
  - _id: iH69GIwm8BjecrPN
    _key: '!journal.pages!x175kVqUfLGPt8tC.iH69GIwm8BjecrPN'
    _stats:
      coreVersion: '12.331'
    name: Fly
    sort: 1000000
    text:
      content: >-
        <p><strong>Source</strong> @Source[PZO1110;pages=96]</p><p><em>You are
        skilled at flying, through either the use of wings or magic, and can
        perform daring or complex maneuvers while airborne. Note that this skill
        does not give you the ability to fly.</em></p><p><strong>Check:</strong>
        You generally need only make a Fly check when you are attempting a
        complex maneuver. Without making a check, a flying creature can remain
        flying at the end of its turn so long as it moves a distance greater
        than half its speed. It can also turn up to 45 degrees by sacrificing 5
        feet of movement, can rise at half speed at an angle of 45 degrees, and
        can descend at any angle at normal speed. Note that these restrictions
        only apply to movement taken during your current turn. At the beginning
        of the next turn, you can move in a different direction than you did the
        previous turn without making a check. Taking any action that violates
        these rules requires a Fly check. The difficulty of these maneuvers
        varies depending upon the maneuver you are attempting, as noted on the
        following chart.</p><table><thead><tr><td>Flying Maneuver</td><td>Fly
        DC</td></tr></thead><tbody><tr><td>Move less than half speed and remain
        flying</td><td>10</td></tr><tr><td>Hover</td><td>15</td></tr><tr><td>Turn
        greater than 45° by spending 5 feet of
        movement</td><td>15</td></tr><tr><td>Turn 180° by spending 10 feet of
        movement</td><td>20</td></tr><tr><td>Fly up at greater than 45°
        angle</td><td>20</td></tr></tbody></table><p><strong>Attacked While
        Flying:</strong> You are not considered flat-footed while flying. If you
        are flying using wings and you take damage while flying, you must make a
        DC 10 Fly check to avoid losing 10 feet of altitude. This descent does
        not provoke an attack of opportunity and does not count against a
        creature’s movement.</p><p><strong>Collision While Flying:</strong> If
        you are using wings to fly and you collide with an object equal to your
        size or larger, you must immediately make a DC 25 Fly check to avoid
        plummeting to the ground, taking the appropriate falling
        damage.</p><p><strong>Avoid Falling Damage:</strong> If you are falling
        and have the ability to fly, you can make a DC 10 Fly check to negate
        the damage. You cannot make this check if you are falling due to a
        failed Fly check or a collision.</p><p><strong>High Wind
        Speeds:</strong> Flying in high winds adds penalties on your Fly checks
        as noted on Table: Wind Effects on Flight. "Checked" means that
        creatures of that size or smaller must succeed on a DC 20 Fly check to
        move at all so long as the wind persists. "Blown away" means that
        creatures of that size or smaller must make a DC 25 Fly check or be
        blown back 2d6 × 10 feet and take 2d6 points of nonlethal damage. This
        check must be made every round the creature remains airborne. A creature
        that is blown away must still make a DC 20 Fly check to move due to also
        being checked.</p><table><thead><tr><td>Wind Force</td><td>Wind
        Speed</td><td>Checked Size</td><td>Blown Away Size</td><td>Fly
        Penalty</td></tr></thead><tbody><tr><td>Light</td><td>0–10
        mph</td><td>—</td><td>—</td><td>—</td></tr><tr><td>Moderate</td><td>11–20
        mph</td><td>—</td><td>—</td><td>—</td></tr><tr><td>Strong</td><td>21–30
        mph</td><td>Tiny</td><td>—</td><td>–2</td></tr><tr><td>Severe</td><td>31–50
        mph</td><td>Small</td><td>Tiny</td><td>–4</td></tr><tr><td>Windstorm</td><td>51–74
        mph</td><td>Medium</td><td>Small</td><td>–8</td></tr><tr><td>Hurricane</td><td>75–174
        mph</td><td>Large</td><td>Medium</td><td>–12</td></tr><tr><td>Tornado</td><td>175+
        mph</td><td>Huge</td><td>Large</td><td>–16</td></tr></tbody></table><p><strong>Action:</strong>
        None. A Fly check doesn’t require an action; it is made as part of
        another action or as a reaction to a situation.</p><p><strong>Try
        Again:</strong> Varies. You can attempt a Fly check to perform the same
        maneuver on subsequent rounds. If you are using wings and you fail a Fly
        check by 5 or more, you plummet to the ground, taking the appropriate
        falling damage (see Environment).</p><p><strong>Special:</strong> A
        spellcaster with a bat familiar gains a +3 bonus on Fly
        checks.</p><p>Creatures with a fly speed treat the Fly skill as a class
        skill. A creature with a natural fly speed receives a bonus (or penalty)
        on Fly skill checks depending on its maneuverability: Clumsy –8, Poor
        –4, Average +0, Good +4, Perfect +8. Creatures without a listed
        maneuverability rating are assumed to have average
        maneuverability.</p><p>A creature larger or smaller than Medium takes a
        size bonus or penalty on Fly checks depending on its size category: Fine
        +8, Diminutive +6, Tiny +4, Small +2, Large –2, Huge –4, Gargantuan –6,
        Colossal –8.</p><p>You cannot take ranks in this skill without a natural
        means of flight or gliding. Creatures can also take ranks in Fly if they
        possess a reliable means of flying every day (either through a spell or
        other special ability).</p><p>If you have the
        @UUID[Compendium.pf1.feats.jCxcObXJfdDrx4WS]{Acrobatic} feat, you get a
        bonus on Fly checks (see Feats).</p><h1>Skill
        Unlock</h1><p><strong>Source</strong>
        @Source[PZO1131;pages=84]</p><p>With sufficient ranks in Fly, you earn
        the following.</p><p><strong>5 Ranks:</strong> A successful DC 20 Fly
        check allows you to make a 45-degree turn without sacrificing
        movement.</p><p><strong>10 Ranks:</strong> A successful DC 30 Fly check
        allows you to ascend at a 45-degree angle at full speed. You treat falls
        after midair collisions as 10 feet shorter with a successful DC 10 Fly
        check, plus 10 feet for every 10 points by which you exceed the
        DC.</p><p><strong>15 Ranks:</strong> A successful DC 30 Fly check allows
        you to make a 90-degree turn without sacrificing movement, or a
        180-degree turn by sacrificing 5 feet of movement. You are considered
        one size category larger when determining wind effects on Fly
        checks.</p><p><strong>20 Ranks:</strong> A successful DC 35 Fly check
        allows you to fly straight up at full speed. You are considered two size
        categories larger when determining wind effects on Fly checks.</p>
