  description:
    value: >-
      <p>This spell functions as
      @UUID[Compendium.pf1.spells.Item.g0x2fnktg1553wv1]{symbol of death},
      except that all creatures within 40 feet of the <em>Symbol of
      Dispelling</em> are instead affected as if by the area dispel function of
      <em>greater dispel magic</em>.</p><p>Attempt a dispel check when casting
      <em>Symbol of Dispelling</em>.</p><p>Once the symbol is triggered, apply
      the result of that check to each creature in the area, as well as each
      object that is the target of one or more spells. Unlike <em>symbol of
      death</em>, <em>Symbol of Dispelling</em> grants no saving throws, and it
      is not subject to spell resistance.</p>
