    value: >-
      <p>This spell functions like
      @UUID[Compendium.pf1.spells.Item.k0k8gvqyy3rd5gke]{death knell}, except
      instead of using the slain target's life energy to enhance yourself, you
      use it to summon a Small fire elemental resembling a burning, howling
