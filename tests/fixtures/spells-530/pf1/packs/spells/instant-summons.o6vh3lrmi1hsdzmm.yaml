  description:
    value: >-
      <p>You call some nonliving item directly to your hand from virtually any
      location.</p><p>First, you must place your <i>arcane mark</i> on the item.
      Then you cast this spell, which magically and invisibly inscribes the name
      of the item on a sapphire worth at least 1,000 gp. Thereafter, you can
      summon the item by speaking a special word (set by you when the spell is
      cast) and crushing the gem. The item appears instantly in your hand. Only
      you can use the gem in this way.</p><p>If the item is in the possession of
      another creature, the spell does not work, but you know who the possessor
      is and roughly where that creature is located when the summons
      occurs.</p><p>The inscription on the gem is invisible. It is also
      unreadable, except by means of a <i>read magic</i> spell, to anyone but
      you.</p><p>The item can be summoned from another plane, but only if no
      other creature has claimed ownership of it.</p>
